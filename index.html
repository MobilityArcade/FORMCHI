<title>AKI 7.1.5 — Write Above / Cameras Below</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#020304}
body{overflow:hidden;font-family:system-ui,-apple-system,sans-serif}
.presence{position:relative;width:100%;height:100dvh;overflow:hidden;isolation:isolate;background:radial-gradient(circle at 50% 47%,#0e1420 0,#070a10 42%,#030507 76%,#020304 100%);cursor:default;-webkit-tap-highlight-color:transparent}
.ambient{position:absolute;inset:-18%;background:radial-gradient(circle at 50% 48%,rgba(20,82,145,.10) 0 18%,rgba(72,30,112,.07) 34%,rgba(8,10,16,.03) 54%,transparent 72%);filter:blur(48px);animation:ambient 14s ease-in-out infinite}
.orb{position:absolute;left:50%;top:48%;width:min(88vw,700px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:#010207;box-shadow:0 0 24px rgba(93,218,255,.14),0 0 70px rgba(65,126,255,.15),0 0 124px rgba(150,53,255,.10);animation:orbBreath 8.4s ease-in-out infinite;transition:filter .9s ease,transform .9s ease}
.halo,.rim,.oil,.oil2,.core{position:absolute;border-radius:50%;pointer-events:none}
.halo{inset:-7%;background:conic-gradient(from 205deg,rgba(16,199,255,0),rgba(26,195,255,.34),rgba(83,77,255,.34),rgba(216,65,255,.28),rgba(255,104,178,.22),rgba(255,159,93,.18),rgba(34,210,255,.22),rgba(16,199,255,0));filter:blur(30px);opacity:.68;animation:oilTurn 34s linear infinite}
.rim{inset:-1.2%;background:conic-gradient(from 220deg,rgba(255,127,194,.92),rgba(161,70,255,.94),rgba(75,116,255,.97),rgba(79,231,255,.98),rgba(225,247,255,.93),rgba(75,207,255,.94),rgba(110,73,255,.92),rgba(231,70,255,.92),rgba(255,149,103,.88),rgba(255,127,194,.92));filter:blur(3.8px) saturate(1.28);opacity:.91;animation:oilTurn 31s linear infinite}
.rim:after{content:"";position:absolute;inset:1.9%;border-radius:50%;background:rgba(1,2,7,.93);filter:blur(3px)}
.oil{inset:1.2%;background:conic-gradient(from 18deg,transparent 0 4%,rgba(35,212,255,.88) 10%,rgba(56,113,255,.74) 19%,rgba(172,60,255,.84) 30%,rgba(255,65,189,.72) 39%,rgba(255,156,92,.66) 47%,transparent 55% 65%,rgba(22,207,255,.84) 74%,rgba(100,73,255,.78) 84%,rgba(228,75,255,.67) 91%,transparent 98%);filter:blur(12px) saturate(1.45);opacity:.92;animation:oilTurn 28s linear infinite}
.oil:after{content:"";position:absolute;inset:8.5%;border-radius:50%;background:rgba(1,2,7,.91);filter:blur(11px)}
.oil2{inset:4%;background:conic-gradient(from 160deg,transparent 0 10%,rgba(255,83,190,.52) 19%,rgba(115,65,255,.66) 31%,rgba(30,204,255,.70) 43%,transparent 55% 70%,rgba(255,135,82,.43) 80%,rgba(130,64,255,.54) 91%,transparent);filter:blur(20px) saturate(1.38);opacity:.68;animation:oilTurn2 38s linear infinite}
.oil2:after{content:"";position:absolute;inset:13.5%;border-radius:50%;background:rgba(1,2,7,.88);filter:blur(14px)}
/* 4.5: center is no longer a crisp black disk. Its edge feathers into the torus. */
.core{inset:11.5%;background:radial-gradient(circle at 44% 38%,rgba(9,24,44,.28) 0%,rgba(1,2,7,.985) 55%,rgba(1,2,7,.96) 78%,rgba(1,2,7,.82) 87%,rgba(1,2,7,.48) 94%,rgba(1,2,7,.12) 98%,transparent 100%);box-shadow:inset 0 0 88px rgba(46,112,190,.08);filter:blur(2.4px)}
.mark{position:absolute;z-index:8;left:50%;top:48%;transform:translate(-50%,-50%);width:min(48vw,360px);height:auto;opacity:.23;filter:blur(.32px) drop-shadow(0 0 4px rgba(154,216,255,.05));transition:opacity .55s ease,filter .55s ease;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.mark path{fill:none;stroke:rgba(222,231,241,.76);stroke-width:1.02;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.mark.on{opacity:.72;filter:blur(.28px) drop-shadow(0 0 7px rgba(154,216,255,.16))}
.mark.starting{opacity:.47}
.mark.error{opacity:.16}
/* AKI 4.7: constant presence. Conversation state never changes the torus. */
@keyframes ambient{0%,100%{transform:scale(.98);opacity:.58}50%{transform:scale(1.025);opacity:.78}}
@keyframes orbBreath{0%,100%{transform:translate(-50%,-50%) scale(.982)}50%{transform:translate(-50%,-50%) scale(1.012)}}
@keyframes oilTurn{to{transform:rotate(360deg)}}@keyframes oilTurn2{to{transform:rotate(-360deg)}}
.write-layer{position:absolute;z-index:20;left:max(7vw,22px);right:max(7vw,22px);top:max(calc(env(safe-area-inset-top) + 7vh),86px);height:clamp(82px,14vh,150px);display:none;align-items:flex-start;pointer-events:none}
.write-layer.open{display:flex}
#writeBox{width:100%;max-height:100%;resize:none;overflow:auto;border:0;outline:0;background:transparent;color:rgba(238,247,255,.92);font:300 clamp(18px,4.7vw,30px)/1.35 system-ui,-apple-system,sans-serif;letter-spacing:.01em;padding:8px 0 12px;caret-color:#65e8ff;text-shadow:0 0 12px rgba(99,211,255,.12);pointer-events:auto}
#writeBox::placeholder{color:rgba(204,214,232,.38)}
@media(max-width:600px){.orb{width:88vw}.mark{width:47vw}}
@media(prefers-reduced-motion:reduce){.ambient,.orb,.halo,.rim,.oil,.oil2{animation:none!important}}
</style>

<style id="aki-icon-match">
/* 4.7 icon-match visual refinement */
.mark{
  border:0!important; outline:0!important; background:transparent!important;
  box-shadow:none!important; border-radius:50%!important;
  -webkit-tap-highlight-color:transparent!important;
}
.mark:focus,.mark:focus-visible,.mark:active{
  border:0!important; outline:0!important; background:transparent!important;
  box-shadow:none!important;
}
.mark.on{
  opacity:1!important;
  filter:drop-shadow(0 0 1px rgba(255,255,255,1))
         drop-shadow(0 0 4px rgba(190,235,255,.98))
         drop-shadow(0 0 10px rgba(55,190,255,.78))!important;
}
.mark.on path{
  stroke:#f8fdff!important; stroke-opacity:1!important;
  stroke-width:2.35!important; stroke-linecap:round!important; stroke-linejoin:round!important;
}
.rim,.oil,.oil2{
  filter:saturate(1.42) contrast(1.08) brightness(1.10)!important;
}
</style>
</head>
<body>
<main id="app" class="presence" aria-label="AKI">
  <input id="selfiePicker" type="file" accept="image/*" capture="user" hidden aria-hidden="true">
  <input id="worldPicker" type="file" accept="image/*" capture="environment" hidden aria-hidden="true">
  <input id="filePicker" type="file" accept="image/*,application/pdf,text/plain,text/markdown,text/csv,application/json,.pdf,.txt,.md,.csv,.json,.doc,.docx,.xls,.xlsx,.ppt,.pptx" hidden aria-hidden="true">
  <form id="writeLayer" class="write-layer" autocomplete="off">
    <textarea id="writeBox" rows="1" aria-label="Type or paste for AKI" placeholder="Type or paste for AKI…"></textarea>
  </form>
  <div class="ambient"></div>
  <div class="orb"><div class="halo"></div><div class="rim"></div><div class="oil"></div><div class="oil2"></div><div class="core"></div></div>
  <svg id="akiButton" class="mark" viewBox="0 0 210 90" role="button" tabindex="0" aria-label="Turn AKI on" aria-pressed="false"><path d="M15 72 L45 18 L75 72 M95 18 L95 72 M96 48 L142 18 M96 48 L144 72 M172 18 L172 72"/></svg>
</main>
<script>
const app=document.querySelector('#app');
const akiButton=document.querySelector('#akiButton');
const selfiePicker=document.querySelector('#selfiePicker');
const worldPicker=document.querySelector('#worldPicker');
const filePicker=document.querySelector('#filePicker');
const writeLayer=document.querySelector('#writeLayer');
const writeBox=document.querySelector('#writeBox');
let pc=null,dc=null,micStream=null,audioEl=null,audioCtx=null;
let starting=false,stopping=false,powered=false,restarting=false;
let transcript='',turnEndAt=0,responseStartAt=0,firstAudioAt=0,lastChime=0;
let latencyTimer=null,hardWatchdog=null,preferenceTimer=null;
let imageBusy=false,shareBusy=false;
let akiVoice=localStorage.getItem('akiVoice')||'marin';
let akiLanguage=localStorage.getItem('akiLanguage')||'auto';

function powerLook(mode){
  akiButton.classList.remove('on','starting','error');
  if(mode==='on'){akiButton.classList.add('on');akiButton.setAttribute('aria-pressed','true');akiButton.setAttribute('aria-label','Turn AKI off')}
  else if(mode==='starting'){akiButton.classList.add('starting');akiButton.setAttribute('aria-pressed','false');akiButton.setAttribute('aria-label','AKI is starting')}
  else if(mode==='error'){akiButton.classList.add('error');akiButton.setAttribute('aria-pressed','false');akiButton.setAttribute('aria-label','AKI connection failed. Tap to retry')}
  else{akiButton.setAttribute('aria-pressed','false');akiButton.setAttribute('aria-label','Turn AKI on')}
}
function chime(){
  const now=Date.now();if(now-lastChime<1800)return;lastChime=now;
  try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();const t=audioCtx.currentTime;
    [523.25,783.99].forEach((f,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=f;
      g.gain.setValueAtTime(0,t+i*.055);g.gain.linearRampToValueAtTime(.022,t+.025+i*.055);g.gain.exponentialRampToValueAtTime(.0001,t+.32+i*.055);
      o.connect(g);g.connect(audioCtx.destination);o.start(t+i*.055);o.stop(t+.36+i*.055)})}catch{}
}
function latency(label,extra={}){console.log('[AKI 7.1.5 latency]',label,{at:new Date().toISOString(),...extra})}
function turnEnded(){
  turnEndAt=performance.now();responseStartAt=firstAudioAt=0;
  latency('user-turn-ended');chime();
  clearTimeout(latencyTimer);clearTimeout(hardWatchdog);
  latencyTimer=setTimeout(()=>{
    if(powered&&!firstAudioAt)latency('slow-response-warning',{waiting_ms:Math.round(performance.now()-turnEndAt)})
  },3000);
  // 4.7 hard escape: never leave a dead Live session hanging indefinitely.
  // This does not fake an answer. It cleanly reconnects AKI if no output audio
  // has begun 15 seconds after a recognized end-of-turn.
  hardWatchdog=setTimeout(async()=>{
    if(powered&&!firstAudioAt&&!restarting){
      latency('15-second-recovery',{waiting_ms:Math.round(performance.now()-turnEndAt)});
      restarting=true;chime();
      await stopAki(true);
      await new Promise(r=>setTimeout(r,220));
      restarting=false;
      await startAki();
    }
  },15000);
}
function responseStarted(){if(responseStartAt)return;responseStartAt=performance.now();latency('response-started',{from_turn_end_ms:turnEndAt?Math.round(responseStartAt-turnEndAt):null})}
function firstAudio(){if(firstAudioAt)return;firstAudioAt=performance.now();clearTimeout(latencyTimer);clearTimeout(hardWatchdog);latency('first-audio',{from_turn_end_ms:turnEndAt?Math.round(firstAudioAt-turnEndAt):null,from_response_start_ms:responseStartAt?Math.round(firstAudioAt-responseStartAt):null})}

function normalizedSpeech(text){
 return (text||'').toLowerCase().replace(/[’]/g,"'").replace(/\s+/g,' ').trim();
}
function voiceIntent(text){
 const t=normalizedSpeech(text);
 // Voice identity is locked by default. Merely SAYING words like man, woman,
 // male, female or voice can never switch AKI.
 const lock=/(keep|save|lock|remember|stay with|stick with).{0,28}(this|current|your).{0,18}voice|i (really )?like (this|your) voice|make this my voice|use this voice (from now on|until i (say|tell) otherwise)/.test(t);
 if(lock)return {kind:'lock'};

 // A voice change requires an explicit first-person command/request directed at AKI.
 const explicit=/(aki[, ]+)?(please )?(change|switch|use|give me|let me hear|i want|i'd like|i would like|i prefer|can you change|could you change|can i have|go back to)/.test(t);
 if(!explicit)return null;
 if(/(male voice|man's voice|voice of a man|masculine voice|voz masculina|voz de hombre)/.test(t))return {kind:'change',voice:'ash'};
 if(/(female voice|woman's voice|voice of a woman|feminine voice|voz femenina|voz de mujer)/.test(t))return {kind:'change',voice:'marin'};
 if(/(different voice|another voice|other voice|change your voice|switch your voice|new voice)/.test(t)){
   const cycle=['marin','cedar','ash'];
   return {kind:'change',voice:cycle[(cycle.indexOf(akiVoice)+1+cycle.length)%cycle.length]};
 }
 return null;
}
async function handleVoiceIntent(text){
 const intent=voiceIntent(text);if(!intent)return;
 if(intent.kind==='lock'){
   localStorage.setItem('akiVoice',akiVoice);
   localStorage.setItem('akiVoiceLocked','true');
   latency('voice-locked',{voice:akiVoice});
   return;
 }
 const v=intent.voice;if(!v||v===akiVoice||restarting)return;
 akiVoice=v;
 // Every deliberately selected voice becomes the persistent voice immediately.
 localStorage.setItem('akiVoice',v);
 localStorage.setItem('akiVoiceLocked','true');
 latency('voice-change-explicit',{voice:v});
 restarting=true;chime();
 await stopAki(true);await new Promise(r=>setTimeout(r,220));restarting=false;await startAki();
}
function absorbTranscript(m){
 // CRITICAL 7.1 FIX: only the USER'S input transcript may control voice identity.
 // AKI's own output transcript is ignored, preventing it from switching itself.
 const type=String(m.type||'').toLowerCase();
 const nested=String(m.event?.type||'').toLowerCase();
 const isInput=/input.*transcript|transcript.*input/.test(type)||/input.*transcript|transcript.*input/.test(nested);
 if(!isInput)return;
 const d=(typeof m.delta==='string'?m.delta:'')||(typeof m.transcript==='string'?m.transcript:'')||(typeof m.event?.delta==='string'?m.event.delta:'')||(typeof m.event?.transcript==='string'?m.event.transcript:'');
 if(d){transcript+=d;clearTimeout(preferenceTimer);preferenceTimer=setTimeout(()=>{const h=transcript;transcript='';handleVoiceIntent(h)},500)}
}

async function stopAki(keepLook=false){
 if(stopping)return;stopping=true;powered=false;clearTimeout(latencyTimer);clearTimeout(hardWatchdog);clearTimeout(preferenceTimer);
 try{dc?.close()}catch{} try{pc?.getSenders?.().forEach(x=>x.track?.stop())}catch{} try{pc?.close()}catch{}
 try{micStream?.getTracks().forEach(t=>{t.enabled=false;t.stop()})}catch{}
 if(audioEl){try{audioEl.pause()}catch{}audioEl.srcObject=null;audioEl.remove();audioEl=null}
 pc=dc=micStream=null;transcript='';if(!keepLook)powerLook('off');stopping=false;
}
async function startAki(){
 if(powered||starting||stopping)return;starting=true;powerLook('starting');
 try{
  audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')await audioCtx.resume();
  micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
  pc=new RTCPeerConnection();audioEl=document.createElement('audio');audioEl.autoplay=true;audioEl.playsInline=true;document.body.appendChild(audioEl);
  pc.ontrack=e=>{audioEl.srcObject=e.streams[0];audioEl.play().catch(()=>{})};micStream.getTracks().forEach(t=>pc.addTrack(t,micStream));
  dc=pc.createDataChannel('oai-events');dc.addEventListener('open',()=>{
    latency('data-channel-open',{voice:akiVoice});
    // AKI 7.1.5 — WRITE ABOVE / CAMERAS BELOW. Three invisible interaction regions; no persistent visible controls.
    try{dc.send(JSON.stringify({type:'session.instructions.append',content:`AKI's core philosophy is "More of you." You are a calm, warm, intelligent thinking companion. The human remains the creator, observer, experiencer and actor. Your job is to help them think, imagine, articulate, explore, practice, decide and get unstuck — not to take over the experience. Listen carefully. Reflect the strongest thread. Ask one useful question at a time when a question helps. When the user's thoughts become complicated, become simpler. Prefer one useful next step over lists, information dumps, menus, workflows or many options. CAPABILITY TRUTH — speak only about capabilities THIS AKI experience actually exposes. AKI can listen and talk. In the negative space ABOVE AKI, the upper-left invisible region opens a temporary writing surface: the iPhone keyboard rises from below while typed or pasted words appear only in the clear space above the sphere; Return sends the words into this same conversation and the writing surface disappears. The upper-right invisible region opens the device's full deliberate handoff chooser, which may offer Photo Library, Take Photo, or Choose File on iPhone. Images are visually analyzed and documents/files are read through their verified handoff paths. The lower-left invisible region opens a one-time front/selfie camera capture; the lower-right invisible region opens a one-time rear/world camera capture. Never advertise these controls unprompted and never recite them as a feature list unless the human explicitly asks how input works. If the human says they cannot talk, wants to type, paste text, or write something, tell them briefly: tap the upper left and type or paste it. If they want to give you a photo, take a photo, or give you a document/file, tell them briefly: tap the upper right and choose what they want to bring in. For a selfie/front photo: tap the lower left. To photograph something in front of them: tap the lower right. The camera actions are deliberate one-time captures, not continuous camera access. Never claim to see/read anything until a verified image or file result has actually arrived. If analysis fails, say it did not come through. AKI has NO continuous camera access, NO continuous visual access, NO screen viewing/sharing, and NO video watching. AKI also has no image generation, device control, reminders/alarms, messaging, purchasing, booking, or external actions unless explicitly supplied. If asked "what can you do?", describe AKI's conversational role rather than reciting features; mention image sharing only if the user's question or context specifically concerns showing you something. Natural multilingual conversation is welcome. Keep ordinary spoken responses concise and human, usually 1–3 short sentences unless the user explicitly asks for depth. If they say "Aki" to begin or regain your attention, respond naturally with "I am here. How can I help you?" The experience should feel like one presence: no visible interface beyond AKI itself.`}))}catch(e){console.warn('AKI philosophy instruction:',e)}
  });
  dc.addEventListener('message',e=>{try{const m=JSON.parse(e.data),type=m.type||'',nested=m.event?.type||'',all=(type+' '+nested).toLowerCase();
    if(type==='session.started'){powered=true;powerLook('on');latency('session-started',{voice:m.session?.audio?.output?.voice||m.session?.voice||akiVoice})}
    absorbTranscript(m);
    if(all.includes('speech_stopped')||all.includes('input_audio_buffer.committed')||all.includes('turn.ended'))turnEnded();
    if(all.includes('response.created')||all.includes('response.in_progress')||all.includes('delegation.created'))responseStarted();
    if(all.includes('output_audio.delta')||all.includes('audio.delta'))firstAudio();
    if(type==='error')console.error('AKI Live event error:',m)
  }catch{}});
  pc.addEventListener('connectionstatechange',()=>{const cs=pc?.connectionState;latency('connection-state',{state:cs});if(['failed','closed'].includes(cs)&&powered&&!restarting)stopAki()});
  const offer=await pc.createOffer();await pc.setLocalDescription(offer);const localSdp=pc.localDescription?.sdp||offer.sdp;
  if(!localSdp||!localSdp.trim().startsWith('v=0'))throw new Error('Browser did not create a valid SDP offer');
  const r=await fetch('/api/aki',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sdp:localSdp,voice:akiVoice,language:akiLanguage})});
  const answer=await r.text();if(!r.ok)throw new Error(answer);await pc.setRemoteDescription({type:'answer',sdp:answer});
  powered=true;powerLook('on');
 }catch(err){console.error('AKI 7.1.5 start error:',err);await stopAki();powerLook('error')}finally{starting=false}
}

function canvasToDataURL(canvas,type='image/jpeg',quality=.84){
 return canvas.toDataURL(type,quality);
}
async function normalizeImageForIOS(file){
 // iPhone Photos commonly returns HEIC/HEIF or very large camera images.
 // Decode locally and re-encode to a modest JPEG before upload. This also
 // avoids sending multi-megabyte base64 payloads through the Live data channel.
 const objectUrl=URL.createObjectURL(file);
 try{
   const img=new Image();
   img.decoding='async';
   await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=()=>reject(new Error('This image could not be decoded on this device'));img.src=objectUrl});
   const sourceW=img.naturalWidth||img.width,sourceH=img.naturalHeight||img.height;
   if(!sourceW||!sourceH)throw new Error('The selected image has no readable dimensions');
   const maxSide=1600;
   const scale=Math.min(1,maxSide/Math.max(sourceW,sourceH));
   const w=Math.max(1,Math.round(sourceW*scale)),h=Math.max(1,Math.round(sourceH*scale));
   const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
   const ctx=canvas.getContext('2d',{alpha:false});
   if(!ctx)throw new Error('Image conversion is unavailable');
   ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);
   return {dataUrl:canvasToDataURL(canvas,'image/jpeg',.84),width:w,height:h};
 }finally{URL.revokeObjectURL(objectUrl)}
}
function speakVerifiedObservation(observation){
 if(!observation||!dc||dc.readyState!=='open')throw new Error('AKI voice session is not ready for the image result');
 const id='show_me_verified_'+Date.now();
 dc.send(JSON.stringify({
   type:'response.item.create',event_id:id,
   item:{type:'message',role:'user',content:[{type:'input_text',text:`SHOW ME VERIFIED IMAGE RESULT. A separate vision step successfully inspected the exact image I deliberately selected. Its grounded observation is:\n${observation}\n\nRespond naturally as AKI. Acknowledge only details contained in that verified observation. Do not claim continuous sight or access to anything beyond this one selected image. Ask what I want to figure out only if that is the natural next step.`}]}
 }));
 dc.send(JSON.stringify({type:'response.create',event_id:id+'_respond'}));
}
async function shareImage(file){
 if(!file||imageBusy)return;
 // iOS may report HEIC/HEIF inconsistently, so accept image MIME types and
 // common photo extensions, then prove decodability during normalization.
 const looksImage=file.type?.startsWith('image/')||/\.(heic|heif|jpe?g|png|webp|gif)$/i.test(file.name||'');
 if(!looksImage){console.warn('[AKI 7.1.5] rejected non-image');return}
 imageBusy=true;
 try{
   if(!powered||!dc||dc.readyState!=='open')await startAki();
   const deadline=Date.now()+12000;
   while((!dc||dc.readyState!=='open')&&Date.now()<deadline)await new Promise(r=>setTimeout(r,80));
   if(!dc||dc.readyState!=='open')throw new Error('AKI voice session is not ready');

   latency('show-me-selected',{name:file.name||'image',type:file.type||'unknown',size:file.size});
   const normalized=await normalizeImageForIOS(file);
   latency('show-me-normalized',{width:normalized.width,height:normalized.height,encoded_chars:normalized.dataUrl.length});

   const r=await fetch('/api/show-me',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:normalized.dataUrl})});
   const payload=await r.json().catch(()=>({}));
   if(!r.ok||!payload?.ok||!payload?.observation)throw new Error(payload?.error||`Image analysis failed (${r.status})`);

   latency('show-me-verified',{observation_chars:payload.observation.length});
   speakVerifiedObservation(payload.observation);
 }catch(err){
   console.error('[AKI 7.1.5 Show Me error]',err);
   if(dc?.readyState==='open'){
     try{
       const id='show_me_failed_'+Date.now();
       dc.send(JSON.stringify({type:'response.item.create',event_id:id,item:{type:'message',role:'user',content:[{type:'input_text',text:'SHOW ME FAILED: The image I selected was not successfully received or analyzed. Tell me briefly that the image did not come through and ask me to try another image. Do not claim you saw it.'}]}}));
       dc.send(JSON.stringify({type:'response.create',event_id:id+'_respond'}));
     }catch{}
   }
 }finally{imageBusy=false;[selfiePicker,worldPicker].forEach(resetPicker)}
}
function resetPicker(input){ try{input.value=''}catch{} }
function openDoor(input){
 if(imageBusy||shareBusy)return;
 resetPicker(input);
 // iOS owns the native picker/camera UI. Separate inputs let each invisible
 // quadrant request a distinct source instead of AKI presenting its own menu.
 if(typeof input.showPicker==='function'){ try{input.showPicker();return}catch{} }
 input.click();
}

function fileToBase64(file){
 return new Promise((resolve,reject)=>{
  const reader=new FileReader();
  reader.onerror=()=>reject(reader.error||new Error('Could not read file'));
  reader.onload=()=>{const result=String(reader.result||'');const comma=result.indexOf(',');resolve(comma>=0?result.slice(comma+1):result)};
  reader.readAsDataURL(file);
 });
}
async function shareFile(file){
 if(!file||shareBusy||imageBusy)return;
 // Vercel Functions accept at most 4.5 MB request bodies. Base64 expands data,
 // so keep this experimental direct handoff below 3 MB.
 if(file.size>3_000_000){
  console.warn('[AKI 7.1.6.1 file] too large',file.size);
  await injectFileFailure('That file is too large for this AKI web handoff right now.');
  return;
 }
 shareBusy=true;
 try{
  latency('file-selected',{name:file.name||'document',type:file.type||'unknown',size:file.size});
  const data=await fileToBase64(file);
  const r=await fetch('/api/show-file',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({filename:file.name||'document',mime:file.type||'application/octet-stream',data})});
  const payload=await r.json().catch(()=>({}));
  if(!r.ok||!payload.ok||!payload.observation)throw new Error(payload.error||'File analysis failed');
  if(!powered||!dc||dc.readyState!=='open')await startAki();
  const deadline=Date.now()+12000;while((!dc||dc.readyState!=='open')&&Date.now()<deadline)await new Promise(r=>setTimeout(r,80));
  if(!dc||dc.readyState!=='open')throw new Error('AKI voice session is not ready');
  const id='verified_file_'+Date.now();
  dc.send(JSON.stringify({type:'response.item.create',event_id:id,item:{type:'message',role:'user',content:[{type:'input_text',text:`FILE VERIFIED. I deliberately selected the file "${file.name||'document'}". A separate file-analysis step successfully read it and returned this grounded observation:\n${payload.observation}\n\nRespond naturally as AKI. Acknowledge only what this verified file result supports. Do not claim access to any other files. Ask what I want to do with it only if that is the natural next step.`}]}}));
  dc.send(JSON.stringify({type:'response.create',event_id:id+'_respond'}));
  latency('file-verified',{name:file.name||'document',observation_chars:payload.observation.length});
 }catch(err){console.error('[AKI 7.1.6.1 file error]',err);await injectFileFailure('The file did not come through clearly.');}
 finally{shareBusy=false;resetPicker(filePicker)}
}
async function injectFileFailure(message){
 try{
  if(!powered||!dc||dc.readyState!=='open')await startAki();
  const deadline=Date.now()+10000;while((!dc||dc.readyState!=='open')&&Date.now()<deadline)await new Promise(r=>setTimeout(r,80));
  if(!dc||dc.readyState!=='open')return;
  const id='file_failed_'+Date.now();
  dc.send(JSON.stringify({type:'response.item.create',event_id:id,item:{type:'message',role:'user',content:[{type:'input_text',text:`FILE HANDOFF FAILED. ${message} Tell me that briefly and do not pretend you read the file.`}]}}));
  dc.send(JSON.stringify({type:'response.create',event_id:id+'_respond'}));
 }catch{}
}

function openWrite(){
 if(imageBusy||shareBusy)return;
 writeLayer.classList.add('open');
 writeBox.value='';
 requestAnimationFrame(()=>{try{writeBox.focus({preventScroll:true})}catch{writeBox.focus()}});
}
function closeWrite(){
 writeBox.blur();writeBox.value='';writeLayer.classList.remove('open');
}
async function sendWrittenText(text){
 const clean=String(text||'').trim();if(!clean)return;
 if(!powered||!dc||dc.readyState!=='open')await startAki();
 const deadline=Date.now()+12000;
 while((!dc||dc.readyState!=='open')&&Date.now()<deadline)await new Promise(r=>setTimeout(r,80));
 if(!dc||dc.readyState!=='open')throw new Error('AKI voice session is not ready');
 const id='written_input_'+Date.now();
 dc.send(JSON.stringify({type:'response.item.create',event_id:id,item:{type:'message',role:'user',content:[{type:'input_text',text:clean}]}}));
 dc.send(JSON.stringify({type:'response.create',event_id:id+'_respond'}));
 latency('written-input-sent',{chars:clean.length});
}
writeLayer.addEventListener('submit',async e=>{
 e.preventDefault();const text=writeBox.value;if(!text.trim())return;
 closeWrite();
 try{await sendWrittenText(text)}catch(err){console.error('[AKI 7.1.5 write error]',err);powerLook('error')}
});
writeBox.addEventListener('keydown',e=>{
 if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();writeLayer.requestSubmit()}
 if(e.key==='Escape'){e.preventDefault();closeWrite()}
});
selfiePicker.addEventListener('change',()=>{const f=selfiePicker.files?.[0];if(f)shareImage(f)});
worldPicker.addEventListener('change',()=>{const f=worldPicker.files?.[0];if(f)shareImage(f)});
filePicker.addEventListener('change',()=>{const f=filePicker.files?.[0];if(!f)return;const isImage=f.type?.startsWith('image/')||/\.(heic|heif|jpe?g|png|webp|gif)$/i.test(f.name||'');if(isImage)shareImage(f).finally(()=>resetPicker(filePicker));else shareFile(f)});
app.addEventListener('click',e=>{
 if(e.target===akiButton||akiButton.contains(e.target)||e.target===writeBox||writeLayer.contains(e.target)||[selfiePicker,worldPicker,filePicker].includes(e.target))return;
 const r=app.getBoundingClientRect();
 const x=e.clientX-r.left,y=e.clientY-r.top;
 // AKI 7.1.6.1 FULL DOOR invisible map: upper-left = write, upper-right = full handoff door;
 // lower-left = front camera, lower-right = rear camera. The sphere stays sacred.
 const orbRect=document.querySelector('.orb').getBoundingClientRect();
 if(y < orbRect.top-r.top){
   if(x<r.width/2)openWrite();else openDoor(filePicker);
   return;
 }
 if(y > orbRect.bottom-r.top){
   if(x<r.width/2)openDoor(selfiePicker);else openDoor(worldPicker);
 }
});

async function toggle(){if(starting||stopping)return;if(powered||pc||micStream)await stopAki();else await startAki()}
akiButton.addEventListener('click',e=>{e.stopPropagation();toggle()});
akiButton.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle()}});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&pc&&['failed','closed'].includes(pc.connectionState))stopAki()});
window.addEventListener('pagehide',()=>stopAki());
powerLook('off');
</script>
</body>

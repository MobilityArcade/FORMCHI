/* SHIFTVIX IONIC THRUSTER — permanent living center reactor */
#center{
    --reactor-color:210,245,255;
    --reactor-hot:255,255,255;
    --reactor-plume:105,225,255;
    --reactor-plume-edge:70,150,255;
    --reactor-scale:1;
    --thrust-angle:90deg;
    --thrust-power:0;
    --thrust-length:26px;
    --thrust-width:9px;
    position:absolute;
    left:50%;
    top:50%;
    width:22px;
    height:22px;
    border-radius:50%;
    transform:translate(-50%,-50%) scale(var(--reactor-scale));
    background:
        radial-gradient(circle at 50% 50%,
            rgba(var(--reactor-hot),.98) 0 12%,
            rgba(var(--reactor-plume),.78) 20%,
            rgba(7,18,28,.88) 46%,
            rgba(0,0,0,.92) 70%);
    border:2px solid rgba(255,255,255,.98);
    box-shadow:
        0 0 8px rgba(255,255,255,.78),
        0 0 16px rgba(var(--reactor-color),.28),
        inset 0 0 8px rgba(var(--reactor-plume),.42);
    z-index:13;
    pointer-events:auto;
    cursor:pointer;
    transition:
        transform .28s ease,
        border-color .24s ease,
        box-shadow .24s ease,
        background .24s ease;
    isolation:isolate;
}

#center .reactorCore,
#center .reactorMiddle,
#center .reactorOuter,
#center .reactorPlume{
    position:absolute;
    left:50%;
    top:50%;
    pointer-events:none;
    box-sizing:border-box;
}

#center .reactorCore{
    width:11px;
    height:11px;
    border-radius:50%;
    transform:translate(-50%,-50%);
    background:
        radial-gradient(circle,
            rgba(255,255,255,1) 0 20%,
            rgba(var(--reactor-hot),.98) 32%,
            rgba(var(--reactor-plume),.56) 58%,
            transparent 76%);
    box-shadow:
        0 0 7px rgba(255,255,255,.96),
        0 0 14px rgba(var(--reactor-plume),.72);
    animation:ionicCoreIdle 1.25s ease-in-out infinite;
    z-index:4;
}

#center .reactorMiddle,
#center .reactorOuter{
    border-radius:50%;
    transform:translate(-50%,-50%);
    transition:
        width .3s ease,
        height .3s ease,
        border-color .24s ease,
        box-shadow .24s ease,
        opacity .24s ease;
}

#center .reactorMiddle{
    width:43px;
    height:43px;
    border:1px solid rgba(255,255,255,.50);
    box-shadow:
        0 0 7px rgba(255,255,255,.13),
        inset 0 0 6px rgba(var(--reactor-plume),.08);
    z-index:2;
}

#center .reactorOuter{
    width:64px;
    height:64px;
    border:2px solid rgba(var(--reactor-color),.88);
    box-shadow:
        0 0 10px rgba(var(--reactor-color),.48),
        inset 0 0 8px rgba(var(--reactor-color),.12);
    animation:reactorBreathe 1.8s ease-in-out infinite;
    z-index:1;
}

/* Short ion cone. It appears only while the player is changing lanes. */
#center .reactorPlume{
    left:50%;
    top:50%;
    width:calc(var(--thrust-length) * (.42 + var(--thrust-power) * .58));
    height:calc(var(--thrust-width) * (.72 + var(--thrust-power) * .28));
    border-radius:999px 72% 72% 999px;
    transform-origin:0 50%;
    transform:
        translate(7px,-50%)
        rotate(var(--thrust-angle))
        scaleX(calc(.74 + var(--thrust-power) * .26));
    opacity:calc(var(--thrust-power) * .88);
    background:linear-gradient(
        90deg,
        rgba(255,255,255,.98) 0%,
        rgba(var(--reactor-hot),.92) 18%,
        rgba(var(--reactor-plume),.72) 54%,
        rgba(var(--reactor-plume-edge),.12) 100%
    );
    box-shadow:
        0 0 6px rgba(255,255,255,.86),
        0 0 13px rgba(var(--reactor-plume),.64);
    filter:blur(.25px);
    transition:
        opacity .08s linear,
        width .12s ease,
        height .12s ease,
        background .22s ease,
        box-shadow .22s ease;
    z-index:-1;
}

@keyframes ionicCoreIdle{
    0%,100%{
        transform:translate(-50%,-50%) scale(.92);
        opacity:.78;
        filter:brightness(.92);
    }
    52%{
        transform:translate(-50%,-50%) scale(1.12);
        opacity:1;
        filter:brightness(1.18);
    }
}

@keyframes ionicCoreFlux{
    0%,100%{transform:translate(-50%,-50%) scale(1.02);filter:brightness(1.06)}
    24%{transform:translate(-50%,-50%) scale(1.24);filter:brightness(1.35)}
    61%{transform:translate(-50%,-50%) scale(1.11);filter:brightness(1.18)}
}

@keyframes reactorBreathe{
    0%,100%{transform:translate(-50%,-50%) scale(.97);opacity:.72}
    50%{transform:translate(-50%,-50%) scale(1.04);opacity:1}
}

/* SHIFTVIX POWER ANNOUNCEMENT 2.0 */
#powerAnnouncement{
  position:fixed;
  left:50%;
  top:29.5%;
  transform:translate(-50%,-50%) scale(.90);
  z-index:68;
  pointer-events:none;
  opacity:0;
  white-space:nowrap;
  text-align:center;
  font-size:clamp(32px,9vw,58px);
  font-weight:1000;
  letter-spacing:3px;
  color:#fff;
  text-shadow:
    0 0 8px rgba(255,255,255,.98),
    0 0 24px rgba(100,220,255,.72),
    0 0 46px rgba(160,90,255,.44);
  transition:opacity .14s ease,transform .18s ease,filter .18s ease;
}
#powerAnnouncement.show{
  opacity:1;
  transform:translate(-50%,-50%) scale(1);
}
#powerAnnouncement.powerTier1{filter:brightness(1)}
#powerAnnouncement.powerTier2{filter:brightness(1.12) saturate(1.12)}
#powerAnnouncement.powerTier3{
  filter:brightness(1.28) saturate(1.24);
  text-shadow:
    0 0 9px rgba(255,255,255,1),
    0 0 28px rgba(95,225,255,.95),
    0 0 58px rgba(175,90,255,.72);
}
@keyframes powerAnnouncementTier3{
  0%{transform:translate(-50%,-50%) scale(.78)}
  48%{transform:translate(-50%,-50%) scale(1.12)}
  100%{transform:translate(-50%,-50%) scale(1)}
}
#powerAnnouncement.show.powerTier3{
  animation:powerAnnouncementTier3 .30s ease-out;
}

<script type="module">
import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";
const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x000000,0.0011);
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.1,5000);camera.position.set(0,0,48);camera.lookAt(0,0,-500);
let playerX=0,playerY=0;
const PLAYER_Z=72;
const renderer=new THREE.WebGLRenderer({
  antialias:true,
  powerPreference:"high-performance"
});

const SHIFTVIX_MOBILE_DEVICE =
  /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) ||
  (
    navigator.maxTouchPoints>1 &&
    Math.min(innerWidth,innerHeight)<1400
  );

const SHIFTVIX_DESKTOP_DPR_CAP=2;
const SHIFTVIX_MOBILE_DPR_CAP=1.4;

function applyRendererResolution(width=window.innerWidth,height=window.innerHeight){
  const cap=
    SHIFTVIX_MOBILE_DEVICE
      ? SHIFTVIX_MOBILE_DPR_CAP
      : SHIFTVIX_DESKTOP_DPR_CAP;

  renderer.setPixelRatio(
    Math.min(window.devicePixelRatio||1,cap)
  );

  /*
    Keep the drawing buffer and CSS canvas synchronized to one stable viewport.
    The width/height are supplied by the viewport-stability controller below.
  */
  renderer.setSize(width,height,true);
}

/*
  SHIFTVIX FROZEN MOBILE VIEWPORT

  Mobile browsers can change innerHeight/clientHeight while their address bars,
  bottom bars, power-up compositing layers, or page chrome animate. Rebuilding
  WebGL from those transient dimensions is what lets the game jump, crop, or
  remain slightly up/left.

  Rule for mobile:
  - capture one viewport rectangle for the current orientation;
  - freeze it for the entire orientation;
  - NEVER resize because of toolbar / visualViewport / power-up events;
  - only recalculate after a genuine portrait <-> landscape orientation change.

  The HTML body, WebGL renderer, camera and center reactor all use this exact
  same frozen rectangle.
*/
function measureOrientationViewport(){
  return {
    width:Math.max(
      1,
      Math.round(window.innerWidth || document.documentElement.clientWidth)
    ),
    height:Math.max(
      1,
      Math.round(window.innerHeight || document.documentElement.clientHeight)
    )
  };
}

let initialStableViewport=measureOrientationViewport();
let stableViewportWidth=initialStableViewport.width;
let stableViewportHeight=initialStableViewport.height;
let viewportOrientation=
  stableViewportWidth>=stableViewportHeight ? "landscape" : "portrait";
let viewportResizeTimer=null;

function applyFrozenGameViewport(width,height){
  document.documentElement.style.setProperty(
    "--shiftvix-app-width",
    `${width}px`
  );
  document.documentElement.style.setProperty(
    "--shiftvix-app-height",
    `${height}px`
  );

  const canvas=renderer.domElement;

  canvas.style.position="fixed";
  canvas.style.left="0px";
  canvas.style.top="0px";
  canvas.style.right="auto";
  canvas.style.bottom="auto";
  canvas.style.width=`${width}px`;
  canvas.style.height=`${height}px`;

  camera.aspect=width/height;
  camera.updateProjectionMatrix();

  applyRendererResolution(width,height);

  const center=document.getElementById("center");
  if(center){
    center.style.left=`${width/2}px`;
    center.style.top=`${height/2}px`;
  }
}

function recaptureViewportForOrientation(){
  const next=measureOrientationViewport();

  stableViewportWidth=next.width;
  stableViewportHeight=next.height;
  viewportOrientation=
    stableViewportWidth>=stableViewportHeight ? "landscape" : "portrait";

  applyFrozenGameViewport(
    stableViewportWidth,
    stableViewportHeight
  );
}

function currentPhysicalOrientation(){
  const w=window.innerWidth || document.documentElement.clientWidth;
  const h=window.innerHeight || document.documentElement.clientHeight;
  return w>=h ? "landscape" : "portrait";
}

function commitStableViewport(force=false){
  /*
    Compatibility function retained because other SHIFTVIX systems call it.
    It deliberately does NOT re-measure on mobile unless orientation changed.
  */
  const orientation=currentPhysicalOrientation();

  if(
    SHIFTVIX_MOBILE_DEVICE &&
    !force &&
    orientation===viewportOrientation
  ){
    return;
  }

  if(
    SHIFTVIX_MOBILE_DEVICE &&
    force &&
    orientation===viewportOrientation
  ){
    // Re-apply the already-frozen rectangle; do not ingest transient sizes.
    applyFrozenGameViewport(
      stableViewportWidth,
      stableViewportHeight
    );
    return;
  }

  recaptureViewportForOrientation();
}

applyRendererResolution(
  stableViewportWidth,
  stableViewportHeight
);

document.body.appendChild(renderer.domElement);

applyFrozenGameViewport(
  stableViewportWidth,
  stableViewportHeight
);

const SHIFTVIX_CHRONO_WORLD_FILTER =

renderer.domElement.addEventListener("webglcontextlost",(event)=>{
  event.preventDefault();
});

renderer.domElement.addEventListener("webglcontextrestored",()=>{
  applyRendererResolution(stableViewportWidth,stableViewportHeight);
  applyFrozenGameViewport(stableViewportWidth,stableViewportHeight);
  applyPermanentChronoWorldGrade();
});

let reactorDamageUntil=0;

function updateCenterReactor(){
  const center=document.getElementById("center");
  if(!center)return;

  const damageActive=performance.now()<reactorDamageUntil;
  const fluxActive=!damageActive&&fluxBoostTime>0;
  const chronoActive=!damageActive&&chronoTime>0;
  const midasActive=!damageActive&&midasTime>0;
  const normalActive=!damageActive&&!fluxActive&&!chronoActive&&!midasActive;

  center.classList.toggle("reactorDamage",damageActive);
  center.classList.toggle("reactorFlux",fluxActive);
  center.classList.toggle("reactorChrono",chronoActive);
  center.classList.toggle("reactorMidas",midasActive);
  center.classList.toggle("reactorNormal",normalActive);
}

function updateIonicThruster(dt){
  const center=document.getElementById("center");
  if(!center)return;

  /*
  The plume points opposite the player's actual on-screen motion.
  It is intentionally short and appears only during lane transitions.
  */
  const velocityX=targetX-playerX;
  const velocityY=targetY-playerY;
  const magnitude=Math.hypot(velocityX,velocityY);
  const movementPower=THREE.MathUtils.clamp(magnitude/22,0,1);

  if(magnitude>.08){
    const targetAngle=Math.atan2(-velocityY,-velocityX)*180/Math.PI;
    let angleDelta=((targetAngle-ionicThrustAngle+540)%360)-180;
    ionicThrustAngle+=angleDelta*(1-Math.exp(-dt*14));
  }

  const statePower=
    fluxBoostTime>0 ? 1 :
    midasTime>0 ? .82 :
    chronoTime>0 ? .60 :
    .48;

  const targetPower=movementPower*statePower;
  ionicThrustPower+=(targetPower-ionicThrustPower)*(1-Math.exp(-dt*(targetPower>ionicThrustPower?18:8)));

  center.style.setProperty("--thrust-angle",`${ionicThrustAngle.toFixed(2)}deg`);
  center.style.setProperty("--thrust-power",ionicThrustPower.toFixed(3));

  /*
  Legendary states also alter the universe's energy spectrum.
  This replaces full-screen particle density with restrained color response.
  */
  // Permanent Chrono grade was applied once at renderer initialization.
  // Do not rewrite the canvas CSS filter every frame; keeping the compositor
  // layer stable reduces Safari/Firefox power-up rendering glitches.

  updateCenterReactor();
}

function pulseCenterReactorDamage(){

  center.classList.remove("reactorDamage");

}

function choosePowerTier(){
  const r=Math.random();
  if(r<POWER_TIER_WEIGHTS[0])return 1;
  if(r<POWER_TIER_WEIGHTS[0]+POWER_TIER_WEIGHTS[1])return 2;
  return 3;
}

function powerTierDuration(tier){
  return POWER_DURATIONS[Math.max(0,Math.min(2,(tier||1)-1))];
}

function warpTierDistance(tier){

function addPowerTierRings(group,tier,color){
  const rings=[];
  for(let i=0;i<tier;i++){
    const ring=new THREE.Mesh(
      new THREE.TorusGeometry(10.2+i*2.15,.34,8,36),
      new THREE.MeshBasicMaterial({
        color,
        transparent:true,
        opacity:.88-i*.12,
        blending:THREE.AdditiveBlending,
        depthWrite:false

    );
    ring.userData.powerTierRing=true;
    group.add(ring);
    rings.push(ring);
  }
  group.userData.powerTierRings=rings;
  return rings;
}

function updateFluxBoost(dt){
  if(fluxBoostTime > 0)fluxBoostTime=Math.max(0,fluxBoostTime-dt);
  const target=fluxBoostTime>0?1:0;
  const response=1-Math.exp(-dt*(target?8.5:2.7));
  fluxBoostAmount+=(target-fluxBoostAmount)*response;
  // Flux pacing remains primary; the dedicated dust layer uses fluxBoostAmount with hard visual caps.
  const fx=document.getElementById("fluxFx");
  if(fx)fx.classList.remove("active");

function fireWarpBurst(kind="warp"){

  fx.classList.add("fire");

function playWarpBoom(strength=1){
  initAudio();
  if(!audioCtx)return;
  const now=audioCtx.currentTime;
  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();
  const filter=audioCtx.createBiquadFilter();
  osc.type="sine";
  osc.frequency.setValueAtTime(105*strength,now);
  osc.frequency.exponentialRampToValueAtTime(38,now+.42);
  filter.type="lowpass";
  filter.frequency.setValueAtTime(520,now);
  gain.gain.setValueAtTime(.0001,now);
  gain.gain.linearRampToValueAtTime(.075*strength,now+.018);
  gain.gain.exponentialRampToValueAtTime(.0001,now+.58);
  osc.connect(filter).connect(gain).connect(audioCtx.destination);
  osc.start(now);
  osc.stop(now+.62);
}

function triggerWarpBreakthrough(kind="warp"){
  fireWarpBurst(kind);
  playWarpBoom(kind==="flux"?.82:1);
  launchSurge=Math.max(launchSurge,kind==="flux"?13:10);
  warpCurveVelocityX+=(Math.random()-.5)*5;
  warpCurveVelocityY+=(Math.random()-.5)*3;

}

  gain.gain.exponentialRampToValueAtTime(.0001,now+.48);

  shimmer.connect(shimmerGain).connect(audioCtx.destination);
  shimmer.start(now+.08);shimmer.stop(now+.45);
}

  },hold);
}

  if(silentTutorialComplete)return;

  silentTutorialComplete=true;
  tutorialStage=99;

  if(el)el.classList.remove("show");

    distance:Math.floor(distance),

  if(
    silentTutorialComplete ||
    !gameStarted ||
    gameOver ||
    paused
  )return;

  if(tutorialStage===0){
    tutorialStage=1;
    tutorialStageStartedAt=performance.now();

    tutorialStage=3;
    tutorialStageStartedAt=performance.now();

    setTimeout(()=>{
      if(
        !silentTutorialComplete &&
        tutorialStage===3 &&
        !tutorialRingIntroduced
      ){
        tutorialRingIntroduced=makeGoldRing("tutorial");
      }
    },350);

    return;
  }

// Slows world simulation, refracts the universe, and doubles score earned from
// normal orb collections while keeping steering fully responsive.
// =========================
const CHRONO_DURATION_SECONDS=8; // fallback; tier activation uses 4/8/12
const CHRONO_MIN_DISTANCE=1800;
const CHRONO_WORLD_SCALE=.40;
const CHRONO_COLOR=0xbff6ff;
const CHRONO_GLOW_COLOR=0x45cfff;

let chronoPendingReasons=[];
let chronoOrbActive=false;
let chronoTime=0;
let chronoAmount=0;
let chronoNextDistanceTrigger=2000+Math.random()*650;
let chronoCooldownUntilDistance=0;
let chronoCollectedThisRun=0;
let chronoMultiplierRevealAt=0;

function queueChronoOrb(reason){
  if(
    gameOver||
    chronoOrbActive||
    fluxOrbActive||
    midasOrbActive||
    warpOrbActive||
    fluxBoostTime>0||
    midasTime>0||
    distance<CHRONO_MIN_DISTANCE||
    distance<chronoCooldownUntilDistance
  )return false;

  if(!chronoPendingReasons.includes(reason)){
    chronoPendingReasons.push(reason);
  }
  return true;
}

function updateChronoEligibility(){
  if(distance>=chronoNextDistanceTrigger){
    if(Math.random()<.56)queueChronoOrb("high_speed_distance");
    chronoNextDistanceTrigger=distance+1400+Math.random()*500;
  }
}

function updateChronoState(dt){
  if(chronoTime>0)chronoTime=Math.max(0,chronoTime-dt);

  const target=chronoTime>0?1:0;
  const response=1-Math.exp(-dt*(target?7.5:2.35));
  chronoAmount+=(target-chronoAmount)*response;

  const fx=document.getElementById("chronoFx");
  if(fx){
    fx.classList.toggle("active",chronoAmount>.012);
    fx.style.setProperty(
      "--chrono-power",
      String(Math.min(.78,chronoAmount*.78))
    );
  }

  // Prism is no longer a separate orb. It is Chrono's visual identity.
  const prismFx=document.getElementById("prismFx");
  if(prismFx){
    prismFx.classList.toggle("active",chronoAmount>.012);
    prismFx.style.setProperty(
      "--chrono-prism-power",
      String(Math.min(.38,chronoAmount*.38))
    );
  }

  const multiplier=document.getElementById("chronoMultiplier");
  if(multiplier){
    const chronoMultiplierReady=
      chronoTime>0 &&
      performance.now()>=chronoMultiplierRevealAt;

    multiplier.classList.toggle("show",chronoMultiplierReady);
  }

  updateCenterReactor();
}

function playChronoSound(){
  initAudio();
  if(!audioCtx)return;

  const now=audioCtx.currentTime;
  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();

  osc.type="sine";
  osc.frequency.setValueAtTime(820,now);
  osc.frequency.exponentialRampToValueAtTime(115,now+.48);

  gain.gain.setValueAtTime(.0001,now);
  gain.gain.linearRampToValueAtTime(.05,now+.04);
  gain.gain.exponentialRampToValueAtTime(.0001,now+.62);

  osc.connect(gain).connect(audioCtx.destination);
  osc.start(now);
  osc.stop(now+.65);

  const bell=audioCtx.createOscillator();
  const bellGain=audioCtx.createGain();
  bell.type="triangle";
  bell.frequency.setValueAtTime(1320,now+.03);
  bell.frequency.exponentialRampToValueAtTime(330,now+.52);
  bellGain.gain.setValueAtTime(.0001,now+.03);
  bellGain.gain.linearRampToValueAtTime(.018,now+.08);
  bellGain.gain.exponentialRampToValueAtTime(.0001,now+.58);
  bell.connect(bellGain).connect(audioCtx.destination);
  bell.start(now+.03);
  bell.stop(now+.60);
}

function activateChrono(reason,tier=1){
  const duration=powerTierDuration(tier);
  // Legendary states never overlap.
  fluxBoostTime=0;
  midasTime=0;
  chronoTime=duration;
  chronoCollectedThisRun++;
  chronoCooldownUntilDistance=distance+1100+Math.random()*300;
  fluxCooldownUntilDistance=Math.max(
    fluxCooldownUntilDistance,
    distance+850
  );
  chronoPendingReasons.length=0;

  playChronoSound();
  showPowerAnnouncement("CHRONO",tier);

  /*
    CHRONO UI SEQUENCE:
    1) Player first reads CHRONO 1 / CHRONO 2 / CHRONO 3.
    2) After that announcement clears, ×2 SCORE appears.
    This prevents both messages from competing for the same screen space.
  */
  const chronoAnnouncementHold=
    tier===3 ? 1550 :
    tier===2 ? 1400 :
    1250;

  chronoMultiplierRevealAt=
    performance.now()+
    chronoAnnouncementHold+
    140;

  const multiplier=document.getElementById("chronoMultiplier");
  if(multiplier)multiplier.classList.remove("show");

  if(navigator.vibrate)navigator.vibrate([22,45,22]);

  trackGame("chrono_orb_collected",{
    trigger_reason:reason||"unknown",
    distance:Math.floor(distance),
    flow_number:currentFlowIndex+1,
    chrono_count_run:chronoCollectedThisRun,
    duration_seconds:duration,
    power_tier:tier,
    world_scale:CHRONO_WORLD_SCALE,
    score_multiplier:CHRONO_SCORE_MULTIPLIER,
    prism_visual:true
  });
}

const ENVIRONMENT_TYPES = Object.freeze({
  NORMAL:"normal",
  CURVED:"curved",
  MIRROR:"mirror",
  GRAVITY:"gravity",
  REVERSE:"reverse",
  PULSE:"pulse"
});

const environmentQuery = new URLSearchParams(window.location.search)
  .get("environment")?.toLowerCase();
    

function environmentTypeForFlow(index){

    const flowNumber = (index % 30) + 1;

    const specialSlots = [
        3, 5, 7, 10,
        13, 15, 17, 20,
        23, 25, 27, 30
    ];

    const rotation = [ENVIRONMENT_TYPES.NORMAL];

    const slotIndex = specialSlots.indexOf(flowNumber);

    if(slotIndex === -1){
        return ENVIRONMENT_TYPES.NORMAL;
    }

    const blockIndex = Math.floor(index / 30);
    const globalSpecialIndex =
        (blockIndex * specialSlots.length) + slotIndex;

    return ENVIRONMENT_TYPES.NORMAL;
}
    
function flowNameForType(type){
  return `${String(type||ENVIRONMENT_TYPES.NORMAL).toUpperCase()} FLOW`;
}

function flowNameForIndex(index){
  const forced=(environmentQuery&&ENVIRONMENTS?.[environmentQuery])?environmentQuery:null;
  return flowNameForType(forced||environmentTypeForFlow(index));
}

function easeInOutCubic(t){
  return t < 0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
}
function rotatePoint(x,y,angle){
  const c=Math.cos(angle),s=Math.sin(angle);
  return {x:x*c-y*s,y:x*s+y*c};
}
function setFlowFx(mode,intensity=0){
  const fx=document.getElementById("flowFx");
  if(!fx)return;
  fx.className=mode||"";
  fx.style.setProperty("--gravity-fx",String(THREE.MathUtils.clamp(intensity,0,1)));
  fx.style.setProperty("--pulse-fx",String(THREE.MathUtils.clamp(intensity,0,1)));
}

// =========================
// SHIFTVIX WARP BANKING 3.0 + WARP CURVATURE 4.0
// Space momentum, dynamic vanishing point, layered depth, ambient route drift,
// and restrained gravitational-style curvature. Gameplay coordinates stay unchanged.
// =========================
const MAX_BANK_ROLL = THREE.MathUtils.degToRad(5.6);
const MAX_BANK_PITCH = THREE.MathUtils.degToRad(2.0);
const MAX_BANK_YAW = THREE.MathUtils.degToRad(1.25);

let bankRoll = 0;
let bankPitch = 0;
let bankYaw = 0;
let bankRollVelocity = 0;
let bankPitchVelocity = 0;
let bankYawVelocity = 0;

let warpCurveX = 0;
let warpCurveY = 0;
let warpCurveVelocityX = 0;
let warpCurveVelocityY = 0;

let routePhase = Math.random() * Math.PI * 2;
let routePhaseSpeed = 0.075 + Math.random() * 0.025;
let vanishingX = 0;
let vanishingY = 0;
let lensPulse = 0;

function addWarpBank(dx,dy){
  const speedFeel = 0.84 + Math.min(0.24, distance / 19000);

  // Steering impulses carry momentum instead of snapping to a fixed angle.
  bankRollVelocity += -dx * THREE.MathUtils.degToRad(13.5) * speedFeel;
  bankPitchVelocity +=  dy * THREE.MathUtils.degToRad(5.0) * speedFeel;
  bankYawVelocity +=   -dx * THREE.MathUtils.degToRad(3.7) * speedFeel;

  // The deep field receives a longer, softer directional impulse.
  warpCurveVelocityX += -dx * 58 * speedFeel;
  warpCurveVelocityY +=  dy * 31 * speedFeel;
}

function updateWarpBanking(dt){
  // Spring-damped aircraft-like response.
  const rollSpring = -bankRoll * 26;
  const pitchSpring = -bankPitch * 28;
  const yawSpring = -bankYaw * 24;

  bankRollVelocity += rollSpring * dt;
  bankPitchVelocity += pitchSpring * dt;
  bankYawVelocity += yawSpring * dt;

  const angularDrag = Math.exp(-dt * 5.5);
  bankRollVelocity *= angularDrag;
  bankPitchVelocity *= angularDrag;
  bankYawVelocity *= angularDrag;

  bankRoll = THREE.MathUtils.clamp(bankRoll + bankRollVelocity * dt, -MAX_BANK_ROLL, MAX_BANK_ROLL);
  bankPitch = THREE.MathUtils.clamp(bankPitch + bankPitchVelocity * dt, -MAX_BANK_PITCH, MAX_BANK_PITCH);
  bankYaw = THREE.MathUtils.clamp(bankYaw + bankYawVelocity * dt, -MAX_BANK_YAW, MAX_BANK_YAW);

  // Long route curvature has more inertia than the camera.
  warpCurveVelocityX += -warpCurveX * 2.15 * dt;
  warpCurveVelocityY += -warpCurveY * 2.35 * dt;
  const curveDrag = Math.exp(-dt * 1.85);
  warpCurveVelocityX *= curveDrag;
  warpCurveVelocityY *= curveDrag;
  warpCurveX = THREE.MathUtils.clamp(warpCurveX + warpCurveVelocityX * dt, -28, 28);
  warpCurveY = THREE.MathUtils.clamp(warpCurveY + warpCurveVelocityY * dt, -16, 16);

  // Variable route: long graceful curves separated by calmer sections.
  routePhase += dt * routePhaseSpeed * (0.65 + warpAmount * 0.35);
  const routeEnvelope = 0.36 + 0.64 * Math.pow(0.5 + 0.5 * Math.sin(routePhase * 0.53 + 0.8), 2);
  const ambientCurveX = Math.sin(routePhase) * routeEnvelope * warpAmount * 7.5;
  const ambientCurveY = Math.sin(routePhase * 0.71 + 1.45) * routeEnvelope * warpAmount * 3.6;

  // Dynamic vanishing point follows steering, but remains inside a safe 3–4% window.
  const targetVanishingX = THREE.MathUtils.clamp(
    -bankYaw * 285 + (warpCurveX + ambientCurveX) * 0.12,
    -18, 18
  );
  const targetVanishingY = THREE.MathUtils.clamp(
    bankPitch * 210 + (warpCurveY + ambientCurveY) * 0.10,
    -10, 10
  );
  const vanishEase = 1 - Math.exp(-dt * 2.7);
  vanishingX += (targetVanishingX - vanishingX) * vanishEase;
  vanishingY += (targetVanishingY - vanishingY) * vanishEase;

  // 4.0 curvature pulse is deliberately tiny and slow.
  lensPulse = (0.5 + 0.5 * Math.sin(routePhase * 0.41 + 2.2)) * warpAmount;

  const ambientRoll = Math.sin(routePhase * 0.88) * warpAmount * THREE.MathUtils.degToRad(0.38);
  const ambientYaw = Math.sin(routePhase * 0.61 + 0.4) * warpAmount * THREE.MathUtils.degToRad(0.20);
  const ambientPitch = Math.sin(routePhase * 0.47 + 1.2) * warpAmount * THREE.MathUtils.degToRad(0.09);

  /*
    CENTER LOCK:
    Preserve the arcade banking sensation as roll only.
    Pitch/yaw used to push the lane convergence point away from the fixed
    center reactor on mobile. Deep-field stars still receive curvature.
  */
  camera.rotation.z = bankRoll + ambientRoll;

  stars.forEach((s,index)=>{
    const depthWeight = 0.78 + index * 0.12;
    s.rotation.z = -(bankRoll + ambientRoll) * (0.18 + depthWeight * 0.08);
    s.position.x = -vanishingX * (0.42 + depthWeight * 0.12);
    s.position.y = -vanishingY * (0.34 + depthWeight * 0.10);
  });

  return {ambientCurveX, ambientCurveY};
}

function resetWarpBanking(){
  bankRoll = 0;
  bankPitch = 0;
  bankYaw = 0;
  bankRollVelocity = 0;
  bankPitchVelocity = 0;
  bankYawVelocity = 0;
  warpCurveX = 0;
  warpCurveY = 0;
  warpCurveVelocityX = 0;
  warpCurveVelocityY = 0;
  vanishingX = 0;
  vanishingY = 0;
  lensPulse = 0;
  camera.rotation.set(0,0,0);
  stars.forEach(s=>{
    s.rotation.z = 0;
    s.position.x = 0;
    s.position.y = 0;
  });
}

// they stay crisp and readable even when the soundtrack is filtered.
let musicInput = null;

function ensureMusicBus(){
  if(!audioCtx || musicInput) return;

  musicInput = audioCtx.createGain();
  musicFilter = audioCtx.createBiquadFilter();
  musicCompressor = audioCtx.createDynamicsCompressor();
  musicMasterGain = audioCtx.createGain();

  musicFilter.type = "lowpass";
  musicFilter.frequency.value = 1350;
  musicFilter.Q.value = 0.7;

  musicCompressor.threshold.value = -18;
  musicCompressor.knee.value = 16;
  musicCompressor.ratio.value = 3;
  musicCompressor.attack.value = 0.01;
  musicCompressor.release.value = 0.18;

  musicMasterGain.gain.value = 0.82;

  musicInput.connect(musicFilter);
  musicFilter.connect(musicCompressor);
  musicCompressor.connect(musicMasterGain);
  musicMasterGain.connect(audioCtx.destination);
}

function updateMusicEvolution(time){
  if(!audioCtx) return;
  ensureMusicBus();

  // The same song gradually opens up instead of simply getting louder.
  const progress = Math.max(0, Math.min(1, distance / 5000));
  const cutoff = 1350 + progress * 7600;
  musicFilter.frequency.setTargetAtTime(cutoff, time, 0.18);

  // A tiny master lift compensates for the extra high-frequency detail.
  const gain = 0.80 + progress * 0.08;
  musicMasterGain.gain.setTargetAtTime(gain, time, 0.25);
}

function playTone(freq,type,volume,duration){
  if(!audioCtx) return;
  playToneAt(freq,type,volume,duration,audioCtx.currentTime);
}

function playToneAt(freq,type,volume,duration,startTime,options={}){
  if(!audioCtx || !freq || freq <= 0) return;
  ensureMusicBus();

  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  const destination = options.direct ? audioCtx.destination : musicInput;

  osc.type = type;
  osc.frequency.setValueAtTime(freq, startTime);
  if(options.detune) osc.detune.setValueAtTime(options.detune, startTime);

  const attack = options.attack ?? 0.01;
  const releaseEnd = startTime + duration;
  gain.gain.setValueAtTime(0.0001, startTime);
  gain.gain.linearRampToValueAtTime(volume, startTime + attack);
  gain.gain.exponentialRampToValueAtTime(0.0001, releaseEnd);

  osc.connect(gain);
  gain.connect(destination);
  osc.start(startTime);
  osc.stop(releaseEnd + 0.03);
}

let drumStep = 0;

function getDrumBPM(){
  const bpm = 76 + Math.min(46, distance / 115);
  return Math.max(76, Math.min(122, bpm));
}

function playNoiseHit(time, volume, duration, highpass=1200){
  if(!audioCtx || !drumEnabled) return;
  ensureMusicBus();
  const length = Math.max(1, Math.floor(audioCtx.sampleRate * duration));
  const buffer = audioCtx.createBuffer(1,length,audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for(let i=0;i<length;i++) data[i]=(Math.random()*2-1)*(1-i/length);

  const source=audioCtx.createBufferSource();
  const filter=audioCtx.createBiquadFilter();
  const gain=audioCtx.createGain();
  source.buffer=buffer;
  filter.type="highpass";
  filter.frequency.value=highpass;
  gain.gain.setValueAtTime(volume,time);
  gain.gain.exponentialRampToValueAtTime(0.0001,time+duration);
  source.connect(filter).connect(gain).connect(musicInput);
  source.start(time);
}

function playDrumHit(time, accent = 1){
  if(!audioCtx || !drumEnabled) return;
  if(environmentEngine?.current?.id===ENVIRONMENT_TYPES.PULSE) pulseEnvironment.onBeat(time,accent);
  ensureMusicBus();

  const bodyOsc = audioCtx.createOscillator();
  const bodyGain = audioCtx.createGain();
  bodyOsc.type = "sine";
  bodyOsc.frequency.setValueAtTime(92, time);
  bodyOsc.frequency.exponentialRampToValueAtTime(48, time + 0.18);
  bodyGain.gain.setValueAtTime(0.0001, time);
  bodyGain.gain.linearRampToValueAtTime(0.112 * accent, time + 0.008);
  bodyGain.gain.exponentialRampToValueAtTime(0.0001, time + 0.34);
  bodyOsc.connect(bodyGain).connect(musicInput);
  bodyOsc.start(time);
  bodyOsc.stop(time + 0.38);

  const knockOsc = audioCtx.createOscillator();
  const knockGain = audioCtx.createGain();
  knockOsc.type = "triangle";
  knockOsc.frequency.setValueAtTime(165, time);
  knockOsc.frequency.exponentialRampToValueAtTime(82, time + 0.07);
  knockGain.gain.setValueAtTime(0.0001, time);
  knockGain.gain.linearRampToValueAtTime(0.040 * accent, time + 0.004);
  knockGain.gain.exponentialRampToValueAtTime(0.0001, time + 0.13);
  knockOsc.connect(knockGain).connect(musicInput);
  knockOsc.start(time);
  knockOsc.stop(time + 0.15);

  // Extra percussion arrives in stages, preserving the original heartbeat.
  if(distance > 1100 && drumStep % 2 === 1){
    playNoiseHit(time,0.010,0.045,2500); // light shaker
  }
  if(distance > 2300 && drumStep % 4 === 2){
    playToneAt(72,"triangle",0.030,0.16,time,{attack:0.004}); // low tom answer
  }
  if(distance > 3600 && drumStep % 8 === 6){
    playNoiseHit(time,0.017,0.09,900); // broader tribal texture
  }
}

function drumScheduler(){
  if(!audioCtx || !musicStarted || !drumEnabled) return;
  const scheduleAheadTime = 0.14;
  while(nextDrumTime < audioCtx.currentTime + scheduleAheadTime){
    const beatDuration = 60 / getDrumBPM();
    const accent = drumStep % 4 === 0 ? 1.18 : (drumStep % 2 === 0 ? 1.05 : 0.82);
    playDrumHit(nextDrumTime, accent);
    drumStep++;
    nextDrumTime += beatDuration;
  }
}

function resetDrumPulse(){
  drumStep = 0;
  if(audioCtx) nextDrumTime = audioCtx.currentTime + 0.08;
}

}

function getMusicSection(step){

    // Subtle instrument rotation: same notes, slightly different character.
    const instruments=["square","square","triangle","sawtooth"];
    phraseInstrument=instruments[Math.floor(Math.random()*instruments.length)];
  }
  const sectionLength=12;
  const sectionIndex=Math.floor((step%currentPhraseLength)/sectionLength)%currentArrangement.length;
  return currentArrangement[sectionIndex];
}

function getPatternsForSection(section){
  if(section==="A") return {bass:bassPatternA,lead:leadPatternA};
  if(section==="B") return {bass:bassPatternB,lead:leadPatternB};
  if(section==="C") return {bass:bassPatternC,lead:leadPatternC};
  return {bass:bassPatternD,lead:leadPatternD};
}

function getCleanFlowAmount(){
  // Harmony gradually returns after a strike. Fewer remaining lives also reduce it.
  const cleanDistance=Math.max(0,distance-lastStrikeDistance);
  const recovery=Math.max(0,Math.min(1,cleanDistance/700));
  const livesFactor=Math.max(0.22,(3-strikes)/3);
  return recovery*livesFactor;
}

function scheduleAmbientPad(section,time,stepDuration,cleanAmount){
  if(musicStep%16!==0) return;
  const roots={A:82,B:98,C:110,D:147};
  const root=roots[section]||82;
  const evolution=Math.max(0,Math.min(1,distance/4500));
  const volume=0.0045+evolution*0.004+cleanAmount*0.003;
  const duration=stepDuration*15;
  playToneAt(root,"sine",volume,duration,time,{attack:0.18,detune:-5});
  playToneAt(root*1.5,"sine",volume*0.65,duration,time,{attack:0.22,detune:5});
}

function scheduleMusicStep(step,time,stepDuration){
  updateMusicEvolution(time);
  const section=getMusicSection(step);
  const patterns=getPatternsForSection(section);
  const cleanAmount=getCleanFlowAmount();
  const leadType=phraseInstrument;

  playToneAt(patterns.bass[step%patterns.bass.length],"triangle",0.038,stepDuration*0.9,time);
  playToneAt(patterns.lead[step%patterns.lead.length],leadType,leadType==="sawtooth"?0.017:0.023,stepDuration*0.8,time);
  playToneAt(arpPattern[step%arpPattern.length],"square",0.009,stepDuration*0.5,time);

  // Adaptive harmony rewards clean play with warmth rather than extra points.
  if(cleanAmount>0.10){
    const lead=patterns.lead[step%patterns.lead.length];
    playToneAt(lead*0.75,"sine",0.003+cleanAmount*0.007,stepDuration*2.2,time,{attack:0.05});
  }

  // Counter melody begins quietly, then becomes more present in longer runs.
  if(distance>950 && step%4===2){
    const counter=counterPatterns[section][Math.floor(step/2)%counterPatterns[section].length];
    const counterGrowth=Math.min(1,(distance-950)/2600);
    playToneAt(counter,"triangle",0.004+counterGrowth*0.006,stepDuration*1.15,time,{attack:0.025});
  }

  scheduleAmbientPad(section,time,stepDuration,cleanAmount);

  if(distance>500){
    playToneAt(patterns.lead[step%patterns.lead.length]/2,"sine",0.008,stepDuration*2.5,time);
  }
  if(distance>1200){
    playToneAt(patterns.lead[step%patterns.lead.length]*2,"triangle",0.005,stepDuration,time);
  }
  if(distance>2200 && step%4===0){
    playToneAt(55,"sine",0.011,0.09,time);
  }
  if(distance>3200 && step%2===0){
    playToneAt(patterns.bass[step%patterns.bass.length]*4,"triangle",0.005,stepDuration*3,time);
  }
  if(distance>4200 && step%4===0){
    playToneAt(patterns.lead[step%patterns.lead.length]*0.5,"sine",0.004,stepDuration*6,time,{attack:0.08});
  }
}

function musicScheduler(){
  if(!audioCtx || !musicStarted) return;
  const BPM=148;
  const STEP=(60/BPM)/2;
  const scheduleAheadTime=0.12;
  while(nextNoteTime<audioCtx.currentTime+scheduleAheadTime){
    scheduleMusicStep(musicStep,nextNoteTime,STEP);
    musicStep++;
    nextNoteTime+=STEP;
  }
  drumScheduler();
}

function resetMusicEvolution(){
  musicStep=0;
  currentArrangement=null;
  nextPhraseStep=0;
  lastArrangement=-1;
  phraseInstrument="square";
  lastStrikeDistance=0;
  if(audioCtx){
    ensureMusicBus();
    musicFilter.frequency.cancelScheduledValues(audioCtx.currentTime);
    musicFilter.frequency.setValueAtTime(1350,audioCtx.currentTime);
    musicMasterGain.gain.cancelScheduledValues(audioCtx.currentTime);
    musicMasterGain.gain.setValueAtTime(0.82,audioCtx.currentTime);
  }
  resetDrumPulse();
}

function startMusic(){
  initAudio();
  if(!audioCtx) return;

  const begin=()=>{
    if(audioCtx.state!=="running"){
      musicStarted=false;
      return;
    }
    if(musicStarted) return;

    ensureMusicBus();
    musicStarted=true;
    musicStep=0;
    nextNoteTime=audioCtx.currentTime+0.035;
    resetMusicEvolution();

    // Short confirmation that iOS Safari has opened the audio path.
    playToneAt(523.25,"triangle",0.012,0.07,audioCtx.currentTime+0.01,{direct:true});
    musicScheduler();
    if(musicTimer) clearInterval(musicTimer);
    musicTimer=setInterval(musicScheduler,25);
  };

  if(audioCtx.state!=="running"){
    audioCtx.resume().then(()=>setTimeout(begin,0)).catch(()=>{
      musicStarted=false;
      console.log("Music will start after first interaction.");
    });
  }else{
    begin();
  }
}

const FLOW_SAVE_KEY =
    "shiftvixFlowProgressV1";


function persistentFlowIndex(){

    // During a replay, save the player's real progression
    // position rather than the older replayed Flow.
    if(replayReturnFlowIndex !== null){

        return replayReturnFlowIndex;
    }

    return currentFlowIndex;
}


function normalizeFlowProgress(){

    completedFlowIndexes = new Set(
        [...completedFlowIndexes]
            .map(Number)
            .filter(index=>
                Number.isInteger(index) &&
                index >= 0 &&
                index < FLOW_TOTAL
            )
    );

    completedFlows =
        completedFlowIndexes.size;

    completedFlows = Math.max(
        0,
        Math.min(
            FLOW_TOTAL,
            Number(completedFlows) || 0
        )
    );

    highestCompletedFlow = Math.max(
        0,
        Math.min(
            FLOW_TOTAL - 1,
            Number(highestCompletedFlow) || 0
        )
    );

    highestUnlockedBlock = Math.max(
        1,
        Math.min(
            TOTAL_FLOW_BLOCKS,
            Number(highestUnlockedBlock) || 1
        )
    );

    currentFlowIndex = Math.max(
        0,
        Math.min(
            FLOW_TOTAL - 1,
            Number(currentFlowIndex) || 0
        )
    );

    // Restore every fully completed 30-Flow block.
    let requiredUnlockedBlock = 1;

    for(
        let blockNumber = 1;
        blockNumber <= TOTAL_FLOW_BLOCKS;
        blockNumber++
    ){
        const start =
            (blockNumber - 1) *
            FLOWS_PER_BLOCK;

        const end = Math.min(
            start + FLOWS_PER_BLOCK,
            FLOW_TOTAL
        );

        let blockComplete = true;

        for(let index=start;index<end;index++){
            if(!completedFlowIndexes.has(index)){
                blockComplete = false;
                break;
            }
        }

        if(!blockComplete){
            break;
        }

        requiredUnlockedBlock =
            Math.min(
                TOTAL_FLOW_BLOCKS,
                blockNumber + 1
            );
    }

    highestUnlockedBlock = Math.max(
        highestUnlockedBlock,
        requiredUnlockedBlock
    );
}


function saveFlowProgress(){

    normalizeFlowProgress();

    const savedCurrentFlow =
        Math.max(
            0,
            Math.min(
                FLOW_TOTAL - 1,
                persistentFlowIndex()
            )
        );

    const saveData = {
        version:1,
        currentFlowIndex:savedCurrentFlow,
        completedFlows,
        completedFlowIndexes:
            [...completedFlowIndexes]
                .sort((a,b)=>a-b),
        highestCompletedFlow,
        highestUnlockedBlock,
        savedAt:Date.now()
    };

    // Individual keys remain for compatibility with
    // the progression system already in the game.
    localStorage.setItem(
        "shiftvixCurrentFlow",
        String(savedCurrentFlow)
    );

    localStorage.setItem(
        "shiftvixCompletedFlows",
        String(completedFlows)
    );

    localStorage.setItem(
        "shiftvixCompletedFlowIndexes",
        JSON.stringify(
            [...completedFlowIndexes]
                .sort((a,b)=>a-b)
        )
    );

    localStorage.setItem(
        "shiftvixHighestCompletedFlow",
        String(highestCompletedFlow)
    );

    localStorage.setItem(
        "shiftvixHighestUnlockedBlock",
        String(highestUnlockedBlock)
    );

    // Complete backup snapshot.
    localStorage.setItem(
        FLOW_SAVE_KEY,
        JSON.stringify(saveData)
    );
}


function repairFlowProgressFromBackup(){

    const rawSave =
        localStorage.getItem(FLOW_SAVE_KEY);

    if(!rawSave){

        normalizeFlowProgress();
        saveFlowProgress();
        return;
    }

    try{

        const saveData =
            JSON.parse(rawSave);

        if(
            saveData &&
            saveData.version === 1
        ){

            if(
                Array.isArray(
                    saveData.completedFlowIndexes
                )
            ){
                for(
                    const index of
                    saveData.completedFlowIndexes
                ){
                    const parsedIndex =
                        Number(index);

                    if(
                        Number.isInteger(parsedIndex) &&
                        parsedIndex >= 0 &&
                        parsedIndex < FLOW_TOTAL
                    ){
                        completedFlowIndexes.add(
                            parsedIndex
                        );
                    }
                }
            }

            completedFlows = Math.max(
                completedFlows,
                Number(
                    saveData.completedFlows
                ) || 0
            );

            // Older backups only stored a consecutive count.
            if(
                !Array.isArray(
                    saveData.completedFlowIndexes
                )
            ){
                for(
                    let index=0;
                    index<Math.min(
                        completedFlows,
                        FLOW_TOTAL
                    );
                    index++
                ){
                    completedFlowIndexes.add(index);
                }
            }

            completedFlows =
                completedFlowIndexes.size;

            highestCompletedFlow = Math.max(
                highestCompletedFlow,
                Number(
                    saveData.highestCompletedFlow
                ) || 0
            );

            highestUnlockedBlock = Math.max(
                highestUnlockedBlock,
                Number(
                    saveData.highestUnlockedBlock
                ) || 1
            );

            const individualCurrent =
                localStorage.getItem(
                    "shiftvixCurrentFlow"
                );

            if(individualCurrent === null){

                currentFlowIndex =
                    Number(
                        saveData.currentFlowIndex
                    ) || 0;
            }
        }

    }catch(error){

        console.warn(
            "SHIFTVIX save backup could not be read.",
            error
        );
    }

    normalizeFlowProgress();
    saveFlowProgress();
}


repairFlowProgressFromBackup();
    
function blockForFlow(index){

    return Math.floor(
        index / FLOWS_PER_BLOCK
    ) + 1;
}


function isBlockUnlocked(blockNumber){

    return (
        blockNumber >= 1 &&
        blockNumber <= highestUnlockedBlock
    );
}


function isFlowUnlocked(index){

    if(index < 0 || index >= FLOW_TOTAL){
        return false;
    }

    return isBlockUnlocked(
        blockForFlow(index)
    );
}


function isFlowCompleted(index){

    return completedFlowIndexes.has(index);
}


/*
  SEQUENTIAL FLOW PATH:
  Inside an unlocked Sector, only the current unfinished Flow is available.
  Completed Flows stay visible/replayable. Future Flows stay visible but locked
  until the current Flow is completed.
*/
function isFlowArchiveSelectable(index){
    return (
        index === currentFlowIndex ||
        isFlowCompleted(index)
    );
}


function blockIsComplete(blockNumber){

    if(
        blockNumber < 1 ||
        blockNumber > TOTAL_FLOW_BLOCKS
    ){
        return false;
    }

    const start =
        (blockNumber - 1) *
        FLOWS_PER_BLOCK;

    const end = Math.min(
        start + FLOWS_PER_BLOCK,
        FLOW_TOTAL
    );

    for(let index=start;index<end;index++){

        if(!isFlowCompleted(index)){
            return false;
        }
    }

    return true;
}


function nextUnfinishedUnlockedFlow(
    afterIndex=currentFlowIndex
){

    // Search forward first so normal Flow 1 → Flow 2
    // progression remains seamless.
    for(
        let index=afterIndex+1;
        index<FLOW_TOTAL;
        index++
    ){
        if(
            isFlowUnlocked(index) &&
            !isFlowCompleted(index)
        ){
            return index;
        }
    }

    // Then wrap through earlier unfinished choices
    // inside the player's unlocked Flow blocks.
    for(
        let index=0;
        index<=afterIndex &&
        index<FLOW_TOTAL;
        index++
    ){
        if(
            isFlowUnlocked(index) &&
            !isFlowCompleted(index)
        ){
            return index;
        }
    }

    return Math.max(
        0,
        Math.min(
            FLOW_TOTAL-1,
            afterIndex
        )
    );
}


function saveUnlockProgress(){

    localStorage.setItem(
        "shiftvixHighestUnlockedBlock",
        String(highestUnlockedBlock)
    );
}


function checkForBlockUnlock(completedFlowIndex){

    const completedBlock =
        blockForFlow(completedFlowIndex);

    if(!blockIsComplete(completedBlock)){
        return false;
    }

    const nextBlock =
        completedBlock + 1;

    if(
        nextBlock > TOTAL_FLOW_BLOCKS ||
        nextBlock <= highestUnlockedBlock
    ){
        return false;
    }

    highestUnlockedBlock = nextBlock;

    saveFlowProgress();

    trackGame("flow_block_unlocked",{
        unlocked_block:nextBlock,
        first_flow:
            ((nextBlock - 1) *
            FLOWS_PER_BLOCK) + 1,
        last_flow:Math.min(
            nextBlock * FLOWS_PER_BLOCK,
            FLOW_TOTAL
        )
    });

    return true;
}

function flowStageFor(index){
  const n=index+1;
  return FLOW_STAGES.find(stage=>n<=stage.end)||FLOW_STAGES[FLOW_STAGES.length-1];
}
function flowCategoryForIndex(index){
  // SHIFTVIX 2.11: 300 Flows split evenly across five objective types.
  // 60 REACH, 60 COLLECT, 60 TRAVEL, 60 SCORE, 60 RINGS.
  return ["REACH","COLLECT","TRAVEL","SCORE","RINGS"][index%5];
}

function flowStrikeAllowance(index,category){
  const n=index+1;

  /*
    SHIFTVIX 2.10 — 300 FLOW DIFFICULTY PHILOSOPHY

    FLOWS   1–30   : teach success — no strike restrictions.
    FLOWS  31–100  : light pressure — occasional 2-strike limits.
    FLOWS 101–200  : moderate pressure — 2-strike limits plus rare 1-strike limits.
    FLOWS 201–300  : advanced pressure — more frequent limits, but NEVER perfection.

    Long-duration COLLECT and TRAVEL objectives remain more forgiving
    because the player is exposed to more VOID attacks.
  */

  if(n<=30)return null;

  const longObjective=
    category==="COLLECT" ||
    category==="TRAVEL" ||
    category==="RINGS";

  if(n<=100){
    return ((n-31)%6===0)?2:null;
  }

  if(n<=200){
    if(!longObjective && (n-101)%10===0)return 1;
    if((n-101)%5===0)return 2;
    return null;
  }

  if(!longObjective && (n-201)%8===0)return 1;
  if((n-201)%4===0)return 2;

  return null;
}

function applyFlowStrikeAllowance(flow,index){
  const maxStrikes=flowStrikeAllowance(index,flow.category);

  if(maxStrikes===null){
    return flow;
  }

  return {
    ...flow,
    maxFlowStrikes:maxStrikes,
    label:`${flow.label} WITH ${maxStrikes} STRIKE${maxStrikes===1?"":"S"} OR LESS`
  };
}

function createFlow(index){
  const n=index+1;
  const group=Math.floor(index/5);
  const category=flowCategoryForIndex(index);
  const name="CURRENT FLOW";

  /*
    Core rhythm across all 300:
    REACH → COLLECT → TRAVEL → SCORE → RINGS

    Target scaling stays the same as the current game.
    Only the punishment philosophy changes:
    mandatory progression never requires a perfect/no-strike run.
  */

  let flow;

  if(category==="REACH"){
    const target=4+Math.floor(group/3);

    flow={
      id:`reach_${n}`,
      name,
      category,
      label:`REACH LEVEL ${target}`,
      target,
      metric:"level"
    };

    return applyFlowStrikeAllowance(flow,index);
  }

  if(category==="COLLECT"){
    const variant=group%4;

    if(variant===0){
      const target=600+group*55;

      flow={
        id:`collect_${n}`,
        name,
        category,
        label:`COLLECT ${target.toLocaleString()} ORBS`,
        target,
        metric:"orbs"
      };

      return applyFlowStrikeAllowance(flow,index);
    }

    const colors=["BLUE","GREEN","PURPLE","ORANGE","RED"];
    const color=colors[group%colors.length];
    const base={
      BLUE:500,
      GREEN:450,
      PURPLE:320,
      ORANGE:200,
      RED:120
    }[color];
    const growth={
      BLUE:28,
      GREEN:25,
      PURPLE:18,
      ORANGE:12,
      RED:8
    }[color];
    const target=base+group*growth;

    if(variant===3){
      const totalTarget=700+group*60;

      flow={
        id:`collect_total_${n}`,
        name,
        category,
        label:`COLLECT ${totalTarget.toLocaleString()} ORBS`,
        target:totalTarget,
        metric:"orbs"
      };

      return applyFlowStrikeAllowance(flow,index);
    }

    flow={
      id:`collect_${color.toLowerCase()}_${n}`,
      name,
      category,
      label:`COLLECT ${target.toLocaleString()} ${color} ORBS`,
      target,
      metric:"color",
      color
    };

    return applyFlowStrikeAllowance(flow,index);
  }

  if(category==="TRAVEL"){
    const target=1500+group*275;

    flow={
      id:`travel_${n}`,
      name,
      category,
      label:`TRAVEL ${target.toLocaleString()}m`,
      target,
      metric:"distance"
    };

    return applyFlowStrikeAllowance(flow,index);
  }

  if(category==="RINGS"){
    /*
      Accuracy objective.
      Starts at 5 rings and gradually rises to the high 40s by the end
      of the 300-Flow path. Missing a ring does NOT cost a life.
    */
    /*
      SHIFTVIX 2.13 — GOLD RING OBJECTIVE SCALE
      Early Ring Flows should feel like a real objective, not a quick bonus.
      Starts at 12 rings and climbs steadily toward 60.
    */
    const target=Math.min(
      60,
      12 + Math.floor(group*1.0)
    );

    flow={
      id:`rings_${n}`,
      name,
      category,
      label:`FLY THROUGH ${target.toLocaleString()} GOLD RINGS`,
      target,
      metric:"rings"
    };

    return applyFlowStrikeAllowance(flow,index);
  }

  const target=15000+group*4200;

  flow={
    id:`score_${n}`,
    name,
    category,
    label:`SCORE ${target.toLocaleString()} POINTS`,
    target,
    metric:"score"
  };

  return applyFlowStrikeAllowance(flow,index);
}
function beginCurrentFlow(){

    activeChallenge = createFlow(currentFlowIndex);

    objectiveOrbsCollected = 0;

    challengeStart = {
        found: foundCount,
        score,
        distance,
        strikes,
        rings: goldRingsPassed,
        tierCounts: {...tierCounts}
    };

    // Ring objectives should begin presenting targets quickly.
    if(activeChallenge.metric==="rings"){
        goldRingSpawnCooldown=Math.min(goldRingSpawnCooldown,.35);
    }

    updateChallenge();
}
function challengeValue(ch){
  if(!challengeStart)return 0;

  const totalOrbs=objectiveOrbsCollected;
  const colorOrbs=Math.max(
    0,
    (tierCounts[ch.color]||0)-
    (challengeStart.tierCounts[ch.color]||0)
  );

  let value=0;

  if(ch.metric==="level")value=level;
  else if(ch.metric==="orbs")value=totalOrbs;
  else if(ch.metric==="color")value=colorOrbs;
  else if(ch.metric==="score")value=Math.max(0,score-challengeStart.score);
  else if(ch.metric==="distance")value=Math.max(0,distance-challengeStart.distance);
  else if(ch.metric==="rings")value=Math.max(0,goldRingsPassed-(challengeStart.rings||0));

  /*
    Strike allowances count only strikes taken during THIS Flow.
    Earlier mistakes in the same run do not make a later Flow impossible.
  */
  if(Number.isFinite(ch.maxFlowStrikes)){
    const flowStrikes=Math.max(
      0,
      strikes-challengeStart.strikes
    );

    if(flowStrikes>ch.maxFlowStrikes){
      return 0;
    }
  }

  return value;
}

function loadSelectedFlow(
    flowIndex,
    {
        replay=false,
        announce=true

){

    if(
        !Number.isInteger(flowIndex) ||
        flowIndex < 0 ||
        flowIndex >= FLOW_TOTAL ||
        !isFlowUnlocked(flowIndex)
    ){
        trackGame("locked_flow_selected",{
            selected_flow:
                Number.isFinite(flowIndex)
                    ? flowIndex + 1
                    : -1,
            completed_flows:
                completedFlows,

        return false;
    }

    if(challengeAdvanceTimer){
        clearTimeout(
            challengeAdvanceTimer
        );
        challengeAdvanceTimer = null;
    }

    if(replay){
        // A completed Flow is practice. Return to the
        // player's real active Flow when practice ends.
        if(replayReturnFlowIndex === null){
            replayReturnFlowIndex =
                currentFlowIndex;
        }
    }else{
        // Selecting an unfinished unlocked Flow becomes
        // the player's real active progression choice.
        replayReturnFlowIndex = null;
    }

    currentFlowIndex = flowIndex;

    objectiveOrbsCollected = 0;

    activeChallenge =
        createFlow(currentFlowIndex);

    challengeStart = {
        found:foundCount,
        score,
        distance,
        strikes,
        tierCounts:{...tierCounts}
    };

    environmentEngine.resetForFlow({
        announce:false
    });

    saveFlowProgress();
    updateChallenge();

    trackGame(
        replay
            ? "flow_replay_started"
            : "flow_selected",
        {
            selected_flow:
                currentFlowIndex + 1,
            return_flow:
                replay &&
                replayReturnFlowIndex !== null
                    ? replayReturnFlowIndex + 1
                    : null,
            environment:
                environmentEngine.current.id,
            flow_stage:
                flowStageFor(
                    currentFlowIndex

    );

        showModeBanner(
            replay

        }
    );

function makeFluxDustField(){

function updateFluxDust(dt){
    if(!fluxDust)return;

    const reducedMotion=
        window.matchMedia &&
        window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    const targetPower=
        reducedMotion ? 0 :
        THREE.MathUtils.clamp(fluxBoostAmount,0,1);

    // Fast attack, gentle release. No blinking or pulsing.
    const response=
        1-Math.exp(-dt*(targetPower>fluxDustVisualPower?5.8:2.1));

    fluxDustVisualPower+=
        (targetPower-fluxDustVisualPower)*response;

    const visualPower=
        THREE.MathUtils.clamp(fluxDustVisualPower,0,1);

    fluxDust.material.opacity=
        THREE.MathUtils.lerp(
            0,
            FLUX_DUST_MAX_OPACITY,
            visualPower
        );

    const streakLength=
        THREE.MathUtils.lerp(
            4,
            FLUX_DUST_MAX_STREAK,
            visualPower
        );

    const speedMult=
        THREE.MathUtils.lerp(
            1.05,
            FLUX_DUST_MAX_SPEED_MULT,
            visualPower
        );

    const pos=fluxDust.geometry.attributes.position;
    const anchors=fluxDust.userData.anchors;

    // Hard cap the visual travel rate even if gameplay speed rises later.
    const cappedSpeed=Math.min(speed,330);

    for(let i=0;i<FLUX_DUST_COUNT;i++){
        const p=i*6;
        const x=anchors[i*2];
        const y=anchors[i*2+1];

        let z=pos.array[p+2];
        z+=cappedSpeed*dt*speedMult;

        if(z>82){
            z=-1050-Math.random()*280;
        }

        // Two points at different Z values form a short radial perspective streak.
        pos.array[p]=x;
        pos.array[p+1]=y;
        pos.array[p+2]=z;

        pos.array[p+3]=x;
        pos.array[p+4]=y;
        pos.array[p+5]=z-streakLength;
    }

    pos.needsUpdate=true;
}

function chooseTier(){

    /*
    Standard distribution:

    WHITE  = 26%
    BLUE   = 22%
    GREEN  = 18%
    PURPLE = 14%
    ORANGE = 11%
    RED    = 9%
    */

    const standardWeights={
        WHITE:26,
        BLUE:22,
        GREEN:18,
        PURPLE:14,
        ORANGE:11,
        RED:9
    };

    const weights={...standardWeights};

    /*
    When the current Flow requires a specific color,
    increase that color's appearance without making
    every train that color.
    */

    const requiredColor=
        activeChallenge &&
        activeChallenge.metric==="color"
            ? activeChallenge.color
            : null;

    if(requiredColor && weights[requiredColor]!==undefined){

        const boost={
            BLUE:10,
            GREEN:11,
            PURPLE:12,
            ORANGE:14,
            RED:16
        }[requiredColor] || 10;

        weights[requiredColor]+=boost;
    }

    const total=
        weights.WHITE+
        weights.BLUE+
        weights.GREEN+
        weights.PURPLE+
        weights.ORANGE+
        weights.RED;

    let roll=Math.random()*total;

    for(let i=0;i<TIERS.length;i++){

        const tier=TIERS[i];

        roll-=weights[tier.name];

        if(roll<=0){
            return tier;
        }
    }

    return TIERS[0];
}

function makeGoldRing(reason="ambient"){
  const activeRings=beacons.filter(
    b=>b?.userData?.isGoldRing && b.userData.state==="active"
  ).length;
  if(activeRings>=2)return false;

  trainId++;

  // Prefer lanes not currently occupied by an active VOID at a similar depth.
  const candidates=[];
  for(let y=0;y<3;y++){
    for(let x=0;x<3;x++){
      const laneX=LANE_X[x];
      const laneY=LANE_Y[y];
      const blocked=beacons.some(b=>
        b?.userData?.isVoid &&
        b.userData.state==="active" &&
        Math.abs(b.userData.roadX-laneX)<1 &&
        Math.abs(b.userData.roadY-laneY)<1 &&
        b.position.z<(FAR_Z+350)
      );
      if(!blocked)candidates.push({x,y});
    }
  }

  const pool=candidates.length?candidates:[
    {x:0,y:0},{x:1,y:0},{x:2,y:0},
    {x:0,y:1},{x:1,y:1},{x:2,y:1},
    {x:0,y:2},{x:1,y:2},{x:2,y:2}
  ];

  const chosen=pool[Math.floor(Math.random()*pool.length)];
  const x=LANE_X[chosen.x];
  const y=LANE_Y[chosen.y];

  const group=new THREE.Group();

  // Same overall visual size family as the VOID ring, but fully open.
  const outerGlow=new THREE.Mesh(
    new THREE.TorusGeometry(10.45,1.15,10,56),
    new THREE.MeshBasicMaterial({
      color:0xffa91f,
      transparent:true,
      opacity:.18,
      blending:THREE.AdditiveBlending,
      depthWrite:false
    })
  );

  const goldBand=new THREE.Mesh(
    new THREE.TorusGeometry(8.45,1.25,12,64),
    new THREE.MeshBasicMaterial({
      color:0xffc83d,
      transparent:true,
      opacity:.96,
      blending:THREE.AdditiveBlending,
      depthWrite:false
    })
  );

  const hotEdge=new THREE.Mesh(
    new THREE.TorusGeometry(8.45,.48,10,64),
    new THREE.MeshBasicMaterial({
      color:0xfff2a0,
      transparent:true,
      opacity:.98,
      blending:THREE.AdditiveBlending,
      depthWrite:false
    })
  );

  const innerGlow=new THREE.Mesh(
    new THREE.TorusGeometry(7.55,.32,8,60),
    new THREE.MeshBasicMaterial({
      color:0xffdf6b,
      transparent:true,
      opacity:.72,
      blending:THREE.AdditiveBlending,
      depthWrite:false
    })
  );

  group.add(outerGlow);
  group.add(goldBand);
  group.add(hotEdge);
  group.add(innerGlow);

  group.position.set(x,y,FAR_Z+120);
  group.scale.setScalar(introScale);

  group.userData={
    isGoldRing:true,
    state:"active",
    fade:1,
    train:trainId,
    speedMult:1.12,
    roadX:x,
    roadY:y,
    outerGlow,
    goldBand,
    hotEdge,
    innerGlow,
    glow:outerGlow,
    core:goldBand,
    ringBornAt:performance.now(),
    ringReason:reason,
    ringLaneX:chosen.x,
    ringLaneY:chosen.y
  };

  scene.add(group);
  beacons.push(group);
  goldRingSpawnedThisRun++;

  trackGame("gold_ring_spawned",{
    trigger_reason:reason,
    distance:Math.floor(distance),
    flow_number:currentFlowIndex+1,
    lane_x:chosen.x,
    lane_y:chosen.y,
    ring_count_run:goldRingSpawnedThisRun
  });

  return true;
}


function startGoldRingSequence(){
  /*
    A Ring Flow can occasionally send a short run of 2–3 rings.
    They remain spaced apart so the player has to steer accurately,
    but they arrive close enough together to feel like a flight path.
  */
  goldRingSequenceRemaining=
    Math.random()<.55 ? 2 : 3;

  goldRingSequenceDelay=.18;
}

function updateGoldRingSequence(worldDt){
  if(
    !activeChallenge ||
    activeChallenge.metric!=="rings" ||
    goldRingSequenceRemaining<=0
  ){
    return;
  }

  goldRingSequenceDelay-=worldDt;

  if(goldRingSequenceDelay<=0){
    if(makeGoldRing("ring_sequence")){
      goldRingSequenceRemaining--;
      goldRingSequenceDelay=.42+Math.random()*.34;
    }else{
      goldRingSequenceDelay=.18;
    }
  }
}

function makeVoidHazard(reason="normal",forcedLane=null){
  const activeVoids=beacons.filter(
    b=>b?.userData?.isVoid && b.userData.state==="active"
  ).length;
  if(activeVoids>=5)return false;

  trainId++;

  let xIndex;
  let yIndex;

  if(forcedLane && Number.isInteger(forcedLane.x) && Number.isInteger(forcedLane.y)){
    xIndex=Math.max(0,Math.min(2,forcedLane.x));
    yIndex=Math.max(0,Math.min(2,forcedLane.y));
  }else{
    xIndex=Math.floor(Math.random()*3);
    yIndex=Math.floor(Math.random()*3);
  }

  const x=LANE_X[xIndex];
  const y=LANE_Y[yIndex];

  const group=new THREE.Group();

  // SHIFTVIX 2.9 — VOID SPIKE METEOR
  // Fully opaque pitch-black center.
  const core=new THREE.Mesh(
    new THREE.SphereGeometry(7.45,28,28),
    new THREE.MeshBasicMaterial({
      color:0x000000,
      transparent:false,
      opacity:1,
      depthWrite:false
    })
  );

  // Fiery orange ring.
  const corona=new THREE.Mesh(
    new THREE.TorusGeometry(8.30,1.30,12,56),
    new THREE.MeshBasicMaterial({
      color:0xff7100,
      transparent:true,
      opacity:.94,
      blending:THREE.AdditiveBlending,
      depthWrite:false
    })
  );

  // Bright gold strike edge.
  const ring=new THREE.Mesh(
    new THREE.TorusGeometry(8.45,.60,10,56),
    new THREE.MeshBasicMaterial({
      color:0xffd34f,
      transparent:true,
      opacity:.98,
      blending:THREE.AdditiveBlending,
      depthWrite:false
    })
  );

  // Red-orange heat ring.
  const heat=new THREE.Mesh(
    new THREE.TorusGeometry(9.30,1.20,10,52),
    new THREE.MeshBasicMaterial({
      color:0xff2800,
      transparent:true,
      opacity:.32,
      blending:THREE.AdditiveBlending,
      depthWrite:false
    })
  );

  // Soft outer aura.
  const aura=new THREE.Mesh(
    new THREE.TorusGeometry(10.55,1.15,8,48),
    new THREE.MeshBasicMaterial({
      color:0xff4b00,
      transparent:true,
      opacity:.13,
      blending:THREE.AdditiveBlending,
      depthWrite:false
    })
  );

  // SHIFTVIX 2.9.2 — UNIFORM ALTERNATING SPIKES
  // Big spike, little spike, big spike, little spike...
  // Every wide base is anchored to the outside of the fiery ring,
  // and every sharp tip points AWAY from the meteor center.
  const spikes=new THREE.Group();

  const bigSpikeCount=8;
  const totalSpikeCount=bigSpikeCount*2;

  // Ring edge is ~9.3 units from center.
  // ConeGeometry is centered on its local Y axis, so the spike center must
  // sit half its length beyond the attachment point for the base to touch
  // the ring cleanly.
  const attachRadius=9.15;

  for(let i=0;i<totalSpikeCount;i++){
    const a=(i/totalSpikeCount)*Math.PI*2;
    const isBig=(i%2===0);

    const spikeLength=isBig?5.6:3.5;
    const spikeBaseRadius=isBig?1.22:.78;

    const spike=new THREE.Mesh(
      new THREE.ConeGeometry(
        spikeBaseRadius,
        spikeLength,
        12,
        1,
        false
      ),
      new THREE.MeshBasicMaterial({
        color:isBig?0xff1e20:0xff3a28,
        transparent:true,
        opacity:.98,
        blending:THREE.AdditiveBlending,
        depthWrite:false
      })
    );

    /*
      ConeGeometry points along local +Y.
      Rotate +Y so the cone tip points radially OUTWARD.
      Because the geometry is centered, place the cone center at:
      ring attachment radius + half spike length.
      That puts the thick base directly against the ring.
    */
    spike.rotation.z = a - Math.PI/2;

    const centerRadius=attachRadius + spikeLength*.5;

    spike.position.set(
      Math.cos(a)*centerRadius,
      Math.sin(a)*centerRadius,
      0
    );

    spikes.add(spike);
  }

group.add(aura);
  group.add(heat);
  group.add(spikes);
  group.add(corona);
  group.add(ring);
  group.add(core);

  group.position.set(x,y,FAR_Z+135);
  group.scale.setScalar(introScale);

  group.userData={
    core,
    corona,
    heat,
    ring,
    aura,
    glow:aura,
    spikes,
    isVoid:true,
    state:"active",
    fade:1,
    train:trainId,
    speedMult:1.78,
    roadX:x,
    roadY:y,
    voidReason:reason,
    voidBornAt:performance.now(),
    meteorPhase:Math.random()*Math.PI*2,
    meteorLaneX:xIndex,
    meteorLaneY:yIndex
  };

  scene.add(group);
  beacons.push(group);
  voidCountRun++;

  trackGame("void_spawned",{
    trigger_reason:reason,
    distance:Math.floor(distance),
    level,
    flow_number:currentFlowIndex+1,
    lane_x:xIndex,
    lane_y:yIndex,
    void_count_run:voidCountRun
  });

  return true;
}

function spawnVoidVolley(reason="normal"){
  const allLanes=[];
  for(let y=0;y<3;y++){
    for(let x=0;x<3;x++){
      allLanes.push({x,y});
    }
  }

  for(let i=allLanes.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [allLanes[i],allLanes[j]]=[allLanes[j],allLanes[i]];
  }

  let count=1;

  if(reason!=="tutorial"){
    const r=Math.random();
    if(r>=.77)count=3;
    else if(r>=.34)count=2;
  }

  let spawned=0;

  for(let i=0;i<count;i++){
    if(makeVoidHazard(
      i===0?reason:(count===3?"meteor_triple":"meteor_pair"),
      allLanes[i]
    )){
      spawned++;
    }
  }

  return spawned;
}

function hitVoidHazard(b){
  if(!b?.userData || b.userData.state!=="active")return;

  b.userData.state="collected";
  b.userData.fade=1;
  fluxCollectionStreak=0;
  breakTimer=0;
  combo=1;

  if(!heroMode){
    strikes++;
    lastStrikeDistance=distance;

    if(environmentEngine?.current?.onStrike){
      environmentEngine.current.onStrike();
    }

    track("strike",{
      strike_number:strikes,
      level,
      distance:Math.floor(distance),
      score,
      source:"void"
    });

    trackGame("void_hit",{
      distance:Math.floor(distance),
      level,
      strikes,
      flow_number:currentFlowIndex+1
    });

    playStrike();
    pulseCenterReactorDamage();

    if(navigator.vibrate){
      navigator.vibrate([30,40,30]);
    }

    if(strikes<3){
      animateLostLife(strikes-1);
    }else{
      updateStrikes();
    }

    const signal=document.getElementById("signal");
    if(signal)signal.textContent="Signal: break "+strikes+"/3";

    if(strikes>=3){
      endRun();
    }
  }else{
    // During the opening grace period, the Void still teaches avoidance
    // without ending a brand-new player's run.
    playStrike();
    pulseCenterReactorDamage();
    if(navigator.vibrate)navigator.vibrate([18,24,18]);
  }
}

const WARP_COLOR=0xd86cff;
const WARP_CORE_COLOR=0xffffff;
const WARP_GLOW_COLOR=0x7feaff;
let warpOrbActive=false;
let warpCollectedThisRun=0;
let warpCooldownUntilDistance=0;

function playWarpOrbSound(tier=1){
  initAudio();
  if(!audioCtx)return;
  const now=audioCtx.currentTime;
  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();
  osc.type="sawtooth";
  osc.frequency.setValueAtTime(180,now);
  osc.frequency.exponentialRampToValueAtTime(1200+tier*420,now+.24);
  gain.gain.setValueAtTime(.0001,now);
  gain.gain.linearRampToValueAtTime(.055,now+.025);
  gain.gain.exponentialRampToValueAtTime(.0001,now+.46);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(now);osc.stop(now+.5);
}

function activateWarp(reason,tier=1){
  const jump=warpTierDistance(tier);
  const before=distance;

  // Warp is instantaneous and never changes the current viewport/camera sizing.
  distance+=jump;
  level=Math.floor(distance/500)+1;
  lastLevel=Math.max(lastLevel,level);

  // The Warp orb supplies its own breakthrough so the normal 3000m boundary
  // does not immediately fire a duplicate burst on the next frame.
  lastWarpBreakthrough=Math.floor(distance/3000);

  warpCollectedThisRun++;
  warpCooldownUntilDistance=distance+700+Math.random()*250;

  playWarpOrbSound(tier);
  triggerWarpBreakthrough("warp");
  launchSurge=Math.max(launchSurge,16+tier*3);
  showPowerAnnouncement("WARP",tier);
  updateHUD();
  updateChallenge();

  if(navigator.vibrate){
    navigator.vibrate(tier===3?[30,24,50,28,70]:tier===2?[26,22,48]:[22,20,38]);
  }

  trackGame("warp_orb_collected",{
    trigger_reason:reason||"unknown",
    power_tier:tier,
    jump_meters:jump,
    distance_before:Math.floor(before),
    distance_after:Math.floor(distance),
    level_after:level,
    flow_number:currentFlowIndex+1,
    warp_count_run:warpCollectedThisRun
  });
}

function makeLegendaryOrb(){
  const available=[];

  // Different legendary orb objects may exist on screen together.
  // Their effects still cannot overlap after collection.
  if(!fluxOrbActive)available.push({
    type:"flux",
    spawn:()=>makeFluxOrb("random_wave")
  });

  if(!chronoOrbActive)available.push({
    type:"chrono",
    spawn:()=>makeChronoOrb("random_wave")
  });

  if(!midasOrbActive)available.push({
    type:"midas",
    spawn:()=>makeMidasOrb("random_wave")
  });

  if(!warpOrbActive && distance>=warpCooldownUntilDistance)available.push({
    type:"warp",
    spawn:()=>makeWarpOrb("random_wave")
  });

  if(!available.length)return false;

  const choice=
    available[Math.floor(Math.random()*available.length)];

  const spawned=choice.spawn();

  if(spawned){
    legendarySpawnCount++;
    scheduleNextLegendaryWindow();

    trackGame("legendary_orb_selected",{
      legendary_type:choice.type,
      distance:Math.floor(distance),
      flow_number:currentFlowIndex+1,
      legendary_spawn_count:legendarySpawnCount,
      active_effect:currentLegendaryEffect()||"none"
    });
  }

  return spawned;
}

// =========================
// SHIFTVIX MOBILE PERFORMANCE 1.0
// Shared collectible geometry + explicit GPU cleanup.
// =========================
const sharedBeaconGeometryCache=new Map();

function getSharedBeaconGeometry(radius,segments=14){
  const key=`${radius.toFixed(3)}:${segments}`;
  let geometry=sharedBeaconGeometryCache.get(key);

  if(!geometry){
    geometry=new THREE.SphereGeometry(
      radius,
      segments,
      segments
    );
    sharedBeaconGeometryCache.set(key,geometry);
  }

  return geometry;
}

function disposeBeaconObject(group){
  if(!group)return;

  scene.remove(group);

  const sharedGeometry=
    Boolean(group.userData&&group.userData.sharedGeometry);

  group.traverse(child=>{
    if(!child||!child.isMesh)return;

    if(
      !sharedGeometry &&
      child.geometry &&
      typeof child.geometry.dispose==="function"
    ){
      child.geometry.dispose();
    }

    const materials=
      Array.isArray(child.material)
        ? child.material
        : [child.material];

    materials.forEach(material=>{
      if(
        material &&
        typeof material.dispose==="function"
      ){
        material.dispose();
      }
    });
  });
}

function makeBeacon(tier,x,y,z,train){
 const group=new THREE.Group();

 // Shared geometry avoids hundreds/thousands of repeated GPU allocations
 // during long mobile sessions.
 const coreGeometry=
   getSharedBeaconGeometry(tier.size,14);

 const glowGeometry=
   getSharedBeaconGeometry(tier.size*1.9,12);

 const core=new THREE.Mesh(
   coreGeometry,
   new THREE.MeshBasicMaterial({color:tier.color})
 );

 const glow=new THREE.Mesh(
   glowGeometry,
   new THREE.MeshBasicMaterial({
     color:tier.color,
     transparent:true,
     opacity:.10,
     blending:THREE.AdditiveBlending,
     depthWrite:false
   })
 );

 group.add(glow);
 group.add(core);
 group.position.set(x,y,z);

 group.userData={
   core,
   glow,
   tier,
   value:tier.value,
   state:"active",
   fade:1,
   train,
   speedMult:1,
   roadX:x,
   roadY:y,
   sharedGeometry:true
 };

 group.scale.setScalar(introScale);
 scene.add(group);
 beacons.push(group);
}

window.addEventListener("pointerup",e=>{

  if(e.target&&e.target.id==="center")return;
  if(paused)return;

  const rawDx = e.clientX - downX;
  const rawDy = e.clientY - downY;

  if (Math.hypot(rawDx, rawDy) < 20) return;

  const roadSwipe = environmentSwipe(rawDx,rawDy);
  const dx = roadSwipe.x;
  const dy = roadSwipe.y;

  const straightThreshold = 70;
  const diagonalThreshold = 45;

  let mx = 0;
  let my = 0;

  if (
      Math.abs(dx) > diagonalThreshold &&
      Math.abs(dy) > diagonalThreshold
  ){
      mx = dx > 0 ? 1 : -1;
      my = dy > 0 ? 1 : -1;
  }
  else if (Math.abs(dx) > Math.abs(dy)){

      if(dx > straightThreshold) mx = 1;
      if(dx < -straightThreshold) mx = -1;

  }
  else{

      if(dy > straightThreshold) my = 1;
      if(dy < -straightThreshold) my = -1;

  }

  if(mx !== 0 || my !== 0){
      moveLane(mx,my);
  }

});

function formatRunFlowProgress(flow,value){
  const current=Math.max(0,Math.min(flow.target,value));
  const whole=Math.floor(current);
  const target=Math.floor(flow.target);
  if(flow.metric==="distance")return `${whole.toLocaleString()} / ${target.toLocaleString()}m`;
  if(flow.metric==="score"||flow.metric==="precision")return `${whole.toLocaleString()} / ${target.toLocaleString()} POINTS`;
  if(flow.metric==="level"||flow.metric==="lives"||flow.metric==="maxStrikesLevel")return `LEVEL ${whole} / ${target}`;
  if(flow.metric==="rings")return `${whole.toLocaleString()} / ${target.toLocaleString()} RINGS`;
  return `${whole.toLocaleString()} / ${target.toLocaleString()} ORBS`;
}

let lastPadMove = 0;
let lastPadPausePressed = false;

function updateGamepad(){

    const pads = navigator.getGamepads
        ? navigator.getGamepads()
        : [];

    const pad = pads[0];

    if(!pad) return;

    const now = performance.now();

    // Prevent repeated movement every frame
    if(now - lastPadMove < 200) return;

    const deadZone = 0.70;

    const x = pad.axes[0];
    const y = pad.axes[1];

    let dx = 0;
    let dy = 0;

    if(x > deadZone) dx = 1;
    if(x < -deadZone) dx = -1;

    if(y > deadZone) dy = 1;
    if(y < -deadZone) dy = -1;

    if(pad.buttons[12]?.pressed) dy = -1; // Up
    if(pad.buttons[13]?.pressed) dy = 1;  // Down
    if(pad.buttons[14]?.pressed) dx = -1; // Left
    if(pad.buttons[15]?.pressed) dx = 1;  // Right

    if(dx || dy){

        moveLane(dx,dy);

        lastPadMove = now;

    }

    // Pause button — edge-triggered so holding it cannot toggle every frame.
    const pausePressed=Boolean(pad.buttons[9]?.pressed);
    if(pausePressed&&!lastPadPausePressed){
        togglePause("gamepad");
    }
    lastPadPausePressed=pausePressed;

}

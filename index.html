function playWarpOrbSound(tier=1){
  initAudio();
  if(!audioCtx)return;
  const now=audioCtx.currentTime;
  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();
  osc.type="sawtooth";
  osc.frequency.setValueAtTime(180,now);
  osc.frequency.exponentialRampToValueAtTime(1200+tier*420,now+.24);
  gain.gain.setValueAtTime(.0001,now);
  gain.gain.linearRampToValueAtTime(.055,now+.025);
  gain.gain.exponentialRampToValueAtTime(.0001,now+.46);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(now);osc.stop(now+.5);
}

function isWarpFlowActive(){
  return activeChallenge?.metric==="warp";
}

function scheduleWarpFlowOrb(first=false){
  if(!isWarpFlowActive()){
    warpFlowNextWarpDistance=Infinity;
    return;
  }

  const min=first?WARP_FLOW_FIRST_GAP_MIN:WARP_FLOW_GAP_MIN;
  const max=first?WARP_FLOW_FIRST_GAP_MAX:WARP_FLOW_GAP_MAX;

  warpFlowNextWarpDistance=
    distance+
    min+
    Math.random()*(max-min);

  warpCooldownUntilDistance=Math.min(
    warpCooldownUntilDistance,
    warpFlowNextWarpDistance
  );
}

function updateWarpFlowOpportunity(){
  if(!isWarpFlowActive())return;
  if(warpOrbActive)return;
  if(distance<warpFlowNextWarpDistance)return;
  if(distance<warpCooldownUntilDistance)return;

  if(makeWarpOrb("warp_flow")){
    warpFlowNextWarpDistance=Infinity;
  }else{
    warpFlowNextWarpDistance=distance+35;
  }
}

function activateWarp(reason,tier=1){
  const jump=
    isWarpFlowActive()
      ? warpFlowJumpDistance()
      : warpTierDistance(tier);

  if(activeChallenge?.category==="WARP"){
    addPrototypeTotal("WARP",1);
  }

  const before=distance;

  // Warp is instantaneous and never changes the current viewport/camera sizing.
  distance+=jump;
  level=Math.floor(distance/500)+1;
  lastLevel=Math.max(lastLevel,level);

  // The Warp orb supplies its own breakthrough so the normal 3000m boundary
  // does not immediately fire a duplicate burst on the next frame.
  lastWarpBreakthrough=Math.floor(distance/3000);

  warpCollectedThisRun++;

  if(isWarpFlowActive()){
    warpCooldownUntilDistance=
      distance+
      WARP_FLOW_GAP_MIN+
      Math.random()*(WARP_FLOW_GAP_MAX-WARP_FLOW_GAP_MIN);

    warpFlowNextWarpDistance=warpCooldownUntilDistance;
  }else{
    warpCooldownUntilDistance=
      distance+700+Math.random()*250;

  triggerWarpBreakthrough("warp");

  trackGame("warp_collected",{

    distance_after:Math.floor(distance),

// Shared collectible geometry + explicit GPU cleanup.

const sharedBeaconGeometryCache=new Map();

function getSharedBeaconGeometry(radius,segments=14){
  const key=`${radius.toFixed(3)}:${segments}`;
  let geometry=sharedBeaconGeometryCache.get(key);

  if(!geometry){
    geometry=new THREE.SphereGeometry(
      radius,
      segments,
      segments
    );
    sharedBeaconGeometryCache.set(key,geometry);
  }

  return geometry;
}

function disposeBeaconObject(group){
  if(!group)return;

  scene.remove(group);

  const sharedGeometry=
    Boolean(group.userData&&group.userData.sharedGeometry);

  group.traverse(child=>{
    if(!child||!child.isMesh)return;

    if(
      !sharedGeometry &&
      child.geometry &&
      typeof child.geometry.dispose==="function"
    ){
      child.geometry.dispose();
    }

    const materials=
      Array.isArray(child.material)
        ? child.material
        : [child.material];

    materials.forEach(material=>{
      if(
        material &&
        typeof material.dispose==="function"
      ){
        material.dispose();
      }
    });
  });
}

function beginTrainShiftIfConnected(
  fromLaneKey,
  toLaneKey
){
  const now=performance.now();

  // Already carrying a valid departure across empty lanes:
  // do not replace it just because another swipe crosses more empty space.
  if(
    pendingTrainShift &&
    (
      now-pendingTrainShift.startedAt
    )<=TRAIN_SHIFT_CONNECTION_WINDOW_MS
  ){
    pendingTrainShift.toLaneKey=
      toLaneKey;
    return;
  }

  if(
    !recentTrainContactForLane(
      fromLaneKey,
      now
    )
  ){
    pendingTrainShift=null;
    return;
  }

  pendingTrainShift={
    fromLaneKey,
    fromTrainId:
      lastRegularTrainContact.trainId,
    toLaneKey,
    startedAt:now
  };
}

function scoreTrainToTrainShift(
  destinationLaneKey,
  destinationTrainId
){
  const now=performance.now();

  // First real train contact primes the SHIFT route.
  if(!shiftLastArrivalLane){
    shiftLastArrivalLane=
      destinationLaneKey;
  }

  if(!pendingTrainShift){
    return false;
  }

  const age=
    now-pendingTrainShift.startedAt;

  if(
    age>TRAIN_SHIFT_CONNECTION_WINDOW_MS
  ){
    pendingTrainShift=null;
    return false;
  }

  // Returning to the train/lane you departed from is not a SHIFT.
  if(
    destinationLaneKey===
      pendingTrainShift.fromLaneKey
  ){
    pendingTrainShift=null;
    return false;
  }

  // It must be a real train on the destination lane.
  if(
    !Number.isFinite(
      Number(destinationTrainId)
    )
  ){
    return false;
  }

  const fromLane=
    pendingTrainShift.fromLaneKey;

  // Existing anti-farming rule:
  // A -> B -> A does not score the return to A.
  const countsAsPatternShift=
    destinationLaneKey!==
      shiftPreviousArrivalLane;

  // Route history is updated ONLY on real train reconnection,
  // never while crossing empty air.
  shiftPreviousArrivalLane=
    shiftLastArrivalLane;

  shiftLastArrivalLane=
    destinationLaneKey;

  pendingTrainShift=null;

  if(!countsAsPatternShift){
    trackGame(
      "lane_shift_repeat_rejected",
      {
        from_lane:fromLane,
        to_lane:destinationLaneKey,
        shift_count_run:shiftCountRun,
        flow_number:
          currentFlowIndex+1
      }
    );
    return false;
  }

  shiftCountRun++;

  if(activeChallenge?.category==="SHIFT"){
    addPrototypeTotal("SHIFT",1);
  }

  trackGame(
    "lane_shift",
    {
      shift_count_run:
        shiftCountRun,
      from_lane:
        fromLane,
      to_lane:
        destinationLaneKey,
      destination_train:
        destinationTrainId,
      flow_number:
        currentFlowIndex+1,
      flow_category:
        activeChallenge?.category||
        "none"
    }
  );

  if(
    activeChallenge?.metric===
      "shift"
  ){
    updateChallenge();
  }

  return true;
}

function noteRegularTrainContact(beacon){
  if(
    !beacon?.userData ||
    beacon.userData.isVoid ||
    beacon.userData.isGoldRing ||
    beacon.userData.isFlux ||
    beacon.userData.isChrono ||
    beacon.userData.isMidas ||
    beacon.userData.isWarp
  ){
    return;
  }

  const laneKey=currentLaneKey();
  const now=performance.now();
  const trainId=
    Number(beacon.userData.train);

  // If we departed a real train and have now connected with
  // a real train in another lane, this is the exact moment SHIFT earns credit.
  scoreTrainToTrainShift(
    laneKey,
    trainId
  );

  lastRegularTrainContact={
    laneKey,
    trainId,
    at:now
  };

  // The first train touched establishes the initial valid route anchor.
  if(!shiftLastArrivalLane){
    shiftLastArrivalLane=laneKey;
  }
}

function moveLane(dx,dy){
  if(!gameStarted||gameOver||paused)return;

  const oldLaneX=laneX;
  const oldLaneY=laneY;

  laneX=Math.max(0,Math.min(2,laneX+dx));
  laneY=Math.max(0,Math.min(2,laneY+dy));

  const changed=
    laneX!==oldLaneX ||
    laneY!==oldLaneY;

  if(changed){
    const fromLaneKey=
      laneKeyFromIndexes(
        oldLaneX,
        oldLaneY
      );

    const toLaneKey=
      laneKeyFromIndexes(
        laneX,
        laneY
      );

    beginTrainShiftIfConnected(
      fromLaneKey,
      toLaneKey
    );
  }

  environmentEngine.updatePlayerTarget();
  addWarpBank(dx,dy);

  const namesY=["UP","CENTER","DOWN"];
  const namesX=["LEFT","CENTER","RIGHT"];

  document.getElementById("laneLabel").textContent=
    namesY[laneY]+" "+namesX[laneX];

  if(navigator.vibrate&&changed)navigator.vibrate(10);
}

window.addEventListener("pointerup",e=>{

  if(e.target&&e.target.id==="center")return;
  if(paused)return;

  const rawDx = e.clientX - downX;
  const rawDy = e.clientY - downY;

  if (Math.hypot(rawDx, rawDy) < 20) return;

  const roadSwipe = environmentSwipe(rawDx,rawDy);
  const dx = roadSwipe.x;
  const dy = roadSwipe.y;

  const straightThreshold = 70;
  const diagonalThreshold = 45;

  let mx = 0;
  let my = 0;

  if (
      Math.abs(dx) > diagonalThreshold &&
      Math.abs(dy) > diagonalThreshold
  ){
      mx = dx > 0 ? 1 : -1;
      my = dy > 0 ? 1 : -1;
  }
  else if (Math.abs(dx) > Math.abs(dy)){

      if(dx > straightThreshold) mx = 1;
      if(dx < -straightThreshold) mx = -1;

  }
  else{

      if(dy > straightThreshold) my = 1;
      if(dy < -straightThreshold) my = -1;

  }

  if(mx !== 0 || my !== 0){
      moveLane(mx,my);
  }

});

function objectiveHudData(){
    if(!activeChallenge){
        return {
            label:"DISTANCE",
            value:`${Math.floor(distance).toLocaleString()}m`
        };
    }

    const target=Math.max(
        1,
        Math.floor(Number(activeChallenge.target)||1)
    );

    const raw=Math.max(
        0,
        challengeValue(activeChallenge)
    );

    const current=Math.min(
        target,
        Math.floor(raw)
    );

    if(activeChallenge.metric==="level"){
        return {
            label:"LEVEL",
            value:`${Math.min(level,target).toLocaleString()} / ${target.toLocaleString()}`
        };
    }

    if(activeChallenge.metric==="score"){
        return {
            label:"SCORE",
            value:`${current.toLocaleString()} / ${target.toLocaleString()}`
        };
    }

    if(activeChallenge.metric==="distance"){
        return {
            label:"DISTANCE",
            value:`${current.toLocaleString()}m / ${target.toLocaleString()}m`
        };
    }

    if(activeChallenge.metric==="rings"){
        return {
            label:"RINGS",
            value:`${current.toLocaleString()} / ${target.toLocaleString()}`
        };
    }

    if(activeChallenge.metric==="shift"){
        return {
            label:"SHIFT",
            value:`${current.toLocaleString()} / ${target.toLocaleString()}`
        };
    }

    if(activeChallenge.metric==="warp"){
        return {
            label:"WARP",
            value:`${current.toLocaleString()} / ${target.toLocaleString()}`
        };
    }

    if(activeChallenge.metric==="color"){
        return {
            label:`${activeChallenge.color} ORBS`,
            value:`${current.toLocaleString()} / ${target.toLocaleString()}`
        };
    }

    if(activeChallenge.metric==="orbs"){
        return {
            label:"ORBS",
            value:`${current.toLocaleString()} / ${target.toLocaleString()}`
        };
    }

    return {
        label:"PROGRESS",
        value:`${current.toLocaleString()} / ${target.toLocaleString()}`
    };
}

function formatRunFlowProgress(flow,value){

  const target=Math.floor(flow.target);

  if(flow.metric==="distance" || flow.metric==="drift"){
    return `${whole.toLocaleString()}m / ${target.toLocaleString()}m`;
  }

  if(flow.metric==="level"){
    return `${whole.toLocaleString()} / ${target.toLocaleString()}`;
  }

  return `${whole.toLocaleString()} / ${target.toLocaleString()}`;
}

    const edgeNorm = THREE.MathUtils.clamp((radius - 85) / 190, 0, 1);
    const lensStrength = lensPulse * curveEase * edgeNorm * edgeNorm * 0.018;
    const lensCenterX = vanishingX * 1.8;
    const lensCenterY = vanishingY * 1.5;
    x += (baseX - lensCenterX) * lensStrength;
    y += (baseY - lensCenterY) * lensStrength;

    // Slight counter-parallax gives close particles more steering response
    // while far stars hold the curved route.
    x += -bankYaw * 82 * nearLayer * 0.28;
    y +=  bankPitch * 58 * nearLayer * 0.24;

    // Distance from the center of the playfield
    const edge =
        Math.min(
            1,
            Math.hypot(baseX,baseY)/220
        );

    // Outer stars travel faster than center stars
    const edgeBoost =
        1 +
        edge *
        warpAmount *
        3.0;

    let z =
        pos.getZ(i)
        +
        speed *
        worldDt *
        speedMultiplier *
        edgeBoost;

    if(z>90){

        z =
            -1150 -
            Math.random()*250;

    }

    pos.setXYZ(
    i,
    x,
    y,
    z
);

let lastPadMove = 0;
let lastPadPausePressed = false;

function updateGamepad(){

    const pads = navigator.getGamepads
        ? navigator.getGamepads()
        : [];

    const pad = pads[0];

    if(!pad) return;

    const now = performance.now();

    // Prevent repeated movement every frame
    if(now - lastPadMove < 200) return;

    const deadZone = 0.70;

    const x = pad.axes[0];
    const y = pad.axes[1];

    let dx = 0;
    let dy = 0;

    if(x > deadZone) dx = 1;
    if(x < -deadZone) dx = -1;

    if(y > deadZone) dy = 1;
    if(y < -deadZone) dy = -1;

    if(pad.buttons[12]?.pressed) dy = -1; // Up
    if(pad.buttons[13]?.pressed) dy = 1;  // Down
    if(pad.buttons[14]?.pressed) dx = -1; // Left
    if(pad.buttons[15]?.pressed) dx = 1;  // Right

    if(dx || dy){

        moveLane(dx,dy);

        lastPadMove = now;

    }

    // Pause button — edge-triggered so holding it cannot toggle every frame.
    const pausePressed=Boolean(pad.buttons[9]?.pressed);
    if(pausePressed&&!lastPadPausePressed){
        togglePause("gamepad");
    }
    lastPadPausePressed=pausePressed;

}

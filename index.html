<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000000"><title>iGusta · Move your way</title><link rel="stylesheet" href="style.css"></head><body><main id="app" class="shell"><section id="home" class="screen"><header class="brand"><span class="person-i"><b></b><i></i></span><span>GUSTA</span></header><p class="tagline" id="tagline">MOVE YOUR WAY.</p><div class="modes"><button class="mode red" data-mode="dance">✦ <span>DANCE</span><span>›</span></button><button class="mode blue" data-mode="stretch">↗ <span>STRETCH</span><span>›</span></button><button class="mode green" data-mode="flow">〰 <span>FLOW</span><span>›</span></button><button class="mode yellow" data-mode="play">★ <span>PLAY</span><span>›</span></button></div><p class="footer-note">ONE WORD. YOUR MOVE.</p></section><section id="setup" class="screen hidden"><div class="topline"><button id="back" class="circle" aria-label="Back">←</button><span class="small-brand">iGUSTA</span></div><h1 id="modeTitle">DANCE</h1><div class="settings"><label class="setting"> <span id="durationLabel">Duration</span><select id="duration"><option value="30">30 seconds</option><option value="60">1 minute</option><option value="180">3 minutes</option></select></label><label class="setting"><span id="coachLabel">Coach</span><select id="coach"><option value="on">On</option><option value="off">Off</option></select></label><label class="setting"><span id="languageLabel">Language</span><select id="language"><option value="en">English</option><option value="es">Español</option></select></label><label class="setting"><span id="voiceLabel">Voice</span><select id="voice"><option value="auto">Auto</option><option value="female">Female voice</option><option value="male">Male voice</option></select></label><label class="setting"><span id="nameLabel">Coach name</span><input id="coachName" maxlength="25" placeholder="Name your coach" value="Ava"></label><label class="setting"><span id="aiLabel">Movement source</span><select id="source"><option value="local">Instant mix · offline</option><option value="ai">AI mix · online</option></select></label></div><button id="start" class="primary">START →</button><p id="setupStatus" class="status" role="status"></p></section><section id="round" class="screen hidden"><div class="topline"><span class="small-brand">iGUSTA</span><span id="roundMode">DANCE</span></div><div id="command" aria-live="assertive">READY!</div><div class="roundBottom"><div class="times"><span id="elapsed">0:00</span><span id="total">0:30</span></div><div class="track"><div id="progress"></div></div><div class="roundButtons"><button id="pause">PAUSE</button><button id="stop">END</button></div></div></section><section id="done" class="screen hidden"><span class="small-brand">iGUSTA</span><div class="doneCenter"><h1 id="doneTitle">NICE MOVES!</h1><p id="doneDetail">YOU DID IT.</p></div><button id="again" class="primary">PLAY AGAIN ↻</button><button id="homeBtn" class="secondary">HOME</button></section></main><script src="igusta.js" defer></script></body></html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#05070b"><title>AKI 4.3</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#05070b}body{overflow:hidden;font-family:system-ui,-apple-system,sans-serif}.presence{position:relative;width:100%;height:100dvh;overflow:hidden;isolation:isolate;background:radial-gradient(circle at 50% 47%,#111722 0,#080b11 42%,#030507 76%,#020304 100%);cursor:pointer;-webkit-tap-highlight-color:transparent}.ambient{position:absolute;inset:-18%;background:radial-gradient(circle at 50% 48%,rgba(20,82,145,.12) 0 18%,rgba(72,30,112,.08) 34%,rgba(8,10,16,.04) 54%,transparent 72%);filter:blur(42px);animation:ambient 10s ease-in-out infinite}.orb{position:absolute;left:50%;top:48%;width:min(88vw,700px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:#010207;box-shadow:0 0 22px rgba(93,218,255,.18),0 0 65px rgba(65,126,255,.18),0 0 118px rgba(150,53,255,.12);animation:orbBreath 7s ease-in-out infinite;transition:filter .55s ease,transform .55s ease}.halo,.rim,.oil,.oil2,.core{position:absolute;border-radius:50%;pointer-events:none}.halo{inset:-7%;background:conic-gradient(from 205deg,rgba(16,199,255,.0),rgba(26,195,255,.34),rgba(83,77,255,.34),rgba(216,65,255,.28),rgba(255,104,178,.22),rgba(255,159,93,.18),rgba(34,210,255,.22),rgba(16,199,255,0));filter:blur(28px);opacity:.72;animation:oilTurn 20s linear infinite}.rim{inset:-1.2%;background:conic-gradient(from 220deg,rgba(255,127,194,.95),rgba(161,70,255,.95),rgba(75,116,255,.98),rgba(79,231,255,1),rgba(225,247,255,.98),rgba(75,207,255,.95),rgba(110,73,255,.94),rgba(231,70,255,.94),rgba(255,149,103,.92),rgba(255,127,194,.95));filter:blur(3px) saturate(1.35);opacity:.94;animation:oilTurn 18s linear infinite}.rim:after{content:"";position:absolute;inset:1.7%;border-radius:50%;background:#010207;filter:blur(1px)}.oil{inset:1.2%;background:conic-gradient(from 18deg,transparent 0 4%,rgba(35,212,255,.92) 10%,rgba(56,113,255,.78) 19%,rgba(172,60,255,.88) 30%,rgba(255,65,189,.76) 39%,rgba(255,156,92,.70) 47%,transparent 55% 65%,rgba(22,207,255,.88) 74%,rgba(100,73,255,.82) 84%,rgba(228,75,255,.70) 91%,transparent 98%);filter:blur(10px) saturate(1.55);opacity:.96;animation:oilTurn 15s linear infinite}.oil:after{content:"";position:absolute;inset:8%;border-radius:50%;background:#010207;filter:blur(6px)}.oil2{inset:4%;background:conic-gradient(from 160deg,transparent 0 10%,rgba(255,83,190,.58) 19%,rgba(115,65,255,.72) 31%,rgba(30,204,255,.76) 43%,transparent 55% 70%,rgba(255,135,82,.48) 80%,rgba(130,64,255,.60) 91%,transparent);filter:blur(18px) saturate(1.45);opacity:.74;animation:oilTurn2 22s linear infinite}.oil2:after{content:"";position:absolute;inset:13%;border-radius:50%;background:#010207;filter:blur(9px)}.core{inset:12%;background:radial-gradient(circle at 44% 38%,rgba(9,24,44,.30),rgba(1,2,7,.98) 47%,#000106 76%);box-shadow:inset 0 0 80px rgba(46,112,190,.10)}.mark{position:absolute;z-index:5;left:50%;top:48%;transform:translate(-50%,-50%);width:min(48vw,360px);height:auto;opacity:.95;filter:drop-shadow(0 0 5px rgba(154,216,255,.28));transition:opacity .55s ease,transform .55s ease}.mark path{fill:none;stroke:rgba(238,245,255,.96);stroke-width:1.05;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}.listening .orb{filter:saturate(1.12);animation-duration:5.2s}.thinking .orb{filter:saturate(1.55) brightness(1.10);animation-duration:2.55s}.thinking .halo{opacity:1;animation-duration:5.5s}.thinking .rim{animation-duration:5.2s}.thinking .oil{animation-duration:4.8s;opacity:1}.thinking .oil2{animation-duration:6.8s;opacity:.9}.thinking .mark{opacity:.72;transform:translate(-50%,-50%) scale(.985)}.speaking .orb{filter:saturate(1.38) brightness(1.08);animation-duration:2.15s}.speaking .mark{opacity:1;transform:translate(-50%,-50%) scale(1.015)}.error .mark{opacity:.3}@keyframes ambient{0%,100%{transform:scale(.96);opacity:.55}50%{transform:scale(1.06);opacity:.9}}@keyframes orbBreath{0%,100%{transform:translate(-50%,-50%) scale(.955)}50%{transform:translate(-50%,-50%) scale(1.025)}}@keyframes oilTurn{to{transform:rotate(360deg)}}@keyframes oilTurn2{to{transform:rotate(-360deg)}}@media(max-width:600px){.orb{width:88vw}.mark{width:47vw}}@media(prefers-reduced-motion:reduce){.ambient,.orb,.halo,.rim,.oil,.oil2{animation:none!important}}
</style></head><body>
<main id="app" class="presence" aria-label="AKI. Tap once to allow microphone access, then say Aki."><div class="ambient"></div><div class="orb"><div class="halo"></div><div class="rim"></div><div class="oil"></div><div class="oil2"></div><div class="core"></div></div><svg class="mark" viewBox="0 0 300 90" aria-label="AKI"><path d="M18 72 L48 18 L78 72 M98 18 L98 72 M99 48 L145 18 M99 48 L147 72 M174 18 L174 72"/></svg></main>
<script>
const app=document.querySelector('#app');let pc=null,dc=null,micStream=null,audioEl=null,starting=false,transcript='',thinkTimer=null,audioCtx=null,lastChime=0;let akiVoice=localStorage.getItem('akiVoice')||'marin',akiLanguage=localStorage.getItem('akiLanguage')||'English',restarting=false;
function state(name){app.classList.remove('listening','thinking','speaking');if(name)app.classList.add(name)}
function thinkingChime(){const now=Date.now();if(now-lastChime<1800)return;lastChime=now;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();const t=audioCtx.currentTime;[523.25,783.99].forEach((f,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,t+i*.055);g.gain.linearRampToValueAtTime(.035,t+.025+i*.055);g.gain.exponentialRampToValueAtTime(.0001,t+.34+i*.055);o.connect(g);g.connect(audioCtx.destination);o.start(t+i*.055);o.stop(t+.38+i*.055)})}catch{}}
function setThinking(){if(!app.classList.contains('speaking')){state('thinking');thinkingChime()}}
function detectPreference(text){
 const t=(text||'').toLowerCase();
 let voice=null,language=null;
 if(/\b(man|male|masculine|guy|hombre|man's voice|male voice)\b/.test(t)) voice='cedar';
 if(/\b(woman|female|feminine|woman's voice|female voice)\b/.test(t)) voice='marin';
 if(/\b(lower female|deeper female|low female|androgynous|gender neutral)\b/.test(t)) voice='willow';
 if(/\b(spanish|español|espanol)\b/.test(t)) language='Spanish';
 if(/\b(english|inglés|ingles)\b/.test(t)) language='English';
 return {voice,language};
}
async function applyPreference(text){
 const p=detectPreference(text); let changed=false;
 if(p.voice&&p.voice!==akiVoice){akiVoice=p.voice;localStorage.setItem('akiVoice',akiVoice);changed=true}
 if(p.language&&p.language!==akiLanguage){akiLanguage=p.language;localStorage.setItem('akiLanguage',akiLanguage);changed=true}
 if(changed&&!restarting){restarting=true;state('thinking');thinkingChime();setTimeout(async()=>{await stopAki();restarting=false;startAki()},420)}
}
async function stopAki(){clearTimeout(thinkTimer);try{dc?.close()}catch{}try{pc?.close()}catch{}try{micStream?.getTracks().forEach(t=>t.stop())}catch{}pc=dc=micStream=null;if(audioEl){audioEl.srcObject=null;audioEl.remove();audioEl=null}app.classList.remove('listening','thinking','speaking','error')}
async function startAki(){if(pc||starting)return;starting=true;app.classList.remove('error');try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')await audioCtx.resume();micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});pc=new RTCPeerConnection();audioEl=document.createElement('audio');audioEl.autoplay=true;audioEl.playsInline=true;document.body.appendChild(audioEl);pc.ontrack=e=>{audioEl.srcObject=e.streams[0];audioEl.play().catch(()=>{})};micStream.getTracks().forEach(t=>pc.addTrack(t,micStream));dc=pc.createDataChannel('oai-events');dc.addEventListener('open',()=>console.log('AKI 4.3 connected'));dc.addEventListener('message',e=>{try{const m=JSON.parse(e.data),type=m.type||'',nested=m.event?.type||'';if(type==='session.started')state('listening');if(type==='input_transcript.delta'){transcript+=(m.delta||'');state('listening');clearTimeout(thinkTimer);thinkTimer=setTimeout(()=>{const heard=transcript;setThinking();transcript='';applyPreference(heard)},300)}if(type.includes('delegation.created')||nested.includes('response.created')||nested.includes('response.in_progress'))setThinking();if(type==='output_audio.delta'||type==='output_transcript.delta'||nested.includes('output_audio.delta')||nested.includes('output_text.delta'))state('speaking');if(type==='session.closed'||type==='output_audio.done'||nested.includes('response.completed')||nested.includes('response.done'))state('listening');if(type==='error')console.error('AKI Live event error:',m)}catch{}});pc.addEventListener('connectionstatechange',()=>{if(['failed','closed','disconnected'].includes(pc?.connectionState))app.classList.remove('listening','thinking','speaking')});const offer=await pc.createOffer();await pc.setLocalDescription(offer);const localSdp=pc.localDescription?.sdp||offer.sdp;if(!localSdp||!localSdp.trim().startsWith('v=0'))throw new Error('Browser did not create a valid SDP offer');const r=await fetch('/api/aki',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sdp:localSdp,voice:akiVoice,language:akiLanguage})});const answer=await r.text();if(!r.ok)throw new Error(answer);await pc.setRemoteDescription({type:'answer',sdp:answer})}catch(err){console.error('AKI 4.3 start error:',err);await stopAki();app.classList.add('error')}finally{starting=false}}
app.addEventListener('click',()=>{if(!pc)startAki()});window.addEventListener('beforeunload',stopAki);
</script></body></html>

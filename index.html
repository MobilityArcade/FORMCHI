<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08090b"><title>AKI 4.0</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#08090b}body{overflow:hidden;font-family:system-ui,-apple-system,sans-serif}.presence{position:relative;width:100%;height:100dvh;overflow:hidden;isolation:isolate;background:radial-gradient(circle at 50% 48%,#171a20 0,#0c0e12 52%,#050608 100%);cursor:pointer;-webkit-tap-highlight-color:transparent}.ambient{position:absolute;inset:-15%;background:radial-gradient(circle at 50% 48%,rgba(75,101,140,.16),rgba(16,18,24,.2) 46%,transparent 72%);filter:blur(30px);animation:ambient 10s ease-in-out infinite}.orb{position:absolute;left:50%;top:48%;width:min(82vw,660px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:#020306;box-shadow:0 0 60px rgba(70,150,255,.16),0 0 130px rgba(165,70,255,.12);animation:orbBreath 7s ease-in-out infinite;transition:filter .7s ease,transform .7s ease}.oil,.oil2,.core{position:absolute;border-radius:50%;pointer-events:none}.oil{inset:-2%;background:conic-gradient(from 20deg,transparent 0 7%,rgba(33,202,255,.92) 13%,rgba(74,105,255,.72) 21%,rgba(185,66,255,.76) 31%,rgba(255,82,177,.66) 42%,rgba(255,167,89,.52) 49%,transparent 57% 68%,rgba(24,195,255,.72) 76%,rgba(145,72,255,.72) 88%,transparent 97%);filter:blur(14px) saturate(1.45);opacity:.86;animation:oilTurn 16s linear infinite}.oil:after{content:"";position:absolute;inset:7%;border-radius:50%;background:#020306;filter:blur(5px)}.oil2{inset:4%;background:conic-gradient(from 160deg,transparent 0 14%,rgba(255,74,184,.48) 22%,rgba(119,64,255,.66) 33%,rgba(31,195,255,.68) 46%,transparent 56% 73%,rgba(255,132,78,.42) 81%,rgba(118,69,255,.52) 91%,transparent);filter:blur(22px);opacity:.64;animation:oilTurn2 21s linear infinite}.oil2:after{content:"";position:absolute;inset:11%;border-radius:50%;background:#020306;filter:blur(7px)}.core{inset:11%;background:radial-gradient(circle at 43% 38%,rgba(15,28,48,.36),rgba(2,3,6,.96) 50%,#010204 76%);box-shadow:inset 0 0 55px rgba(65,114,190,.12)}.mark{position:absolute;z-index:5;left:50%;top:48%;transform:translate(-50%,-50%);width:min(46vw,350px);height:auto;opacity:.78;filter:drop-shadow(0 1px 1px rgba(255,255,255,.25)) drop-shadow(0 -1px 2px rgba(0,0,0,.9));transition:opacity .7s ease,transform .7s ease}.mark path{fill:none;stroke:rgba(226,232,240,.78);stroke-width:1.15;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}.listening .orb{filter:saturate(1.18);animation-duration:5.4s}.thinking .orb{filter:saturate(1.55) brightness(1.12);animation-duration:2.7s}.thinking .oil{animation-duration:6s;opacity:1}.thinking .oil2{animation-duration:8s;opacity:.82}.thinking .mark{opacity:.55;transform:translate(-50%,-50%) scale(.985)}.speaking .orb{filter:saturate(1.38) brightness(1.08);animation-duration:2.2s}.speaking .mark{opacity:.9;transform:translate(-50%,-50%) scale(1.02)}.error .mark{opacity:.3}@keyframes ambient{0%,100%{transform:scale(.95);opacity:.65}50%{transform:scale(1.08);opacity:1}}@keyframes orbBreath{0%,100%{transform:translate(-50%,-50%) scale(.94)}50%{transform:translate(-50%,-50%) scale(1.035)}}@keyframes oilTurn{to{transform:rotate(360deg)}}@keyframes oilTurn2{to{transform:rotate(-360deg)}}@media(prefers-reduced-motion:reduce){.ambient,.orb,.oil,.oil2{animation:none!important}}
</style></head><body>
<main id="app" class="presence" aria-label="AKI. Tap once to allow microphone access, then say Aki."><div class="ambient"></div><div class="orb"><div class="oil"></div><div class="oil2"></div><div class="core"></div></div><svg class="mark" viewBox="0 0 300 90" aria-label="AKI"><path d="M18 72 L48 18 L78 72 M98 18 L98 72 M99 48 L145 18 M99 48 L147 72 M174 18 L174 72"/></svg></main>
<script>
const app=document.querySelector('#app');let pc=null,dc=null,micStream=null,audioEl=null,starting=false,transcript='',thinkTimer=null,audioCtx=null,lastChime=0;
function state(name){app.classList.remove('listening','thinking','speaking');if(name)app.classList.add(name)}
function thinkingChime(){const now=Date.now();if(now-lastChime<1800)return;lastChime=now;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();const t=audioCtx.currentTime;[523.25,783.99].forEach((f,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,t+i*.055);g.gain.linearRampToValueAtTime(.035,t+.025+i*.055);g.gain.exponentialRampToValueAtTime(.0001,t+.34+i*.055);o.connect(g);g.connect(audioCtx.destination);o.start(t+i*.055);o.stop(t+.38+i*.055)})}catch{}}
function setThinking(){if(!app.classList.contains('speaking')){state('thinking');thinkingChime()}}
async function stopAki(){clearTimeout(thinkTimer);try{dc?.close()}catch{}try{pc?.close()}catch{}try{micStream?.getTracks().forEach(t=>t.stop())}catch{}pc=dc=micStream=null;if(audioEl){audioEl.srcObject=null;audioEl.remove();audioEl=null}app.classList.remove('listening','thinking','speaking','error')}
async function startAki(){if(pc||starting)return;starting=true;app.classList.remove('error');try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')await audioCtx.resume();micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});pc=new RTCPeerConnection();audioEl=document.createElement('audio');audioEl.autoplay=true;audioEl.playsInline=true;document.body.appendChild(audioEl);pc.ontrack=e=>{audioEl.srcObject=e.streams[0];audioEl.play().catch(()=>{})};micStream.getTracks().forEach(t=>pc.addTrack(t,micStream));dc=pc.createDataChannel('oai-events');dc.addEventListener('open',()=>console.log('AKI 4.0 connected'));dc.addEventListener('message',e=>{try{const m=JSON.parse(e.data),type=m.type||'',nested=m.event?.type||'';if(type==='session.started')state('listening');if(type==='input_transcript.delta'){transcript+=(m.delta||'');state('listening');clearTimeout(thinkTimer);thinkTimer=setTimeout(()=>{setThinking();transcript=''},300)}if(type.includes('delegation.created')||nested.includes('response.created')||nested.includes('response.in_progress'))setThinking();if(type==='output_audio.delta'||type==='output_transcript.delta'||nested.includes('output_audio.delta')||nested.includes('output_text.delta'))state('speaking');if(type==='session.closed'||type==='output_audio.done'||nested.includes('response.completed')||nested.includes('response.done'))state('listening');if(type==='error')console.error('AKI Live event error:',m)}catch{}});pc.addEventListener('connectionstatechange',()=>{if(['failed','closed','disconnected'].includes(pc?.connectionState))app.classList.remove('listening','thinking','speaking')});const offer=await pc.createOffer();await pc.setLocalDescription(offer);const localSdp=pc.localDescription?.sdp||offer.sdp;if(!localSdp||!localSdp.trim().startsWith('v=0'))throw new Error('Browser did not create a valid SDP offer');const r=await fetch('/api/aki',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sdp:localSdp})});const answer=await r.text();if(!r.ok)throw new Error(answer);await pc.setRemoteDescription({type:'answer',sdp:answer})}catch(err){console.error('AKI 4.0 start error:',err);await stopAki();app.classList.add('error')}finally{starting=false}}
app.addEventListener('click',()=>{if(!pc)startAki()});window.addEventListener('beforeunload',stopAki);
</script></body></html>

<html lang="en">

<title>AKI 5.2.1 Syntax Repair</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#020304}
body{overflow:hidden;font-family:system-ui,-apple-system,sans-serif}
.presence{position:relative;width:100%;height:100dvh;overflow:hidden;isolation:isolate;background:radial-gradient(circle at 50% 47%,#0e1420 0,#070a10 42%,#030507 76%,#020304 100%);cursor:default;-webkit-tap-highlight-color:transparent}
.ambient{position:absolute;inset:-18%;background:radial-gradient(circle at 50% 48%,rgba(20,82,145,.10) 0 18%,rgba(72,30,112,.07) 34%,rgba(8,10,16,.03) 54%,transparent 72%);filter:blur(48px);animation:ambient 14s ease-in-out infinite}
.orb{position:absolute;left:50%;top:48%;width:min(88vw,700px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:#010207;box-shadow:0 0 24px rgba(93,218,255,.14),0 0 70px rgba(65,126,255,.15),0 0 124px rgba(150,53,255,.10);animation:orbBreath 8.4s ease-in-out infinite;transition:filter .9s ease,transform .9s ease}
.halo,.rim,.oil,.oil2,.core{position:absolute;border-radius:50%;pointer-events:none}
.halo{inset:-7%;background:conic-gradient(from 205deg,rgba(16,199,255,0),rgba(26,195,255,.34),rgba(83,77,255,.34),rgba(216,65,255,.28),rgba(255,104,178,.22),rgba(255,159,93,.18),rgba(34,210,255,.22),rgba(16,199,255,0));filter:blur(30px);opacity:.68;animation:oilTurn 34s linear infinite}
.rim{inset:-1.2%;background:conic-gradient(from 220deg,rgba(255,127,194,.92),rgba(161,70,255,.94),rgba(75,116,255,.97),rgba(79,231,255,.98),rgba(225,247,255,.93),rgba(75,207,255,.94),rgba(110,73,255,.92),rgba(231,70,255,.92),rgba(255,149,103,.88),rgba(255,127,194,.92));filter:blur(3.8px) saturate(1.28);opacity:.91;animation:oilTurn 31s linear infinite}
.rim:after{content:"";position:absolute;inset:1.9%;border-radius:50%;background:rgba(1,2,7,.93);filter:blur(3px)}
.oil{inset:1.2%;background:conic-gradient(from 18deg,transparent 0 4%,rgba(35,212,255,.88) 10%,rgba(56,113,255,.74) 19%,rgba(172,60,255,.84) 30%,rgba(255,65,189,.72) 39%,rgba(255,156,92,.66) 47%,transparent 55% 65%,rgba(22,207,255,.84) 74%,rgba(100,73,255,.78) 84%,rgba(228,75,255,.67) 91%,transparent 98%);filter:blur(12px) saturate(1.45);opacity:.92;animation:oilTurn 28s linear infinite}
.oil:after{content:"";position:absolute;inset:8.5%;border-radius:50%;background:rgba(1,2,7,.91);filter:blur(11px)}
.oil2{inset:4%;background:conic-gradient(from 160deg,transparent 0 10%,rgba(255,83,190,.52) 19%,rgba(115,65,255,.66) 31%,rgba(30,204,255,.70) 43%,transparent 55% 70%,rgba(255,135,82,.43) 80%,rgba(130,64,255,.54) 91%,transparent);filter:blur(20px) saturate(1.38);opacity:.68;animation:oilTurn2 38s linear infinite}
.oil2:after{content:"";position:absolute;inset:13.5%;border-radius:50%;background:rgba(1,2,7,.88);filter:blur(14px)}
/* 4.5: center is no longer a crisp black disk. Its edge feathers into the torus. */
.core{inset:11.5%;background:radial-gradient(circle at 44% 38%,rgba(9,24,44,.28) 0%,rgba(1,2,7,.985) 55%,rgba(1,2,7,.96) 78%,rgba(1,2,7,.82) 87%,rgba(1,2,7,.48) 94%,rgba(1,2,7,.12) 98%,transparent 100%);box-shadow:inset 0 0 88px rgba(46,112,190,.08);filter:blur(2.4px)}
.mark{position:absolute;z-index:8;left:50%;top:48%;transform:translate(-50%,-50%);width:min(48vw,360px);height:auto;opacity:.23;filter:blur(.32px) drop-shadow(0 0 4px rgba(154,216,255,.05));transition:opacity .55s ease,filter .55s ease;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.mark path{fill:none;stroke:rgba(222,231,241,.76);stroke-width:1.02;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.mark.on{opacity:.72;filter:blur(.28px) drop-shadow(0 0 7px rgba(154,216,255,.16))}
.mark.starting{opacity:.47}
.mark.error{opacity:.16}
/* AKI 4.7: constant presence. Conversation state never changes the torus. */
@keyframes ambient{0%,100%{transform:scale(.98);opacity:.58}50%{transform:scale(1.025);opacity:.78}}
@keyframes orbBreath{0%,100%{transform:translate(-50%,-50%) scale(.982)}50%{transform:translate(-50%,-50%) scale(1.012)}}
@keyframes oilTurn{to{transform:rotate(360deg)}}@keyframes oilTurn2{to{transform:rotate(-360deg)}}
@media(max-width:600px){.orb{width:88vw}.mark{width:47vw}}
@media(prefers-reduced-motion:reduce){.ambient,.orb,.halo,.rim,.oil,.oil2{animation:none!important}}
</style>

<style id="aki-icon-match">
/* 4.7 icon-match visual refinement */
.mark{
  border:0!important; outline:0!important; background:transparent!important;
  box-shadow:none!important; border-radius:50%!important;
  -webkit-tap-highlight-color:transparent!important;
}
.mark:focus,.mark:focus-visible,.mark:active{
  border:0!important; outline:0!important; background:transparent!important;
  box-shadow:none!important;
}
.mark.on{
  opacity:1!important;
  filter:drop-shadow(0 0 1px rgba(255,255,255,1))
         drop-shadow(0 0 4px rgba(190,235,255,.98))
         drop-shadow(0 0 10px rgba(55,190,255,.78))!important;
}
.mark.on path{
  stroke:#f8fdff!important; stroke-opacity:1!important;
  stroke-width:2.35!important; stroke-linecap:round!important; stroke-linejoin:round!important;
}
.rim,.oil,.oil2{
  filter:saturate(1.42) contrast(1.08) brightness(1.10)!important;
}
</style>

<style id="aki-vision-49">
/* AKI 5.1 Vision Repair — minimal responsive controls; no voice meter. */
.vision-layer{position:absolute;inset:0;z-index:20;display:none;background:#020304;overflow:hidden}.vision-layer.open{display:block}
#cameraVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#020304}.vision-shade{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.14),transparent 22%,transparent 72%,rgba(0,0,0,.44));pointer-events:none}
.vision-status{position:absolute;top:max(18px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);padding:8px 13px;border-radius:999px;background:rgba(4,6,9,.66);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font:500 12px/1 system-ui;color:rgba(255,255,255,.92);letter-spacing:.02em;display:flex;align-items:center;gap:7px}.vision-dot{width:7px;height:7px;border-radius:50%;background:#35df7a;box-shadow:0 0 9px rgba(53,223,122,.7)}
.vision-controls{position:absolute;left:50%;bottom:max(34px,calc(env(safe-area-inset-bottom) + 22px));transform:translateX(-50%);display:flex;align-items:center;gap:76px}
.vbtn,.launchbtn{position:relative;border:0;border-radius:50%;background:linear-gradient(#070a10,#070a10) padding-box,conic-gradient(from 215deg,#53efff,#217cff,#743cff,#f229d8,#ff756b,#53efff) border-box;border:2px solid transparent;color:#f8fdff;display:grid;place-items:center;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 0 12px rgba(52,190,255,.16),0 0 20px rgba(183,49,255,.10),inset 0 0 14px rgba(75,154,255,.05);text-shadow:0 0 7px rgba(190,235,255,.9);-webkit-tap-highlight-color:transparent}
.vbtn{width:66px;height:66px;font-size:28px}.vbtn.primary{width:72px;height:72px;box-shadow:0 0 16px rgba(52,190,255,.22),0 0 26px rgba(183,49,255,.14)}
.vision-launch{display:none!important}.launchbtn{width:68px;height:68px;font-size:27px}
.photo-stage{position:absolute;inset:0;z-index:21;display:none;background:#020304;padding:max(72px,calc(env(safe-area-inset-top) + 42px)) 22px max(34px,calc(env(safe-area-inset-bottom) + 24px));align-items:center;justify-content:center;flex-direction:column;gap:24px}.photo-stage.open{display:flex}.photo-stage img{max-width:min(88vw,760px);max-height:64vh;object-fit:contain;border-radius:22px;box-shadow:0 0 36px rgba(74,185,255,.10)}.photo-actions{display:flex;gap:54px}.busy-ring{position:absolute;inset:0;display:none;place-items:center;background:rgba(0,0,0,.28);font-size:13px;color:white}.busy .busy-ring{display:grid}#photoInput{display:none}
/* Portrait phones/tablets: controls live well below the torus, clearly left/right. */
@media (orientation:portrait){.vision-launch{left:50%;top:calc(48% + min(51vw,400px));transform:translate(-50%,30px);width:min(74vw,430px);justify-content:space-between}}
/* Landscape desktop/iPad: controls move to the sides of AKI instead of falling below the viewport. */
@media (orientation:landscape){.vision-launch{left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,1120px);justify-content:space-between;pointer-events:none}.vision-launch .launchbtn{pointer-events:auto}.launchbtn{width:72px;height:72px}.vision-controls{gap:110px}}
@media (max-height:520px) and (orientation:landscape){.vision-launch{width:94vw}.launchbtn{width:62px;height:62px}.vision-controls{bottom:18px}}
</style>
</head>
<body>
<main id="app" class="presence" aria-label="AKI">
  <div class="ambient"></div>
  <div class="orb"><div class="halo"></div><div class="rim"></div><div class="oil"></div><div class="oil2"></div><div class="core"></div></div>
  <svg id="akiButton" class="mark" viewBox="0 0 210 90" role="button" tabindex="0" aria-label="Turn AKI on" aria-pressed="false"><path d="M15 72 L45 18 L75 72 M95 18 L95 72 M96 48 L142 18 M96 48 L144 72 M172 18 L172 72"/></svg>
  <div id="visionLaunch" class="vision-launch" aria-label="Show AKI something">
    <button id="cameraBtn" class="launchbtn" aria-label="Open camera">⌾</button>
    <button id="photoBtn" class="launchbtn" aria-label="Choose photo">▧</button>
  </div>
  <section id="visionLayer" class="vision-layer" aria-label="AKI camera">
    <video id="cameraVideo" autoplay playsinline muted></video><div class="vision-shade"></div>
    <div class="vision-status"><span class="vision-dot"></span><span id="cameraLabel">Camera on</span></div>
    <div class="vision-controls">
      <button id="flipBtn" class="vbtn" aria-label="Flip camera">↻</button>
      <button id="closeCameraBtn" class="vbtn" aria-label="Close camera">×</button>
    </div>
  </section>
  <section id="photoStage" class="photo-stage" aria-label="Selected photo">
    <img id="photoPreview" alt="Selected photo"><div class="busy-ring">Looking…</div>
    <div class="photo-actions"><button id="addAnotherBtn" class="vbtn" aria-label="Add another photo">＋</button><button id="sendPhotoBtn" class="vbtn primary" aria-label="Send photo to AKI">↑</button><button id="closePhotoBtn" class="vbtn" aria-label="Close photo">×</button></div>
  </section>
  <input id="photoInput" type="file" accept="image/*" multiple>

</main>
<script>
const akiButton=document.querySelector('#akiButton');
let pc=null,dc=null,micStream=null,audioEl=null,audioCtx=null;
let starting=false,stopping=false,powered=false,restarting=false;
let transcript='',turnEndAt=0,responseStartAt=0,firstAudioAt=0,lastChime=0;
let latencyTimer=null,hardWatchdog=null,preferenceTimer=null;
let akiVoice=localStorage.getItem('akiVoice')||'marin';
let akiLanguage=localStorage.getItem('akiLanguage')||'auto';
let cameraStream=null,cameraFacing='environment',selectedImages=[];
const app=document.querySelector('#app'),visionLaunch=document.querySelector('#visionLaunch');
const visionLayer=document.querySelector('#visionLayer'),cameraVideo=document.querySelector('#cameraVideo'),cameraLabel=document.querySelector('#cameraLabel');
const photoInput=document.querySelector('#photoInput'),photoStage=document.querySelector('#photoStage'),photoPreview=document.querySelector('#photoPreview');


function powerLook(mode){
  akiButton.classList.remove('on','starting','error');
  if(mode==='on'){akiButton.classList.add('on');akiButton.setAttribute('aria-pressed','true');akiButton.setAttribute('aria-label','Turn AKI off')}
  else if(mode==='starting'){akiButton.classList.add('starting');akiButton.setAttribute('aria-pressed','false');akiButton.setAttribute('aria-label','AKI is starting')}
  else if(mode==='error'){akiButton.classList.add('error');akiButton.setAttribute('aria-pressed','false');akiButton.setAttribute('aria-label','AKI connection failed. Tap to retry')}
  else{akiButton.setAttribute('aria-pressed','false');akiButton.setAttribute('aria-label','Turn AKI on')}
}
function chime(){
  const now=Date.now();if(now-lastChime<1800)return;lastChime=now;
  try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();const t=audioCtx.currentTime;
    [523.25,783.99].forEach((f,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=f;
      g.gain.setValueAtTime(0,t+i*.055);g.gain.linearRampToValueAtTime(.022,t+.025+i*.055);g.gain.exponentialRampToValueAtTime(.0001,t+.32+i*.055);
      o.connect(g);g.connect(audioCtx.destination);o.start(t+i*.055);o.stop(t+.36+i*.055)})}catch{}
}
function latency(label,extra={}){console.log('[AKI 4.7 latency]',label,{at:new Date().toISOString(),...extra})}
function turnEnded(){
  turnEndAt=performance.now();responseStartAt=firstAudioAt=0;
  latency('user-turn-ended');chime();
  clearTimeout(latencyTimer);clearTimeout(hardWatchdog);
  latencyTimer=setTimeout(()=>{
    if(powered&&!firstAudioAt)latency('slow-response-warning',{waiting_ms:Math.round(performance.now()-turnEndAt)})
  },3000);
  // 4.7 hard escape: never leave a dead Live session hanging indefinitely.
  // This does not fake an answer. It cleanly reconnects AKI if no output audio
  // has begun 15 seconds after a recognized end-of-turn.
  hardWatchdog=setTimeout(async()=>{
    if(powered&&!firstAudioAt&&!restarting){
      latency('15-second-recovery',{waiting_ms:Math.round(performance.now()-turnEndAt)});
      restarting=true;chime();
      await stopAki(true);
      await new Promise(r=>setTimeout(r,220));
      restarting=false;
      await startAki();
    }
  },15000);
}
function responseStarted(){if(responseStartAt)return;responseStartAt=performance.now();latency('response-started',{from_turn_end_ms:turnEndAt?Math.round(responseStartAt-turnEndAt):null})}
function firstAudio(){if(firstAudioAt)return;firstAudioAt=performance.now();clearTimeout(latencyTimer);clearTimeout(hardWatchdog);latency('first-audio',{from_turn_end_ms:turnEndAt?Math.round(firstAudioAt-turnEndAt):null,from_response_start_ms:responseStartAt?Math.round(firstAudioAt-responseStartAt):null})}

function voiceRequest(text){
 const t=(text||'').toLowerCase();let voice=null;
 if(/\b(man|male|man's voice|male voice|a man|hombre|voz masculina|uomo|voce maschile|мужской голос|мужчина)\b/.test(t))voice='ash';
 if(/\b(woman|female|woman's voice|female voice|a woman|mujer|voz femenina|donna|voce femminile|женский голос|женщина)\b/.test(t))voice='marin';
 if(/\b(other voice|different voice|another voice|alternate voice)\b/.test(t))voice=(akiVoice==='cedar'?'ash':'cedar');
 return voice;
}
async function maybeSwitchVoice(text){
 const v=voiceRequest(text);if(!v||v===akiVoice||restarting)return;
 akiVoice=v;localStorage.setItem('akiVoice',v);restarting=true;chime();
 await stopAki(true);await new Promise(r=>setTimeout(r,220));restarting=false;await startAki();
}
function absorbTranscript(m){
 const type=m.type||'',nested=m.event?.type||'';
 const d=(typeof m.delta==='string'&&/transcript/i.test(type)?m.delta:'')||(typeof m.transcript==='string'&&/transcript/i.test(type)?m.transcript:'')||(typeof m.event?.delta==='string'&&/transcript/i.test(nested)?m.event.delta:'');
 if(d){transcript+=d;clearTimeout(preferenceTimer);preferenceTimer=setTimeout(()=>{const h=transcript;transcript='';maybeSwitchVoice(h);visionIntent(h)},350)}
}


function sendLiveText(text){
 if(!dc||dc.readyState!=='open')return false;
 try{
  dc.send(JSON.stringify({type:'response.item.create',item:{type:'message',role:'user',content:[{type:'input_text',text}]}}));
  dc.send(JSON.stringify({type:'response.create'}));return true;
 }catch(e){console.error('AKI text handoff:',e);return false}
}
function imageToDataURL(file,max=1280,quality=.82){return new Promise((resolve,reject)=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{const scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);resolve(c.toDataURL('image/jpeg',quality))};img.onerror=reject;img.src=u})}

// AKI 5.1: images go directly into the SAME Live conversation as voice.
// Current Live uses response.item.create for delegated Responses input, then response.create.
function sendLiveImages(images, instruction){
 if(!dc||dc.readyState!=='open')return false;
 try{
  // If VAD already started an answer to “what do you see?”, stop that stale answer
  // before giving AKI the image it needs.
  
  const content=[{type:'input_text',text:instruction||'Look at the image I am intentionally showing you and respond naturally to my question. Only describe what is actually visible.'}];
  for(const image_url of images){content.push({type:'input_image',image_url})}
  dc.send(JSON.stringify({type:'response.item.create',item:{type:'message',role:'user',content}}));
  dc.send(JSON.stringify({type:'response.create'}));
  console.log('[AKI 5.2 vision] image-sent-to-live',{count:images.length});
  return true;
 }catch(e){console.error('[AKI 5.2 vision] live-image-send-failed',e);return false}
}
async function handVisionToAki(images,context){
 if(!powered){await startAki();for(let i=0;i<30 && (!dc||dc.readyState!=='open');i++)await new Promise(r=>setTimeout(r,100))}
 if(!sendLiveImages(images,context))throw new Error('Live conversation is not ready for image input');
}
async function waitForCameraReady(){
 if(cameraVideo.readyState>=2 && cameraVideo.videoWidth)return;
 await new Promise(resolve=>{const done=()=>{cameraVideo.removeEventListener('loadeddata',done);cameraVideo.removeEventListener('canplay',done);resolve()};cameraVideo.addEventListener('loadeddata',done,{once:true});cameraVideo.addEventListener('canplay',done,{once:true});setTimeout(done,1200)});
}
async function openCamera(autoLook=false){
 try{
  await closeCamera(false);
  cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:cameraFacing}},audio:false});
  cameraVideo.srcObject=cameraStream;visionLayer.classList.add('open');cameraLabel.textContent=cameraFacing==='user'?'Front camera':'Rear camera';
  await cameraVideo.play().catch(()=>{});await waitForCameraReady();
  if(autoLook){await new Promise(r=>setTimeout(r,280));await lookNow()}
 }catch(e){console.error('AKI camera:',e);alert('Camera permission is needed to show AKI what you see.')}
}
async function closeCamera(showLaunch=true){try{cameraStream?.getTracks().forEach(t=>t.stop())}catch{}cameraStream=null;cameraVideo.srcObject=null;visionLayer.classList.remove('open');}
async function flipCamera(){cameraFacing=cameraFacing==='environment'?'user':'environment';await openCamera(false)}
function cameraFrame(){const c=document.createElement('canvas'),w=cameraVideo.videoWidth||720,h=cameraVideo.videoHeight||1280,scale=Math.min(1,1280/Math.max(w,h));c.width=Math.max(1,Math.round(w*scale));c.height=Math.max(1,Math.round(h*scale));c.getContext('2d').drawImage(cameraVideo,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.82)}
let visionBusy=false;
async function lookNow(){if(visionBusy||!cameraStream)return;visionBusy=true;try{await waitForCameraReady();const frame=cameraFrame();await handVisionToAki([frame],'This is the current camera frame I am intentionally showing you. Answer my immediately preceding spoken question using this image. If I asked what you see, briefly tell me what is visible. Do not claim to see anything outside this frame.');}catch(e){console.error('AKI camera vision:',e);alert('AKI could not look at that view.')}finally{visionBusy=false}}
async function choosePhotos(){photoInput.click()}
photoInput.addEventListener('change',async()=>{const fs=[...photoInput.files].slice(0,2);if(!fs.length)return;selectedImages=await Promise.all(fs.map(f=>imageToDataURL(f)));photoPreview.src=selectedImages[0];photoStage.classList.add('open')});
async function sendPhotos(){if(!selectedImages.length||visionBusy)return;visionBusy=true;photoStage.classList.add('busy');try{await handVisionToAki(selectedImages,selectedImages.length>1?'I am intentionally sharing these two photos with you in our Live conversation. Acknowledge that you can see them and respond naturally using only visible details. Keep them in conversational context for my follow-up questions.':'I am intentionally sharing this photo with you in our Live conversation. Acknowledge that you can see it and respond naturally using visible details. Keep it in conversational context for my follow-up questions.');photoStage.classList.remove('open');selectedImages=[];photoInput.value='';}catch(e){console.error('AKI photo vision:',e);alert('AKI could not read that photo.')}finally{visionBusy=false;photoStage.classList.remove('busy')}}
function closePhoto(){photoStage.classList.remove('open');selectedImages=[];photoInput.value='';}
document.querySelector('#cameraBtn').onclick=()=>openCamera(false);document.querySelector('#photoBtn').onclick=choosePhotos;document.querySelector('#flipBtn').onclick=flipCamera;document.querySelector('#closeCameraBtn').onclick=()=>closeCamera();document.querySelector('#sendPhotoBtn').onclick=sendPhotos;document.querySelector('#addAnotherBtn').onclick=choosePhotos;document.querySelector('#closePhotoBtn').onclick=closePhoto;

async function visionIntent(text){
 const t=(text||'').toLowerCase();
 const photoWords=/(photo|picture|image|photos|pictures|photo library)/.test(t);
 const cameraOpen=!!cameraStream && visionLayer.classList.contains('open');
 const lookWords=/(what do you see|what can you see|can you see|did you see|look now|take a look|look at this|see this|what am i showing|what is this)/.test(t);
 if(cameraOpen && lookWords){await lookNow();return}
 if(/(show you|look at|camera|turn on the camera|open the camera|see this|look at me|take a look|send you)/.test(t)){
   if(photoWords){choosePhotos();return}
   if(/(front|selfie|look at me)/.test(t))cameraFacing='user';
   await openCamera(false);
 }
}

async function stopAki(keepLook=false){
 if(stopping)return;stopping=true;powered=false;clearTimeout(latencyTimer);clearTimeout(hardWatchdog);clearTimeout(preferenceTimer);await closeCamera(false);closePhoto();
 try{dc?.close()}catch{} try{pc?.getSenders?.().forEach(x=>x.track?.stop())}catch{} try{pc?.close()}catch{}
 try{micStream?.getTracks().forEach(t=>{t.enabled=false;t.stop()})}catch{}
 if(audioEl){try{audioEl.pause()}catch{}audioEl.srcObject=null;audioEl.remove();audioEl=null}
 pc=dc=micStream=null;transcript='';if(!keepLook)powerLook('off');stopping=false;
}
async function startAki(){
 if(powered||starting||stopping)return;starting=true;powerLook('starting');
 try{
  audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')await audioCtx.resume();
  micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
  pc=new RTCPeerConnection();audioEl=document.createElement('audio');audioEl.autoplay=true;audioEl.playsInline=true;document.body.appendChild(audioEl);
  pc.ontrack=e=>{audioEl.srcObject=e.streams[0];audioEl.play().catch(()=>{})};micStream.getTracks().forEach(t=>pc.addTrack(t,micStream));
  dc=pc.createDataChannel('oai-events');dc.addEventListener('open',()=>latency('data-channel-open',{voice:akiVoice}));
  dc.addEventListener('message',e=>{try{const m=JSON.parse(e.data),type=m.type||'',nested=m.event?.type||'',all=(type+' '+nested).toLowerCase();
    if(type==='session.started'){powered=true;powerLook('on');latency('session-started',{voice:m.session?.audio?.output?.voice||m.session?.voice||akiVoice})}
    absorbTranscript(m);
    if(all.includes('speech_stopped')||all.includes('input_audio_buffer.committed')||all.includes('turn.ended'))turnEnded();
    if(all.includes('response.created')||all.includes('response.in_progress')||all.includes('delegation.created'))responseStarted();
    if(all.includes('output_audio.delta')||all.includes('audio.delta'))firstAudio();
    if(type==='error')console.error('AKI Live event error:',JSON.stringify(m,null,2))
  }catch{}});
  pc.addEventListener('connectionstatechange',()=>{const cs=pc?.connectionState;latency('connection-state',{state:cs});if(['failed','closed'].includes(cs)&&powered&&!restarting)stopAki()});
  const offer=await pc.createOffer();await pc.setLocalDescription(offer);const localSdp=pc.localDescription?.sdp||offer.sdp;
  if(!localSdp||!localSdp.trim().startsWith('v=0'))throw new Error('Browser did not create a valid SDP offer');
  const r=await fetch('/api/aki',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sdp:localSdp,voice:akiVoice,language:akiLanguage})});
  const answer=await r.text();if(!r.ok)throw new Error(answer);await pc.setRemoteDescription({type:'answer',sdp:answer});
  powered=true;powerLook('on');
 }catch(err){console.error('AKI 4.8 start error:',err);await stopAki();powerLook('error')}finally{starting=false}
}
async function toggle(){if(starting||stopping)return;if(powered||pc||micStream)await stopAki();else await startAki()}
akiButton.addEventListener('click',e=>{e.stopPropagation();toggle()});
akiButton.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle()}});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&pc&&['failed','closed'].includes(pc.connectionState))stopAki()});
window.addEventListener('pagehide',()=>stopAki());
powerLook('off');
</script>

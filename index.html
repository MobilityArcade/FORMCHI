<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020304">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AKI">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=45">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=45">
<link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png?v=45">
<title>AKI 4.5</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#020304}
body{overflow:hidden;font-family:system-ui,-apple-system,sans-serif}
.presence{position:relative;width:100%;height:100dvh;overflow:hidden;isolation:isolate;background:radial-gradient(circle at 50% 47%,#0e1420 0,#070a10 42%,#030507 76%,#020304 100%);cursor:pointer;-webkit-tap-highlight-color:transparent}
.ambient{position:absolute;inset:-18%;background:radial-gradient(circle at 50% 48%,rgba(20,82,145,.10) 0 18%,rgba(72,30,112,.07) 34%,rgba(8,10,16,.03) 54%,transparent 72%);filter:blur(48px);animation:ambient 14s ease-in-out infinite}
.orb{position:absolute;left:50%;top:48%;width:min(88vw,700px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:#010207;box-shadow:0 0 24px rgba(93,218,255,.14),0 0 70px rgba(65,126,255,.15),0 0 124px rgba(150,53,255,.10);animation:orbBreath 8.4s ease-in-out infinite;transition:filter .9s ease,transform .9s ease}
.halo,.rim,.oil,.oil2,.core{position:absolute;border-radius:50%;pointer-events:none}
.halo{inset:-7%;background:conic-gradient(from 205deg,rgba(16,199,255,0),rgba(26,195,255,.34),rgba(83,77,255,.34),rgba(216,65,255,.28),rgba(255,104,178,.22),rgba(255,159,93,.18),rgba(34,210,255,.22),rgba(16,199,255,0));filter:blur(30px);opacity:.68;animation:oilTurn 34s linear infinite}
.rim{inset:-1.2%;background:conic-gradient(from 220deg,rgba(255,127,194,.92),rgba(161,70,255,.94),rgba(75,116,255,.97),rgba(79,231,255,.98),rgba(225,247,255,.93),rgba(75,207,255,.94),rgba(110,73,255,.92),rgba(231,70,255,.92),rgba(255,149,103,.88),rgba(255,127,194,.92));filter:blur(3.8px) saturate(1.28);opacity:.91;animation:oilTurn 31s linear infinite}
.rim:after{content:"";position:absolute;inset:1.9%;border-radius:50%;background:rgba(1,2,7,.93);filter:blur(3px)}
.oil{inset:1.2%;background:conic-gradient(from 18deg,transparent 0 4%,rgba(35,212,255,.88) 10%,rgba(56,113,255,.74) 19%,rgba(172,60,255,.84) 30%,rgba(255,65,189,.72) 39%,rgba(255,156,92,.66) 47%,transparent 55% 65%,rgba(22,207,255,.84) 74%,rgba(100,73,255,.78) 84%,rgba(228,75,255,.67) 91%,transparent 98%);filter:blur(12px) saturate(1.45);opacity:.92;animation:oilTurn 28s linear infinite}
.oil:after{content:"";position:absolute;inset:8.5%;border-radius:50%;background:rgba(1,2,7,.91);filter:blur(11px)}
.oil2{inset:4%;background:conic-gradient(from 160deg,transparent 0 10%,rgba(255,83,190,.52) 19%,rgba(115,65,255,.66) 31%,rgba(30,204,255,.70) 43%,transparent 55% 70%,rgba(255,135,82,.43) 80%,rgba(130,64,255,.54) 91%,transparent);filter:blur(20px) saturate(1.38);opacity:.68;animation:oilTurn2 38s linear infinite}
.oil2:after{content:"";position:absolute;inset:13.5%;border-radius:50%;background:rgba(1,2,7,.88);filter:blur(14px)}
/* 4.5: center is no longer a crisp black disk. Its edge feathers into the torus. */
.core{inset:11.5%;background:radial-gradient(circle at 44% 38%,rgba(9,24,44,.28) 0%,rgba(1,2,7,.985) 55%,rgba(1,2,7,.96) 78%,rgba(1,2,7,.82) 87%,rgba(1,2,7,.48) 94%,rgba(1,2,7,.12) 98%,transparent 100%);box-shadow:inset 0 0 88px rgba(46,112,190,.08);filter:blur(2.4px)}
.mark{position:absolute;z-index:5;left:50%;top:48%;transform:translate(-50%,-50%);width:min(48vw,360px);height:auto;opacity:.72;filter:blur(.28px) drop-shadow(0 0 7px rgba(154,216,255,.16));transition:opacity .9s ease,transform .9s ease,filter .9s ease}
.mark path{fill:none;stroke:rgba(222,231,241,.76);stroke-width:1.02;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
/* Calm state changes: no urgent spinning or rapid "breathing". */
.listening .orb{filter:saturate(1.05);animation-duration:8.4s}
.thinking .orb{filter:saturate(1.22) brightness(1.035);animation-duration:6.8s}
.thinking .halo{opacity:.78;animation-duration:24s}.thinking .rim{animation-duration:22s}.thinking .oil{animation-duration:20s;opacity:.96}.thinking .oil2{animation-duration:27s;opacity:.76}
.thinking .mark{opacity:.60;transform:translate(-50%,-50%) scale(.992)}
.speaking .orb{filter:saturate(1.15) brightness(1.025);animation-duration:7.2s}
.speaking .mark{opacity:.76;transform:translate(-50%,-50%) scale(1.006);filter:blur(.22px) drop-shadow(0 0 8px rgba(154,216,255,.18))}
.error .mark{opacity:.28}
@keyframes ambient{0%,100%{transform:scale(.98);opacity:.58}50%{transform:scale(1.025);opacity:.78}}
@keyframes orbBreath{0%,100%{transform:translate(-50%,-50%) scale(.982)}50%{transform:translate(-50%,-50%) scale(1.012)}}
@keyframes oilTurn{to{transform:rotate(360deg)}}@keyframes oilTurn2{to{transform:rotate(-360deg)}}
@media(max-width:600px){.orb{width:88vw}.mark{width:47vw}}
@media(prefers-reduced-motion:reduce){.ambient,.orb,.halo,.rim,.oil,.oil2{animation:none!important}}
</style>
</head>
<body>
<main id="app" class="presence" aria-label="AKI. Tap once to allow microphone access, then say Aki.">
  <div class="ambient"></div>
  <div class="orb"><div class="halo"></div><div class="rim"></div><div class="oil"></div><div class="oil2"></div><div class="core"></div></div>
  <svg class="mark" viewBox="0 0 210 90" aria-label="AKI"><path d="M15 72 L45 18 L75 72 M95 18 L95 72 M96 48 L142 18 M96 48 L144 72 M172 18 L172 72"/></svg>
</main>
<script>
const app=document.querySelector('#app');
let pc=null,dc=null,micStream=null,audioEl=null,starting=false,transcript='',thinkTimer=null,audioCtx=null,lastChime=0,restarting=false;
let akiVoice=localStorage.getItem('akiVoice')||'marin';
let akiLanguage=localStorage.getItem('akiLanguage')||'auto';

function state(name){app.classList.remove('listening','thinking','speaking');if(name)app.classList.add(name)}
function thinkingChime(){
  const now=Date.now();if(now-lastChime<2200)return;lastChime=now;
  try{
    audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();
    const t=audioCtx.currentTime;
    [523.25,783.99].forEach((f,i)=>{
      const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=f;
      g.gain.setValueAtTime(0,t+i*.06);g.gain.linearRampToValueAtTime(.026,t+.03+i*.06);g.gain.exponentialRampToValueAtTime(.0001,t+.38+i*.06);
      o.connect(g);g.connect(audioCtx.destination);o.start(t+i*.06);o.stop(t+.42+i*.06)
    })
  }catch{}
}
function setThinking(){if(!app.classList.contains('speaking')){state('thinking');thinkingChime()}}

function detectPreference(text){
  const t=(text||'').toLowerCase();
  let voice=null;
  // 4.5: actual underlying voice selection. No "sound masculine" fallback.
  if(/\b(man|male|man's voice|male voice|a man|hombre|voz masculina|uomo|voce maschile|мужской голос|мужчина)\b/.test(t)) voice='ash';
  if(/\b(woman|female|woman's voice|female voice|a woman|mujer|voz femenina|donna|voce femminile|женский голос|женщина)\b/.test(t)) voice='marin';
  if(/\b(other voice|different voice|another voice|alternate voice)\b/.test(t)) voice=(akiVoice==='cedar'?'ash':'cedar');
  return {voice};
}
async function applyPreference(text){
  const p=detectPreference(text);
  if(p.voice&&p.voice!==akiVoice&&!restarting){
    akiVoice=p.voice;localStorage.setItem('akiVoice',akiVoice);
    restarting=true;state('thinking');thinkingChime();
    setTimeout(async()=>{await stopAki();restarting=false;startAki()},360);
  }
}
function absorbTranscript(m){
  const type=m.type||'', nested=m.event?.type||'';
  const delta =
    (typeof m.delta==='string' && /transcript/i.test(type) ? m.delta : '') ||
    (typeof m.transcript==='string' && /transcript/i.test(type) ? m.transcript : '') ||
    (typeof m.event?.delta==='string' && /transcript/i.test(nested) ? m.event.delta : '');
  if(delta){
    transcript+=delta;state('listening');clearTimeout(thinkTimer);
    thinkTimer=setTimeout(()=>{const heard=transcript;transcript='';setThinking();applyPreference(heard)},260);
  }
}
async function stopAki(){
  clearTimeout(thinkTimer);
  try{dc?.close()}catch{}try{pc?.close()}catch{}try{micStream?.getTracks().forEach(t=>t.stop())}catch{}
  pc=dc=micStream=null;
  if(audioEl){audioEl.srcObject=null;audioEl.remove();audioEl=null}
  app.classList.remove('listening','thinking','speaking','error')
}
async function startAki(){
  if(pc||starting)return;starting=true;app.classList.remove('error');
  try{
    audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')await audioCtx.resume();
    micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
    pc=new RTCPeerConnection();audioEl=document.createElement('audio');audioEl.autoplay=true;audioEl.playsInline=true;document.body.appendChild(audioEl);
    pc.ontrack=e=>{audioEl.srcObject=e.streams[0];audioEl.play().catch(()=>{})};
    micStream.getTracks().forEach(t=>pc.addTrack(t,micStream));
    dc=pc.createDataChannel('oai-events');
    dc.addEventListener('open',()=>console.log('AKI 4.5 connected; requested voice:',akiVoice));
    dc.addEventListener('message',e=>{
      try{
        const m=JSON.parse(e.data),type=m.type||'',nested=m.event?.type||'';
        if(type==='session.started'){
          state('listening');
          const resolved=m.session?.audio?.output?.voice||m.session?.voice;
          console.log('AKI 4.5 session started; resolved voice:',resolved||'(not exposed)');
        }
        absorbTranscript(m);
        if(type.includes('delegation.created')||nested.includes('response.created')||nested.includes('response.in_progress'))setThinking();
        if(type==='output_audio.delta'||type==='output_transcript.delta'||nested.includes('output_audio.delta')||nested.includes('output_text.delta'))state('speaking');
        if(type==='session.closed'||type==='output_audio.done'||nested.includes('response.completed')||nested.includes('response.done'))state('listening');
        if(type==='error')console.error('AKI Live event error:',m);
      }catch{}
    });
    pc.addEventListener('connectionstatechange',()=>{if(['failed','closed','disconnected'].includes(pc?.connectionState))app.classList.remove('listening','thinking','speaking')});
    const offer=await pc.createOffer();await pc.setLocalDescription(offer);
    const localSdp=pc.localDescription?.sdp||offer.sdp;
    if(!localSdp||!localSdp.trim().startsWith('v=0'))throw new Error('Browser did not create a valid SDP offer');
    const r=await fetch('/api/aki',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sdp:localSdp,voice:akiVoice,language:akiLanguage})});
    const answer=await r.text();if(!r.ok)throw new Error(answer);
    await pc.setRemoteDescription({type:'answer',sdp:answer});
  }catch(err){
    console.error('AKI 4.5 start error:',err);await stopAki();app.classList.add('error')
  }finally{starting=false}
}
app.addEventListener('click',()=>{if(!pc)startAki()});
window.addEventListener('beforeunload',stopAki);
</script>
</body>
</html>

<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AKI</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Georgia,'Times New Roman',serif;background:#f7f7f4;color:#4b4d4b}body{min-height:100vh;overflow:hidden}.presence{position:relative;min-height:100vh;overflow:hidden;isolation:isolate;background:linear-gradient(145deg,#fcfcfa,#eef1f1 48%,#f8f6f4)}.atmosphere{position:absolute;inset:-20%;filter:blur(40px);opacity:.82;animation:air 10s ease-in-out infinite}.atmosphere:before,.atmosphere:after{content:"";position:absolute;border-radius:50%}.atmosphere:before{width:72%;height:67%;left:1%;top:4%;background:radial-gradient(circle at 55% 45%,rgba(198,224,240,.48),rgba(226,218,238,.2) 48%,transparent 72%);animation:d1 16s ease-in-out infinite alternate}.atmosphere:after{width:70%;height:66%;right:-1%;bottom:0;background:radial-gradient(circle at 44% 48%,rgba(242,220,224,.38),rgba(214,230,241,.23) 48%,transparent 74%);animation:d2 19s ease-in-out infinite alternate}.life{position:absolute;left:50%;top:48%;width:min(82vw,620px);aspect-ratio:1;transform:translate(-50%,-50%) scale(.9);border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.92),rgba(242,247,249,.58) 30%,rgba(215,231,241,.2) 52%,rgba(234,221,239,.13) 66%,transparent 76%);filter:blur(8px);animation:breath 7.8s ease-in-out infinite}.life:after{content:"";position:absolute;inset:17%;border-radius:46% 54% 58% 42%/53% 44% 56% 47%;background:radial-gradient(circle at 38% 34%,rgba(255,255,255,.96),rgba(211,232,244,.28) 40%,rgba(238,218,236,.15) 67%,transparent 80%);filter:blur(13px);animation:morph 12s ease-in-out infinite alternate}.mark{position:absolute;z-index:3;inset:0;display:grid;place-items:center;font-size:clamp(52px,14vw,92px);font-weight:600;letter-spacing:.18em;padding-left:.18em;color:rgba(205,206,202,.66);text-shadow:0 1px 0 #fff,0 -1px 1px rgba(100,104,103,.55),1px 0 1px rgba(255,255,255,.7),-1px 0 1px rgba(130,134,132,.24);transition:transform .7s ease}.status{position:absolute;z-index:4;left:50%;bottom:8%;transform:translateX(-50%);font:300 15px system-ui,sans-serif;letter-spacing:.08em;color:rgba(70,76,80,.55);opacity:0;transition:opacity .4s}.active .status{opacity:1}.active .life{animation-duration:4.8s}.active .atmosphere{animation-duration:6.2s}@keyframes air{0%,100%{transform:scale(.96);opacity:.63}50%{transform:scale(1.07);opacity:.92}}@keyframes d1{from{transform:translate(-6%,-4%) scale(.94)}to{transform:translate(16%,10%) scale(1.16)}}@keyframes d2{from{transform:translate(8%,9%) scale(1.12)}to{transform:translate(-15%,-10%) scale(.91)}}@keyframes breath{0%,100%{transform:translate(-50%,-50%) scale(.85);opacity:.55}50%{transform:translate(-50%,-50%) scale(1.08);opacity:.96}}@keyframes morph{0%{border-radius:46% 54% 58% 42%/53% 44% 56% 47%;transform:rotate(-3deg) scale(.94)}50%{border-radius:57% 43% 44% 56%/43% 58% 42% 57%;transform:rotate(3deg) scale(1.08)}100%{border-radius:43% 57% 52% 48%/58% 45% 55% 42%;transform:rotate(-2deg) scale(.98)}}@media(prefers-reduced-motion:reduce){.atmosphere,.atmosphere:before,.atmosphere:after,.life,.life:after{animation:none!important}}
</style></head><body><main id="app" class="presence"><div class="atmosphere"></div><div class="life"></div><div class="mark">AKI</div><div class="status" id="status">listening…</div></main><script>
const app=document.querySelector('#app'), statusEl=document.querySelector('#status');let pc=null,audioEl=null;
async function startAki(){if(pc)return; app.classList.add('active');statusEl.textContent='connecting…';try{const r=await fetch('/api/session');if(!r.ok)throw new Error(await r.text());const data=await r.json();const ephemeralKey=data.client_secret?.value||data.value||data.client_secret;if(!ephemeralKey)throw new Error('No ephemeral key returned');pc=new RTCPeerConnection();audioEl=document.createElement('audio');audioEl.autoplay=true;pc.ontrack=e=>audioEl.srcObject=e.streams[0];const stream=await navigator.mediaDevices.getUserMedia({audio:true});stream.getTracks().forEach(t=>pc.addTrack(t,stream));const dc=pc.createDataChannel('oai-events');dc.addEventListener('open',()=>{statusEl.textContent='listening…'});dc.addEventListener('message',e=>{try{const m=JSON.parse(e.data);if(m.type==='response.audio.done'||m.type==='response.done')statusEl.textContent='listening…';if(m.type==='input_audio_buffer.speech_started')statusEl.textContent='listening…';}catch{}});const offer=await pc.createOffer();await pc.setLocalDescription(offer);const sdp=await fetch('https://api.openai.com/v1/realtime?model=gpt-realtime-2.1',{method:'POST',body:offer.sdp,headers:{Authorization:`Bearer ${ephemeralKey}`,'Content-Type':'application/sdp'}});if(!sdp.ok)throw new Error(await sdp.text());await pc.setRemoteDescription({type:'answer',sdp:await sdp.text()});}catch(err){console.error(err);statusEl.textContent='tap to retry';app.classList.remove('active');pc?.close();pc=null;}}
app.addEventListener('click',startAki,{once:false});
</script></body></html>

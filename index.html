/* SHIFTVIX IONIC THRUSTER — permanent living center reactor */
#center{
    --reactor-color:210,245,255;
    --reactor-hot:255,255,255;
    --reactor-plume:105,225,255;
    --reactor-plume-edge:70,150,255;
    --reactor-scale:1;
    --thrust-angle:90deg;
    --thrust-power:0;
    --thrust-length:26px;
    --thrust-width:9px;
    position:absolute;
    left:50%;
    top:50%;
    width:22px;
    height:22px;
    border-radius:50%;
    transform:translate(-50%,-50%) scale(var(--reactor-scale));
    background:
        radial-gradient(circle at 50% 50%,
            rgba(var(--reactor-hot),.98) 0 12%,
            rgba(var(--reactor-plume),.78) 20%,
            rgba(7,18,28,.88) 46%,
            rgba(0,0,0,.92) 70%);
    border:2px solid rgba(255,255,255,.98);
    box-shadow:
        0 0 8px rgba(255,255,255,.78),
        0 0 16px rgba(var(--reactor-color),.28),
        inset 0 0 8px rgba(var(--reactor-plume),.42);
    z-index:13;
    pointer-events:auto;
    cursor:pointer;
    transition:
        transform .28s ease,
        border-color .24s ease,
        box-shadow .24s ease,
        background .24s ease;
    isolation:isolate;
}

#center .reactorCore,
#center .reactorMiddle,
#center .reactorOuter,
#center .reactorPlume{
    position:absolute;
    left:50%;
    top:50%;
    pointer-events:none;
    box-sizing:border-box;
}

#center .reactorCore{
    width:11px;
    height:11px;
    border-radius:50%;
    transform:translate(-50%,-50%);
    background:
        radial-gradient(circle,
            rgba(255,255,255,1) 0 20%,
            rgba(var(--reactor-hot),.98) 32%,
            rgba(var(--reactor-plume),.56) 58%,
            transparent 76%);
    box-shadow:
        0 0 7px rgba(255,255,255,.96),
        0 0 14px rgba(var(--reactor-plume),.72);
    animation:ionicCoreIdle 1.25s ease-in-out infinite;
    z-index:4;
}

#center .reactorMiddle,
#center .reactorOuter{
    border-radius:50%;
    transform:translate(-50%,-50%);
    transition:
        width .3s ease,
        height .3s ease,
        border-color .24s ease,
        box-shadow .24s ease,
        opacity .24s ease;
}

#center .reactorMiddle{
    width:43px;
    height:43px;
    border:1px solid rgba(255,255,255,.50);
    box-shadow:
        0 0 7px rgba(255,255,255,.13),
        inset 0 0 6px rgba(var(--reactor-plume),.08);
    z-index:2;
}

#center .reactorOuter{
    width:64px;
    height:64px;
    border:2px solid rgba(var(--reactor-color),.88);
    box-shadow:
        0 0 10px rgba(var(--reactor-color),.48),
        inset 0 0 8px rgba(var(--reactor-color),.12);
    animation:reactorBreathe 1.8s ease-in-out infinite;
    z-index:1;
}

/* Short ion cone. It appears only while the player is changing lanes. */
#center .reactorPlume{
    left:50%;
    top:50%;
    width:calc(var(--thrust-length) * (.42 + var(--thrust-power) * .58));
    height:calc(var(--thrust-width) * (.72 + var(--thrust-power) * .28));
    border-radius:999px 72% 72% 999px;
    transform-origin:0 50%;
    transform:
        translate(7px,-50%)
        rotate(var(--thrust-angle))
        scaleX(calc(.74 + var(--thrust-power) * .26));
    opacity:calc(var(--thrust-power) * .88);
    background:linear-gradient(
        90deg,
        rgba(255,255,255,.98) 0%,
        rgba(var(--reactor-hot),.92) 18%,
        rgba(var(--reactor-plume),.72) 54%,
        rgba(var(--reactor-plume-edge),.12) 100%
    );
    box-shadow:
        0 0 6px rgba(255,255,255,.86),
        0 0 13px rgba(var(--reactor-plume),.64);
    filter:blur(.25px);
    transition:
        opacity .08s linear,
        width .12s ease,
        height .12s ease,
        background .22s ease,
        box-shadow .22s ease;
    z-index:-1;
}

@keyframes ionicCoreIdle{
    0%,100%{
        transform:translate(-50%,-50%) scale(.92);
        opacity:.78;
        filter:brightness(.92);
    }
    52%{
        transform:translate(-50%,-50%) scale(1.12);
        opacity:1;
        filter:brightness(1.18);
    }
}

@keyframes ionicCoreFlux{

    24%{transform:translate(-50%,-50%) scale(1.24);filter:brightness(1.35)}

}

@keyframes reactorBreathe{
    0%,100%{transform:translate(-50%,-50%) scale(.97);opacity:.72}
    50%{transform:translate(-50%,-50%) scale(1.04);opacity:1}
}

/* SHIFTVIX v2.3 — Gravity / Reverse visual field */
#flowFx{position:absolute;inset:0;z-index:12;pointer-events:none;opacity:0;transition:opacity .18s ease;mix-blend-mode:screen;background:radial-gradient(circle at 50% 48%,transparent 28%,rgba(120,80,255,.10) 62%,rgba(40,180,255,.16) 100%);box-shadow:inset 0 -18vh 22vh rgba(80,30,255,.08),inset 0 18vh 22vh rgba(0,180,255,.06)}
#flowFx.gravity{opacity:var(--gravity-fx,0);filter:saturate(calc(1 + var(--gravity-fx,0)*.8)) contrast(calc(1 + var(--gravity-fx,0)*.12))}
#flowFx.pulse{opacity:var(--pulse-fx,.2);background:radial-gradient(circle at 50% 50%,rgba(125,249,255,.22),rgba(80,120,255,.10) 34%,transparent 68%);filter:brightness(calc(.9 + var(--pulse-fx,.2)*.9)) saturate(calc(1 + var(--pulse-fx,.2)*.75));}
#pulseWaves{position:absolute;inset:0;z-index:14;pointer-events:none;overflow:hidden;}
.pulseWave{position:absolute;left:50%;top:50%;width:32px;height:32px;border-radius:50%;border:2px solid rgba(125,249,255,.85);box-shadow:0 0 18px rgba(125,249,255,.75),inset 0 0 16px rgba(125,249,255,.25);transform:translate(-50%,-50%) scale(.2);opacity:0;animation:pulseShockwave .9s cubic-bezier(.1,.55,.2,1) forwards;}
.pulseWave.secondary{border-color:rgba(255,102,204,.55);animation-delay:.08s;}
@keyframes pulseShockwave{0%{opacity:.95;transform:translate(-50%,-50%) scale(.25)}65%{opacity:.34}100%{opacity:0;transform:translate(-50%,-50%) scale(18)}}
#flowFx.reverse{opacity:.62;background:radial-gradient(circle at 50% 50%,transparent 30%,rgba(255,50,40,.08) 64%,rgba(255,0,120,.17) 100%);animation:reverseBreath 1.35s ease-in-out infinite alternate}

    line-height:1.35;
  }
}



/* SHIFTVIX V5 — visible per-Flow completion level */
.flowChoiceIdentity{
  display:flex;
  align-items:baseline;
  gap:12px;
  min-width:0;
}

.flowChoiceCompleted{
  color:var(--flow-color);
  font-size:clamp(19px,2.2vw,29px);
  font-weight:1000;
  line-height:1;
  letter-spacing:.4px;
  text-shadow:
    0 0 12px var(--flow-glow);
  opacity:.98;
}

@media(max-width:699px){
  .flowChoiceIdentity{
    gap:9px;
  }

  .flowChoiceCompleted{
    font-size:20px;
  }
}


/* ============================================================
   SHIFTVIX TRAVELER LAB V2 — THIRD-EYE FLIGHT EMBODIMENT
   Experimental play-test only. Gameplay / flow logic unchanged.
   Reactor stays the exact collision/control anchor and reads as
   the Traveler's third eye. Camera reads from behind/above torso.
   ============================================================ */
#center .travelerBody{
  --traveler-rgb:110,220,255;
  --traveler-hot:225,252,255;
  position:absolute;
  left:50%; top:50%;
  width:clamp(260px,40vw,510px);
  height:auto;
  aspect-ratio:520/300;
  transform:translate(-50%,-42%) scale(1);
  transform-origin:50% 42%;
  z-index:-3;
  pointer-events:none;
  overflow:visible;
  opacity:.58;
  filter:drop-shadow(0 0 8px rgba(var(--traveler-rgb),.68)) drop-shadow(0 0 26px rgba(var(--traveler-rgb),.30));
  transition:transform .30s cubic-bezier(.2,.8,.2,1),opacity .22s ease,filter .22s ease;
  animation:travelerFlight 2.5s ease-in-out infinite;
}
#center .travelerBody .tFill{fill:rgba(var(--traveler-rgb),.038);stroke:rgba(var(--traveler-hot),.78);stroke-width:1.6;vector-effect:non-scaling-stroke}
#center .travelerBody .tInner{fill:rgba(var(--traveler-rgb),.018);stroke:rgba(var(--traveler-rgb),.38);stroke-width:.9;vector-effect:non-scaling-stroke}
#center .travelerBody .tEnergy{fill:none;stroke:rgba(var(--traveler-rgb),.48);stroke-width:1;vector-effect:non-scaling-stroke}
#center .travelerBody .tCoreHalo{fill:rgba(var(--traveler-rgb),.055);stroke:rgba(var(--traveler-hot),.50);stroke-width:1.15}
#center.reactorFlux .travelerBody{--traveler-rgb:45,220,255;--traveler-hot:245,255,255;opacity:.73;transform:translate(-50%,-49%) scale(.91,1.08);filter:drop-shadow(0 0 11px rgba(255,255,255,.72)) drop-shadow(0 0 34px rgba(45,220,255,.64));animation-duration:.68s}
#center.reactorChrono .travelerBody{--traveler-rgb:150,105,255;--traveler-hot:225,245,255;opacity:.62;transform:translate(-50%,-37%) scale(1.10,.96);filter:drop-shadow(0 0 12px rgba(150,105,255,.72)) drop-shadow(0 0 34px rgba(70,195,255,.28));animation:travelerChrono 2.5s ease-in-out infinite}
#center.reactorMidas .travelerBody{--traveler-rgb:255,178,25;--traveler-hot:255,255,218;opacity:.82;transform:translate(-50%,-44%) scale(.98,1.02);filter:drop-shadow(0 0 12px rgba(255,245,190,.90)) drop-shadow(0 0 38px rgba(255,165,15,.67));animation-duration:1.0s}
#center.reactorDamage .travelerBody{--traveler-rgb:255,42,42;--traveler-hot:255,245,245;opacity:.94;transform:translate(-50%,-38%) scale(1.08,.95);filter:drop-shadow(0 0 14px rgba(255,35,35,.96)) drop-shadow(0 0 38px rgba(255,0,0,.75));animation:travelerHit .42s ease-out}
@keyframes travelerFlight{0%,100%{margin-top:2px;opacity:.54}50%{margin-top:-3px;opacity:.64}}
@keyframes travelerChrono{0%,100%{opacity:.48;margin-top:3px}50%{opacity:.70;margin-top:-4px}}
@keyframes travelerHit{0%{opacity:.15;filter:brightness(2.3) drop-shadow(0 0 26px rgba(255,0,0,1))}35%{opacity:1}100%{opacity:.94}}
@media (max-width:480px){#center .travelerBody{width:clamp(250px,88vw,390px);opacity:.55;transform:translate(-50%,-41%) scale(1)}}
@media(prefers-reduced-motion:reduce){#center .travelerBody{animation:none!important}}


/* SHIFTVIX TRAVELER LAB V3 — LARGE SILHOUETTE / GEM ONLY */
#center{--traveler-bank-x:0deg;--traveler-bank-y:0deg;background:transparent!important;border-color:transparent!important;box-shadow:none!important;}
#center .reactorMiddle,#center .reactorOuter,#center .reactorPlume{display:none!important;}
#center .reactorCore{width:13px;height:13px;z-index:8;box-shadow:0 0 7px rgba(255,255,255,.96),0 0 15px rgba(var(--reactor-plume),.72);}
#center .travelerBody{width:clamp(720px,76vw,1180px);aspect-ratio:900/620;transform:translate(-50%,-17%) perspective(900px) rotateX(calc(10deg + var(--traveler-bank-y))) rotateZ(var(--traveler-bank-x));transform-origin:50% 18%;opacity:.44;filter:drop-shadow(0 0 4px rgba(255,255,255,.30));animation:travelerFlightV3 2.8s ease-in-out infinite;transition:transform .22s cubic-bezier(.2,.8,.2,1),opacity .18s ease,filter .18s ease;}
#center .travelerBody .tFill{fill:rgba(255,255,255,.006);stroke:rgba(245,252,255,.58);stroke-width:1.15;vector-effect:non-scaling-stroke;}
#center .travelerBody .tEnergy{fill:none;stroke:rgba(245,252,255,.22);stroke-width:.78;vector-effect:non-scaling-stroke;}
#center .travelerBody .tEnergy.faint{stroke:rgba(245,252,255,.11);}
#center.reactorFlux .travelerBody{--traveler-rgb:45,220,255;opacity:.62;filter:drop-shadow(0 0 7px rgba(45,220,255,.50));}
#center.reactorChrono .travelerBody{--traveler-rgb:150,105,255;opacity:.55;filter:drop-shadow(0 0 8px rgba(150,105,255,.50));}
#center.reactorMidas .travelerBody{--traveler-rgb:255,178,25;opacity:.70;filter:drop-shadow(0 0 8px rgba(255,178,25,.60));}
#center.reactorDamage .travelerBody{--traveler-rgb:255,42,42;opacity:.82;filter:drop-shadow(0 0 9px rgba(255,42,42,.72));}
#center.reactorFlux .travelerBody .tFill,#center.reactorFlux .travelerBody .tEnergy,#center.reactorChrono .travelerBody .tFill,#center.reactorChrono .travelerBody .tEnergy,#center.reactorMidas .travelerBody .tFill,#center.reactorMidas .travelerBody .tEnergy,#center.reactorDamage .travelerBody .tFill,#center.reactorDamage .travelerBody .tEnergy{stroke:rgba(var(--traveler-rgb),.72);}
@keyframes travelerFlightV3{0%,100%{margin-top:3px}50%{margin-top:-4px}}
@media(max-width:699px) and (orientation:portrait){#center .travelerBody{width:clamp(470px,128vw,690px);transform:translate(-50%,-14%) perspective(820px) rotateX(calc(12deg + var(--traveler-bank-y))) rotateZ(var(--traveler-bank-x));opacity:.42;}}
@media(min-width:700px), (orientation:landscape){#center .travelerBody{width:clamp(760px,82vw,1280px);transform:translate(-50%,-18%) perspective(1000px) rotateX(calc(9deg + var(--traveler-bank-y))) rotateZ(var(--traveler-bank-x));}}

function applyRendererResolution(width=window.innerWidth,height=window.innerHeight){

  SHIFTVIX FROZEN MOBILE VIEWPORT

  Mobile browsers can change innerHeight/clientHeight while their address bars,
  bottom bars, power-up compositing layers, or page chrome animate. Rebuilding
  WebGL from those transient dimensions is what lets the game jump, crop, or
  remain slightly up/left.

  Rule for mobile:
  - capture one viewport rectangle for the current orientation;
  - freeze it for the entire orientation;
  - NEVER resize because of toolbar / visualViewport / power-up events;
  - only recalculate after a genuine portrait <-> landscape orientation change.

  The HTML body, WebGL renderer, camera and center reactor all use this exact
  same frozen rectangle.
*/
function measureOrientationViewport(){
  return {
    width:Math.max(
      1,
      Math.round(window.innerWidth || document.documentElement.clientWidth)
    ),
    height:Math.max(
      1,
      Math.round(window.innerHeight || document.documentElement.clientHeight)
    )
  };
}

    "--shiftvix-app-height",
    `${height}px`
  );

  const canvas=renderer.domElement;

  canvas.style.position="fixed";
  canvas.style.left="0px";
  canvas.style.top="0px";
  canvas.style.right="auto";
  canvas.style.bottom="auto";
  canvas.style.width=`${width}px`;
  canvas.style.height=`${height}px`;

  camera.aspect=width/height;
  camera.updateProjectionMatrix();

  applyRendererResolution(width,height);

  const center=document.getElementById("center");
  if(center){
    center.style.left=`${width/2}px`;
    center.style.top=`${height/2}px`;
  }

function recaptureViewportForOrientation(){
  const next=measureOrientationViewport();

  stableViewportWidth=next.width;
  stableViewportHeight=next.height;
  viewportOrientation=
    stableViewportWidth>=stableViewportHeight ? "landscape" : "portrait";

    stableViewportWidth,
    stableViewportHeight
  );

  const w=window.innerWidth || document.documentElement.clientWidth;

    Compatibility function retained because other SHIFTVIX systems call it.
    It deliberately does NOT re-measure on mobile unless orientation changed.
  */
  const orientation=currentPhysicalOrientation();

    SHIFTVIX_MOBILE_DEVICE &&
    !force &&
    orientation===viewportOrientation

  if(
    SHIFTVIX_MOBILE_DEVICE &&
    force &&
    orientation===viewportOrientation

    // Re-apply the already-frozen rectangle; do not ingest transient sizes.
    applyFrozenGameViewport(
      stableViewportWidth,
      stableViewportHeight
    );
    return;
  }

  recaptureViewportForOrientation();
}

function analyticsLocalDateKey(date=new Date()){
  const y=date.getFullYear();
  const m=String(
    date.getMonth()+1
  ).padStart(2,"0");
  const d=String(
    date.getDate()
  ).padStart(2,"0");

  return `${y}-${m}-${d}`;
}

function daysBetweenDateKeys(a,b){
  if(!a||!b)return null;

  const parse=key=>{
    const [y,m,d]=
      key.split("-").map(Number);

    if(!y||!m||!d)return NaN;

    return Date.UTC(y,m-1,d);
  };

  const start=parse(a);
  const end=parse(b);

  if(
    !Number.isFinite(start) ||
    !Number.isFinite(end)
  ){
    return null;
  }

  return Math.max(
    0,
    Math.round(
      (end-start)/86400000
    )
  );
}

  const center=document.getElementById("center");

  /*
  The plume points opposite the player's actual on-screen motion.
  It is intentionally short and appears only during lane transitions.
  */
  const velocityX=targetX-playerX;
  const velocityY=targetY-playerY;

    const targetAngle=Math.atan2(-velocityY,-velocityX)*180/Math.PI;
    let angleDelta=((targetAngle-ionicThrustAngle+540)%360)-180;
    ionicThrustAngle+=angleDelta*(1-Math.exp(-dt*14));

  const statePower=
    fluxBoostTime>0 ? 1 :
    midasTime>0 ? .82 :
    chronoTime>0 ? .60 :
    .48;

  const targetPower=movementPower*statePower;
  ionicThrustPower+=(targetPower-ionicThrustPower)*(1-Math.exp(-dt*(targetPower>ionicThrustPower?18:8)));

  center.style.setProperty("--thrust-angle",`${ionicThrustAngle.toFixed(2)}deg`);

  // Do not rewrite the canvas CSS filter every frame; keeping the compositor

    The more Warps the Flow asks the player to chain, the less raw
    distance each Warp adds. The visual Warp/surge remains intact;
    only the underlying distance jump is reduced.

      8–12  -> 400m
      13–17 -> 300m
      18–21 -> 200m
      22–24 -> 100m
  */
  const target=
    Number(activeChallenge?.target)||8;

  if(target<=12)return 400;
  if(target<=17)return 300;
  if(target<=21)return 200;
  return 100;
}

      new THREE.MeshBasicMaterial({

function playWarpBoom(strength=1){
  initAudio();

  const now=audioCtx.currentTime;
  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();
  const filter=audioCtx.createBiquadFilter();
  osc.type="sine";
  osc.frequency.setValueAtTime(105*strength,now);
  osc.frequency.exponentialRampToValueAtTime(38,now+.42);
  filter.type="lowpass";
  filter.frequency.setValueAtTime(520,now);
  gain.gain.setValueAtTime(.0001,now);
  gain.gain.linearRampToValueAtTime(.075*strength,now+.018);
  gain.gain.exponentialRampToValueAtTime(.0001,now+.58);
  osc.connect(filter).connect(gain).connect(audioCtx.destination);
  osc.start(now);
  osc.stop(now+.62);
}

    silentTutorialComplete ||
    !gameStarted ||

    tutorialStageStartedAt=performance.now();

  ){

  ){

// Normal, Curved, Mirror, Gravity, Reverse, and Pulse share one interface.

//   10 CURVED · 20 MIRROR · 30 GRAVITY · 40 REVERSE · 50 PULSE
//
// Testing override:

// =========================
const ENVIRONMENT_TYPES = Object.freeze({
  NORMAL:"normal",
  CURVED:"curved",
  MIRROR:"mirror",
  GRAVITY:"gravity",
  REVERSE:"reverse",
  PULSE:"pulse"
});

const environmentQuery = new URLSearchParams(window.location.search)
  .get("environment")?.toLowerCase();
    

function environmentTypeForFlow(index){

    const flowNumber = (index % 30) + 1;

    const specialSlots = [
        3, 5, 7, 10,
        13, 15, 17, 20,
        23, 25, 27, 30
    ];

    const rotation = [ENVIRONMENT_TYPES.NORMAL];

    const slotIndex = specialSlots.indexOf(flowNumber);

    if(slotIndex === -1){
        return ENVIRONMENT_TYPES.NORMAL;
    }

    const blockIndex = Math.floor(index / 30);
    const globalSpecialIndex =
        (blockIndex * specialSlots.length) + slotIndex;

    return ENVIRONMENT_TYPES.NORMAL;
}
    
function flowNameForType(type){
  return `${String(type||ENVIRONMENT_TYPES.NORMAL).toUpperCase()} FLOW`;
}

function flowNameForIndex(index){
  const forced=(environmentQuery&&ENVIRONMENTS?.[environmentQuery])?environmentQuery:null;
  return flowNameForType(forced||environmentTypeForFlow(index));
}

function easeInOutCubic(t){
  return t < 0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
}
function rotatePoint(x,y,angle){
  const c=Math.cos(angle),s=Math.sin(angle);
  return {x:x*c-y*s,y:x*s+y*c};
}
function setFlowFx(mode,intensity=0){
  const fx=document.getElementById("flowFx");
  if(!fx)return;
  fx.className=mode||"";
  fx.style.setProperty("--gravity-fx",String(THREE.MathUtils.clamp(intensity,0,1)));
  fx.style.setProperty("--pulse-fx",String(THREE.MathUtils.clamp(intensity,0,1)));
}

// =========================
// SHIFTVIX WARP BANKING 3.0 + WARP CURVATURE 4.0
// Space momentum, dynamic vanishing point, layered depth, ambient route drift,
// and restrained gravitational-style curvature. Gameplay coordinates stay unchanged.
// =========================
const MAX_BANK_ROLL = THREE.MathUtils.degToRad(5.6);
const MAX_BANK_PITCH = THREE.MathUtils.degToRad(2.0);
const MAX_BANK_YAW = THREE.MathUtils.degToRad(1.25);

let bankRoll = 0;
let bankPitch = 0;
let bankYaw = 0;
let bankRollVelocity = 0;
let bankPitchVelocity = 0;
let bankYawVelocity = 0;

let warpCurveX = 0;
let warpCurveY = 0;
let warpCurveVelocityX = 0;
let warpCurveVelocityY = 0;

let routePhase = Math.random() * Math.PI * 2;
let routePhaseSpeed = 0.075 + Math.random() * 0.025;
let vanishingX = 0;
let vanishingY = 0;
let lensPulse = 0;

function addWarpBank(dx,dy){
  const speedFeel = 0.84 + Math.min(0.24, distance / 19000);

  // Steering impulses carry momentum instead of snapping to a fixed angle.
  bankRollVelocity += -dx * THREE.MathUtils.degToRad(13.5) * speedFeel;
  bankPitchVelocity +=  dy * THREE.MathUtils.degToRad(5.0) * speedFeel;
  bankYawVelocity +=   -dx * THREE.MathUtils.degToRad(3.7) * speedFeel;

  // The deep field receives a longer, softer directional impulse.
  warpCurveVelocityX += -dx * 58 * speedFeel;
  warpCurveVelocityY +=  dy * 31 * speedFeel;
}

function updateWarpBanking(dt){
  // Spring-damped aircraft-like response.
  const rollSpring = -bankRoll * 26;
  const pitchSpring = -bankPitch * 28;
  const yawSpring = -bankYaw * 24;

  bankRollVelocity += rollSpring * dt;
  bankPitchVelocity += pitchSpring * dt;
  bankYawVelocity += yawSpring * dt;

  const angularDrag = Math.exp(-dt * 5.5);
  bankRollVelocity *= angularDrag;
  bankPitchVelocity *= angularDrag;
  bankYawVelocity *= angularDrag;

  bankRoll = THREE.MathUtils.clamp(bankRoll + bankRollVelocity * dt, -MAX_BANK_ROLL, MAX_BANK_ROLL);
  bankPitch = THREE.MathUtils.clamp(bankPitch + bankPitchVelocity * dt, -MAX_BANK_PITCH, MAX_BANK_PITCH);
  bankYaw = THREE.MathUtils.clamp(bankYaw + bankYawVelocity * dt, -MAX_BANK_YAW, MAX_BANK_YAW);

  // Long route curvature has more inertia than the camera.
  warpCurveVelocityX += -warpCurveX * 2.15 * dt;
  warpCurveVelocityY += -warpCurveY * 2.35 * dt;
  const curveDrag = Math.exp(-dt * 1.85);
  warpCurveVelocityX *= curveDrag;
  warpCurveVelocityY *= curveDrag;
  warpCurveX = THREE.MathUtils.clamp(warpCurveX + warpCurveVelocityX * dt, -28, 28);
  warpCurveY = THREE.MathUtils.clamp(warpCurveY + warpCurveVelocityY * dt, -16, 16);

  // Variable route: long graceful curves separated by calmer sections.
  routePhase += dt * routePhaseSpeed * (0.65 + warpAmount * 0.35);
  const routeEnvelope = 0.36 + 0.64 * Math.pow(0.5 + 0.5 * Math.sin(routePhase * 0.53 + 0.8), 2);
  const ambientCurveX = Math.sin(routePhase) * routeEnvelope * warpAmount * 7.5;
  const ambientCurveY = Math.sin(routePhase * 0.71 + 1.45) * routeEnvelope * warpAmount * 3.6;

  // Dynamic vanishing point follows steering, but remains inside a safe 3–4% window.
  const targetVanishingX = THREE.MathUtils.clamp(
    -bankYaw * 285 + (warpCurveX + ambientCurveX) * 0.12,
    -18, 18
  );
  const targetVanishingY = THREE.MathUtils.clamp(
    bankPitch * 210 + (warpCurveY + ambientCurveY) * 0.10,
    -10, 10
  );
  const vanishEase = 1 - Math.exp(-dt * 2.7);
  vanishingX += (targetVanishingX - vanishingX) * vanishEase;
  vanishingY += (targetVanishingY - vanishingY) * vanishEase;

  // 4.0 curvature pulse is deliberately tiny and slow.
  lensPulse = (0.5 + 0.5 * Math.sin(routePhase * 0.41 + 2.2)) * warpAmount;

  const ambientRoll = Math.sin(routePhase * 0.88) * warpAmount * THREE.MathUtils.degToRad(0.38);
  const ambientYaw = Math.sin(routePhase * 0.61 + 0.4) * warpAmount * THREE.MathUtils.degToRad(0.20);
  const ambientPitch = Math.sin(routePhase * 0.47 + 1.2) * warpAmount * THREE.MathUtils.degToRad(0.09);

  /*
    CENTER LOCK:
    Preserve the arcade banking sensation as roll only.
    Pitch/yaw used to push the lane convergence point away from the fixed
    center reactor on mobile. Deep-field stars still receive curvature.
  */
  camera.rotation.z = bankRoll + ambientRoll;

  stars.forEach((s,index)=>{
    const depthWeight = 0.78 + index * 0.12;
    s.rotation.z = -(bankRoll + ambientRoll) * (0.18 + depthWeight * 0.08);
    s.position.x = -vanishingX * (0.42 + depthWeight * 0.12);
    s.position.y = -vanishingY * (0.34 + depthWeight * 0.10);
  });

  return {ambientCurveX, ambientCurveY};
}

function resetWarpBanking(){
  bankRoll = 0;
  bankPitch = 0;
  bankYaw = 0;
  bankRollVelocity = 0;
  bankPitchVelocity = 0;
  bankYawVelocity = 0;
  warpCurveX = 0;
  warpCurveY = 0;
  warpCurveVelocityX = 0;
  warpCurveVelocityY = 0;
  vanishingX = 0;
  vanishingY = 0;
  lensPulse = 0;
  camera.rotation.set(0,0,0);
  stars.forEach(s=>{
    s.rotation.z = 0;
    s.position.x = 0;
    s.position.y = 0;
  });
}

// SHIFTVIX DRIFT AUDIO V5
// DRIFT is the inverse of ordinary collection:
// - normal orb pickup sounds are muted while DRIFT is active
// - open/negative space plays the SAME familiar SHIFTVIX coin sounds
//
// The nine spatial lanes are mapped across the existing six coin tiers.
// This keeps DRIFT recognizable as SHIFTVIX while making empty space
// feel like an invisible lane of collectibles.
const DRIFT_AUDIO_STEP_METERS=5.2;

// Existing coin tiers:
// 0 WHITE, 1 BLUE, 2 GREEN, 3 PURPLE, 4 ORANGE, 5 RED
//
// Nine-lane spatial mapping creates a musical color path across the field.
const DRIFT_LANE_TIER_MAP=[
  0,1,2,
  3,4,5,
  4,2,1
];

let driftAudioMeterCarry=0;
let driftAudioLastLane=-1;
let driftAudioPhraseStep=0;

function driftAudioLaneIndex(){
  const col=
    playerX<-16
      ?0
      :(playerX>16?2:1);

  const row=
    playerY>16
      ?0
      :(playerY<-16?2:1);

  return row*3+col;
}

function driftTierForLane(laneIndex,phraseStep=0){
  const lane=
    Math.max(
      0,
      Math.min(
        8,
        laneIndex|0
      )
    );

  const baseTier=
    DRIFT_LANE_TIER_MAP[lane];

  /*
    Small familiar variation:
    every few invisible "drift coins" step one tier toward a neighbor,
    creating the same alternating white/green/red/blue feeling that
    normal mixed coin lanes can produce.
  */
  const variationPattern=[0,0,1,0,-1,0];
  const variation=
    variationPattern[
      phraseStep%
      variationPattern.length
    ];

  return TIERS[
    Math.max(
      0,
      Math.min(
        TIERS.length-1,
        baseTier+variation
      )
    )
  ];
}

function playDriftCoin(laneIndex,phraseStep=0){
  if(!audioCtx)return;

  // Deliberately use SHIFTVIX's existing coin sound engine.
  playCoin(
    driftTierForLane(
      laneIndex,
      phraseStep
    )
  );
}

function updateDriftAudio(distanceDelta,isOpenSpace){
  if(
    activeChallenge?.category!=="DRIFT" ||
    !isOpenSpace
  ){
    driftAudioMeterCarry=0;
    driftAudioLastLane=-1;
    driftAudioPhraseStep=0;
    return;
  }

  driftAudioMeterCarry+=
    Math.max(
      0,
      Number(distanceDelta)||0
    );

  const lane=
    driftAudioLaneIndex();

  // Moving into another negative-space lane gets an immediate familiar coin.
  if(
    driftAudioLastLane!==-1 &&
    lane!==driftAudioLastLane
  ){
    playDriftCoin(
      lane,
      driftAudioPhraseStep++
    );
  }

  driftAudioLastLane=lane;

  // Invisible Drift coins are tightly spaced so empty space has weight/volume.
  while(
    driftAudioMeterCarry>=
    DRIFT_AUDIO_STEP_METERS
  ){
    driftAudioMeterCarry-=
      DRIFT_AUDIO_STEP_METERS;

    playDriftCoin(
      lane,
      driftAudioPhraseStep++
    );
  }
}

const bassPatternA = [82,82,82,82,98,98,98,98,110,110,110,110,98,98,98,98];
const bassPatternB = [110,110,110,110,147,147,147,147,131,131,131,131,98,98,98,98];
const bassPatternC = [147,147,147,147,131,131,131,131,165,165,165,165,110,110,110,110];
const bassPatternD = [165,165,165,165,196,196,196,196,220,220,220,220,147,147,147,147];

const leadPatternA = [330,392,440,494,330,392,440,587,392,440,494,659,440,494,587,784];
const leadPatternB = [784,659,587,494,659,587,494,440,587,494,440,392,494,440,392,330];
const leadPatternC = [587,659,784,659,587,659,880,784,659,784,988,880,784,880,988,1174];

const arpPattern = [330,494,392,330,494,392,440,659,523,440,659,523];

// Small answering phrases. These do not replace the main melody; they appear
// briefly at higher distances so the soundtrack feels conversational.
const counterPatterns = {
  A:[659,0,587,0,523,0,494,0],
  B:[392,0,440,0,494,0,587,0],

let musicStarted = false;
let musicTimer = null;
let musicStep = 0;
let nextNoteTime = 0;
let lastStrikeDistance = 0;

// Shared audio path for music only. Coin and strike effects remain direct so
// they stay crisp and readable even when the soundtrack is filtered.
let musicInput = null;
let musicFilter = null;
let musicCompressor = null;
let musicMasterGain = null;

function ensureMusicBus(){
  if(!audioCtx || musicInput) return;

  musicInput = audioCtx.createGain();
  musicFilter = audioCtx.createBiquadFilter();
  musicCompressor = audioCtx.createDynamicsCompressor();
  musicMasterGain = audioCtx.createGain();

  musicFilter.type = "lowpass";
  musicFilter.frequency.value = 1350;
  musicFilter.Q.value = 0.7;

  musicCompressor.threshold.value = -18;
  musicCompressor.knee.value = 16;
  musicCompressor.ratio.value = 3;
  musicCompressor.attack.value = 0.01;
  musicCompressor.release.value = 0.18;

  musicMasterGain.gain.value = 0.82;

  musicInput.connect(musicFilter);
  musicFilter.connect(musicCompressor);
  musicCompressor.connect(musicMasterGain);
  musicMasterGain.connect(audioCtx.destination);
}

function updateMusicEvolution(time){
  if(!audioCtx) return;
  ensureMusicBus();

  // The same song gradually opens up instead of simply getting louder.
  const progress = Math.max(0, Math.min(1, distance / 5000));
  const cutoff = 1350 + progress * 7600;
  musicFilter.frequency.setTargetAtTime(cutoff, time, 0.18);

  // A tiny master lift compensates for the extra high-frequency detail.
  const gain = 0.80 + progress * 0.08;
  musicMasterGain.gain.setTargetAtTime(gain, time, 0.25);
}

function playTone(freq,type,volume,duration){
  if(!audioCtx) return;
  playToneAt(freq,type,volume,duration,audioCtx.currentTime);
}

function playToneAt(freq,type,volume,duration,startTime,options={}){
  if(!audioCtx || !freq || freq <= 0) return;
  ensureMusicBus();

  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  const destination = options.direct ? audioCtx.destination : musicInput;

  osc.type = type;
  osc.frequency.setValueAtTime(freq, startTime);
  if(options.detune) osc.detune.setValueAtTime(options.detune, startTime);

  const attack = options.attack ?? 0.01;
  const releaseEnd = startTime + duration;
  gain.gain.setValueAtTime(0.0001, startTime);
  gain.gain.linearRampToValueAtTime(volume, startTime + attack);
  gain.gain.exponentialRampToValueAtTime(0.0001, releaseEnd);

  osc.connect(gain);
  gain.connect(destination);
  osc.start(startTime);
  osc.stop(releaseEnd + 0.03);
}

let drumStep = 0;
let nextDrumTime = 0;
let drumEnabled = true;

function getDrumBPM(){
  const bpm = 76 + Math.min(46, distance / 115);
  return Math.max(76, Math.min(122, bpm));
}

function playNoiseHit(time, volume, duration, highpass=1200){
  if(!audioCtx || !drumEnabled) return;
  ensureMusicBus();
  const length = Math.max(1, Math.floor(audioCtx.sampleRate * duration));
  const buffer = audioCtx.createBuffer(1,length,audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for(let i=0;i<length;i++) data[i]=(Math.random()*2-1)*(1-i/length);

  const source=audioCtx.createBufferSource();
  const filter=audioCtx.createBiquadFilter();
  const gain=audioCtx.createGain();
  source.buffer=buffer;
  filter.type="highpass";
  filter.frequency.value=highpass;
  gain.gain.setValueAtTime(volume,time);
  gain.gain.exponentialRampToValueAtTime(0.0001,time+duration);
  source.connect(filter).connect(gain).connect(musicInput);
  source.start(time);
}

function playDrumHit(time, accent = 1){
  if(!audioCtx || !drumEnabled) return;
  if(environmentEngine?.current?.id===ENVIRONMENT_TYPES.PULSE) pulseEnvironment.onBeat(time,accent);
  ensureMusicBus();

  const bodyOsc = audioCtx.createOscillator();
  const bodyGain = audioCtx.createGain();
  bodyOsc.type = "sine";
  bodyOsc.frequency.setValueAtTime(92, time);
  bodyOsc.frequency.exponentialRampToValueAtTime(48, time + 0.18);
  bodyGain.gain.setValueAtTime(0.0001, time);
  bodyGain.gain.linearRampToValueAtTime(0.112 * accent, time + 0.008);
  bodyGain.gain.exponentialRampToValueAtTime(0.0001, time + 0.34);
  bodyOsc.connect(bodyGain).connect(musicInput);
  bodyOsc.start(time);
  bodyOsc.stop(time + 0.38);

  const knockOsc = audioCtx.createOscillator();
  const knockGain = audioCtx.createGain();
  knockOsc.type = "triangle";
  knockOsc.frequency.setValueAtTime(165, time);
  knockOsc.frequency.exponentialRampToValueAtTime(82, time + 0.07);
  knockGain.gain.setValueAtTime(0.0001, time);
  knockGain.gain.linearRampToValueAtTime(0.040 * accent, time + 0.004);
  knockGain.gain.exponentialRampToValueAtTime(0.0001, time + 0.13);
  knockOsc.connect(knockGain).connect(musicInput);
  knockOsc.start(time);
  knockOsc.stop(time + 0.15);

  // Extra percussion arrives in stages, preserving the original heartbeat.
  if(distance > 1100 && drumStep % 2 === 1){
    playNoiseHit(time,0.010,0.045,2500); // light shaker
  }
  if(distance > 2300 && drumStep % 4 === 2){
    playToneAt(72,"triangle",0.030,0.16,time,{attack:0.004}); // low tom answer
  }
  if(distance > 3600 && drumStep % 8 === 6){
    playNoiseHit(time,0.017,0.09,900); // broader tribal texture
  }
}

function drumScheduler(){
  if(!audioCtx || !musicStarted || !drumEnabled) return;
  const scheduleAheadTime = 0.14;
  while(nextDrumTime < audioCtx.currentTime + scheduleAheadTime){
    const beatDuration = 60 / getDrumBPM();
    const accent = drumStep % 4 === 0 ? 1.18 : (drumStep % 2 === 0 ? 1.05 : 0.82);
    playDrumHit(nextDrumTime, accent);
    drumStep++;
    nextDrumTime += beatDuration;
  }
}

function resetDrumPulse(){
  drumStep = 0;
  if(audioCtx) nextDrumTime = audioCtx.currentTime + 0.08;
}

function getMusicArrangement(){
  const easy=[["A","B"],["B","A"]];
  const mid=[["A","B","C"],["A","C","B"],["B","A","C"]];
  const hard=[["A","B","C","D"],["A","C","D","B"],["D","A","B","C"],["B","D","A","C"],["C","A","D","B"]];
  if(distance<500) return easy;
  if(distance<1000) return mid;
  if(distance<1500) return hard;
  if(distance<2000) return [["A","B","C","D"],["B","C","D","A"]];
  return [["A","B","C","D"],["A","C","D","B"],["B","D","A","C"],["C","A","D","B"],["D","C","B","A"],["D","A","B","C"],["B","A","D","C"],["C","D","B","A"]];
}

let currentArrangement = null;
let currentPhraseLength = 128;
let nextPhraseStep = 0;
let lastArrangement = -1;
let phraseInstrument = "square";

function getMusicSection(step){
  const arrangements=getMusicArrangement();
  if(step>=nextPhraseStep || !currentArrangement){
    let index=0;
    if(arrangements.length>1){
      do{index=Math.floor(Math.random()*arrangements.length);}while(index===lastArrangement);
    }
    lastArrangement=index;
    currentArrangement=arrangements[index];
    const phraseChoices=[32,32,32,32,36,36,28,39,44];
    currentPhraseLength=phraseChoices[Math.floor(Math.random()*phraseChoices.length)];
    nextPhraseStep=step+currentPhraseLength;

    // Subtle instrument rotation: same notes, slightly different character.
    const instruments=["square","square","triangle","sawtooth"];
    phraseInstrument=instruments[Math.floor(Math.random()*instruments.length)];
  }
  const sectionLength=12;
  const sectionIndex=Math.floor((step%currentPhraseLength)/sectionLength)%currentArrangement.length;
  return currentArrangement[sectionIndex];
}

function getPatternsForSection(section){
  if(section==="A") return {bass:bassPatternA,lead:leadPatternA};
  if(section==="B") return {bass:bassPatternB,lead:leadPatternB};
  if(section==="C") return {bass:bassPatternC,lead:leadPatternC};
  return {bass:bassPatternD,lead:leadPatternD};
}

function getCleanFlowAmount(){
  // Harmony gradually returns after a strike. Fewer remaining lives also reduce it.
  const cleanDistance=Math.max(0,distance-lastStrikeDistance);
  const recovery=Math.max(0,Math.min(1,cleanDistance/700));
  const livesFactor=Math.max(0.22,(3-strikes)/3);
  return recovery*livesFactor;
}

function scheduleAmbientPad(section,time,stepDuration,cleanAmount){
  if(musicStep%16!==0) return;
  const roots={A:82,B:98,C:110,D:147};
  const root=roots[section]||82;
  const evolution=Math.max(0,Math.min(1,distance/4500));
  const volume=0.0045+evolution*0.004+cleanAmount*0.003;
  const duration=stepDuration*15;
  playToneAt(root,"sine",volume,duration,time,{attack:0.18,detune:-5});
  playToneAt(root*1.5,"sine",volume*0.65,duration,time,{attack:0.22,detune:5});
}

function scheduleMusicStep(step,time,stepDuration){
  updateMusicEvolution(time);
  const section=getMusicSection(step);
  const patterns=getPatternsForSection(section);
  const cleanAmount=getCleanFlowAmount();
  const leadType=phraseInstrument;

  playToneAt(patterns.bass[step%patterns.bass.length],"triangle",0.038,stepDuration*0.9,time);
  playToneAt(patterns.lead[step%patterns.lead.length],leadType,leadType==="sawtooth"?0.017:0.023,stepDuration*0.8,time);
  playToneAt(arpPattern[step%arpPattern.length],"square",0.009,stepDuration*0.5,time);

  // Adaptive harmony rewards clean play with warmth rather than extra points.
  if(cleanAmount>0.10){
    const lead=patterns.lead[step%patterns.lead.length];
    playToneAt(lead*0.75,"sine",0.003+cleanAmount*0.007,stepDuration*2.2,time,{attack:0.05});
  }

  // Counter melody begins quietly, then becomes more present in longer runs.
  if(distance>950 && step%4===2){
    const counter=counterPatterns[section][Math.floor(step/2)%counterPatterns[section].length];
    const counterGrowth=Math.min(1,(distance-950)/2600);
    playToneAt(counter,"triangle",0.004+counterGrowth*0.006,stepDuration*1.15,time,{attack:0.025});
  }

  scheduleAmbientPad(section,time,stepDuration,cleanAmount);

  if(distance>500){
    playToneAt(patterns.lead[step%patterns.lead.length]/2,"sine",0.008,stepDuration*2.5,time);
  }
  if(distance>1200){
    playToneAt(patterns.lead[step%patterns.lead.length]*2,"triangle",0.005,stepDuration,time);
  }
  if(distance>2200 && step%4===0){
    playToneAt(55,"sine",0.011,0.09,time);
  }
  if(distance>3200 && step%2===0){
    playToneAt(patterns.bass[step%patterns.bass.length]*4,"triangle",0.005,stepDuration*3,time);
  }
  if(distance>4200 && step%4===0){
    playToneAt(patterns.lead[step%patterns.lead.length]*0.5,"sine",0.004,stepDuration*6,time,{attack:0.08});
  }
}

function musicScheduler(){
  if(!audioCtx || !musicStarted) return;
  const BPM=148;
  const STEP=(60/BPM)/2;
  const scheduleAheadTime=0.12;
  while(nextNoteTime<audioCtx.currentTime+scheduleAheadTime){
    scheduleMusicStep(musicStep,nextNoteTime,STEP);
    musicStep++;
    nextNoteTime+=STEP;
  }
  drumScheduler();
}

function resetMusicEvolution(){
  musicStep=0;
  currentArrangement=null;
  nextPhraseStep=0;
  lastArrangement=-1;
  phraseInstrument="square";
  lastStrikeDistance=0;
  if(audioCtx){
    ensureMusicBus();
    musicFilter.frequency.cancelScheduledValues(audioCtx.currentTime);
    musicFilter.frequency.setValueAtTime(1350,audioCtx.currentTime);
    musicMasterGain.gain.cancelScheduledValues(audioCtx.currentTime);
    musicMasterGain.gain.setValueAtTime(0.82,audioCtx.currentTime);
  }
  resetDrumPulse();
}

function startMusic(){
  initAudio();
  if(!audioCtx) return;

  const begin=()=>{
    if(audioCtx.state!=="running"){
      musicStarted=false;
      return;
    }
    if(musicStarted) return;

    ensureMusicBus();
    musicStarted=true;
    musicStep=0;
    nextNoteTime=audioCtx.currentTime+0.035;
    resetMusicEvolution();

    // Short confirmation that iOS Safari has opened the audio path.
    playToneAt(523.25,"triangle",0.012,0.07,audioCtx.currentTime+0.01,{direct:true});
    musicScheduler();
    if(musicTimer) clearInterval(musicTimer);
    musicTimer=setInterval(musicScheduler,25);
  };

  if(audioCtx.state!=="running"){
    audioCtx.resume().then(()=>setTimeout(begin,0)).catch(()=>{
      musicStarted=false;
      console.log("Music will start after first interaction.");
    });
  }else{
    begin();
  }
}

function flowFamilyOffset(category){
  return FLOW_TYPES.indexOf(category);
}

function authoredIndexesForCategory(category){
  const offset=flowFamilyOffset(category);
  if(offset<0)return [];

  const indexes=[];
  for(
    let index=offset;
    index<FLOW_TOTAL;
    index+=FLOWS_PER_CYCLE
  ){
    indexes.push(index);
  }
  return indexes;
}

function currentFamilyFlowIndex(category){
  const indexes=authoredIndexesForCategory(category);
  if(!indexes.length)return 0;

  const unfinished=indexes.find(
    index=>!completedFlowIndexes.has(index)
  );

  if(Number.isInteger(unfinished)){
    return unfinished;
  }

  // Mastery mode: once this family has exhausted its authored queue,
  // keep it alive by selecting from the same tuned challenge library.
  const seed=
    Math.floor(Date.now()/86400000) +
    flowFamilyOffset(category)*17 +
    Math.floor(Math.random()*indexes.length);

  return indexes[
    Math.abs(seed)%indexes.length
  ];
}

function currentEightFlowIndexes(){
  return FLOW_TYPES.map(
    category=>currentFamilyFlowIndex(category)
  );
}

function familyCompletedCount(category){
  return authoredIndexesForCategory(category)
    .filter(index=>completedFlowIndexes.has(index))
    .length;
}

function familyMastered(category){
  const indexes=authoredIndexesForCategory(category);
  return indexes.length>0 &&
    indexes.every(index=>completedFlowIndexes.has(index));
}

function familyProgressLabel(category){
  const total=authoredIndexesForCategory(category).length;
  const complete=familyCompletedCount(category);

  if(total && complete>=total){
    return "MASTERY";
  }

  return `${complete+1}`;
}

function prototypeTotalLabel(
  category
){
  const raw=
    Number(
      prototypeTotals[category]
    )||0;

  if(
    category==="TRAVEL" ||
    category==="DRIFT"
  ){
    return `${
      Math.floor(raw).toLocaleString()
    }m`;
  }

  if(category==="SCORE"){
    return `${
      Math.floor(raw).toLocaleString()
    } PTS`;
  }

  return Math.floor(
    raw
  ).toLocaleString();
}

function cycleNumberForFlow(index=currentFlowIndex){
  return Math.floor(Math.max(0,index)/FLOWS_PER_CYCLE)+1;
}
function cycleStartIndex(index=currentFlowIndex){
  return Math.floor(Math.max(0,index)/FLOWS_PER_CYCLE)*FLOWS_PER_CYCLE;
}
function cycleIsCompleteAtStart(start){
  if(start<0 || start>=FLOW_TOTAL)return false;

  for(let i=0;i<FLOWS_PER_CYCLE;i++){
    const fi=start+i;
    if(fi>=FLOW_TOTAL)break;
    if(!completedFlowIndexes.has(fi))return false;
  }

  return true;
}

function activeCycleStartIndex(){
  for(
    let start=0;
    start<FLOW_TOTAL;
    start+=FLOWS_PER_CYCLE
  ){
    if(!cycleIsCompleteAtStart(start)){
      return start;
    }
  }

  // All hidden objectives complete: remain on the final cycle.
  return Math.max(0,FLOW_TOTAL-FLOWS_PER_CYCLE);
}

function activeCycleIndexes(){
  const start=activeCycleStartIndex();
  const result=[];

  for(let i=0;i<FLOWS_PER_CYCLE;i++){
    const fi=start+i;

function localDateKey(){
  const d=new Date();
  return [
    d.getFullYear(),
    String(d.getMonth()+1).padStart(2,"0"),
    String(d.getDate()).padStart(2,"0")
  ].join("-");
}

function hashDateKey(key){
  let h=2166136261;
  for(let i=0;i<key.length;i++){
    h^=key.charCodeAt(i);
    h=Math.imul(h,16777619);
  }
  return h>>>0;
}

}

function randomDailyFlowIndex(excludedCategory=""){
  let choices=selectableDailyFlowIndexes();

  if(excludedCategory && choices.length>1){
    const alternatives=choices.filter(
      index=>createFlow(index).category!==excludedCategory
    );
    if(alternatives.length)choices=alternatives;
  }

  let randomValue;

  try{
    const a=new Uint32Array(1);
    crypto.getRandomValues(a);
    randomValue=a[0]>>>0;
  }catch(e){
    randomValue=Math.floor(Math.random()*0xFFFFFFFF)>>>0;
  }

  const sequence=Math.max(0,Number(todayVector?.sequence)||0);

  const mixed=(
    randomValue ^
    prototypeDailySeed(localDateKey(),sequence) ^
    ((sequence+1)*2654435761)
  )>>>0;

  return choices[mixed%choices.length];
}

function persistentFlowIndex(){

    // During a replay, save the player's real progression
    // position rather than the older replayed Flow.
    if(replayReturnFlowIndex !== null){

        return replayReturnFlowIndex;
    }

    return currentFlowIndex;
}


function normalizeFlowProgress(){

    completedFlowIndexes = new Set(
        [...completedFlowIndexes]
            .map(Number)
            .filter(index=>
                Number.isInteger(index) &&
                index >= 0 &&
                index < FLOW_TOTAL
            )
    );

    completedFlows =
        completedFlowIndexes.size;

    completedFlows = Math.max(
        0,
        Math.min(
            FLOW_TOTAL,
            Number(completedFlows) || 0
        )
    );

    highestCompletedFlow = Math.max(
        0,
        Math.min(
            FLOW_TOTAL - 1,
            Number(highestCompletedFlow) || 0
        )
    );

    highestUnlockedBlock = Math.max(
        1,
        Math.min(
            TOTAL_FLOW_BLOCKS,
            Number(highestUnlockedBlock) || 1
        )
    );

    currentFlowIndex = Math.max(
        0,
        Math.min(
            FLOW_TOTAL - 1,
            Number(currentFlowIndex) || 0
        )
    );

    // Restore every fully completed 30-Flow block.
    let requiredUnlockedBlock = 1;

    for(
        let blockNumber = 1;
        blockNumber <= TOTAL_FLOW_BLOCKS;
        blockNumber++
    ){
        const start =
            (blockNumber - 1) *
            FLOWS_PER_BLOCK;

        const end = Math.min(
            start + FLOWS_PER_BLOCK,
            FLOW_TOTAL
        );

        let blockComplete = true;

        for(let index=start;index<end;index++){
            if(!completedFlowIndexes.has(index)){
                blockComplete = false;
                break;
            }
        }

        if(!blockComplete){
            break;
        }

        requiredUnlockedBlock =
            Math.min(
                TOTAL_FLOW_BLOCKS,
                blockNumber + 1
            );
    }

    highestUnlockedBlock = Math.max(
        highestUnlockedBlock,
        requiredUnlockedBlock
    );
}


function saveFlowProgress(){

    normalizeFlowProgress();

    const savedCurrentFlow =
        Math.max(
            0,
            Math.min(
                FLOW_TOTAL - 1,
                persistentFlowIndex()
            )
        );

    const saveData = {
        version:1,
        currentFlowIndex:savedCurrentFlow,
        completedFlows,
        completedFlowIndexes:
            [...completedFlowIndexes]
                .sort((a,b)=>a-b),
        highestCompletedFlow,
        highestUnlockedBlock,
        savedAt:Date.now()
    };

    // Individual keys remain for compatibility with
    // the progression system already in the game.
    localStorage.setItem(
        "shiftvixCurrentFlow",
        String(savedCurrentFlow)
    );

    localStorage.setItem(
        "shiftvixCompletedFlows",
        String(completedFlows)
    );

    localStorage.setItem(
        "shiftvixCompletedFlowIndexes",
        JSON.stringify(
            [...completedFlowIndexes]
                .sort((a,b)=>a-b)
        )
    );

    localStorage.setItem(
        "shiftvixHighestCompletedFlow",
        String(highestCompletedFlow)
    );

    localStorage.setItem(
        "shiftvixHighestUnlockedBlock",
        String(highestUnlockedBlock)
    );

    // Complete backup snapshot.
    localStorage.setItem(
        FLOW_SAVE_KEY,
        JSON.stringify(saveData)
    );
}


function repairFlowProgressFromBackup(){

    const rawSave =
        localStorage.getItem(FLOW_SAVE_KEY);

    if(!rawSave){

        normalizeFlowProgress();
        saveFlowProgress();
        return;
    }

    try{

        const saveData =
            JSON.parse(rawSave);

        if(
            saveData &&
            saveData.version === 1
        ){

            if(
                Array.isArray(
                    saveData.completedFlowIndexes
                )
            ){
                for(
                    const index of
                    saveData.completedFlowIndexes
                ){
                    const parsedIndex =
                        Number(index);

                    if(
                        Number.isInteger(parsedIndex) &&
                        parsedIndex >= 0 &&
                        parsedIndex < FLOW_TOTAL
                    ){
                        completedFlowIndexes.add(
                            parsedIndex
                        );
                    }
                }
            }

            completedFlows = Math.max(
                completedFlows,
                Number(
                    saveData.completedFlows
                ) || 0
            );

            // Older backups only stored a consecutive count.
            if(
                !Array.isArray(
                    saveData.completedFlowIndexes
                )
            ){
                for(
                    let index=0;
                    index<Math.min(
                        completedFlows,
                        FLOW_TOTAL
                    );
                    index++
                ){
                    completedFlowIndexes.add(index);
                }
            }

            completedFlows =
                completedFlowIndexes.size;

            highestCompletedFlow = Math.max(
                highestCompletedFlow,
                Number(
                    saveData.highestCompletedFlow
                ) || 0
            );

            highestUnlockedBlock = Math.max(
                highestUnlockedBlock,
                Number(
                    saveData.highestUnlockedBlock
                ) || 1
            );

            const individualCurrent =
                localStorage.getItem(
                    "shiftvixCurrentFlow"
                );

            if(individualCurrent === null){

                currentFlowIndex =
                    Number(
                        saveData.currentFlowIndex
                    ) || 0;
            }
        }

    }catch(error){

        console.warn(
            "SHIFTVIX save backup could not be read.",
            error
        );
    }

    normalizeFlowProgress();
    saveFlowProgress();
}

function blockIsComplete(blockNumber){

        blockNumber < 1 ||
        blockNumber > TOTAL_FLOW_BLOCKS
    ){
        return false;
    }

    const start =
        (blockNumber - 1) *
        FLOWS_PER_BLOCK;

    const end = Math.min(
        start + FLOWS_PER_BLOCK,
        FLOW_TOTAL
    );

    for(let index=start;index<end;index++){

        }
    }

    return true;

function nextUnfinishedUnlockedFlow(
    afterIndex=currentFlowIndex
){
    const indexes=activeCycleIndexes();

    if(!indexes.length){
      return Math.max(
        0,
        Math.min(FLOW_TOTAL-1,afterIndex)
      );
    }

    // First look after the currently played choice.
    const afterPos=indexes.indexOf(afterIndex);

    if(afterPos>=0){
      for(let step=1;step<=indexes.length;step++){
        const index=
          indexes[
            (afterPos+step)%indexes.length
          ];

        if(!completedFlowIndexes.has(index)){
          return index;
        }
      }
    }

    // After 6/6, activeCycleIndexes() automatically points at the next Cycle.
    for(const index of indexes){
      if(!completedFlowIndexes.has(index)){
        return index;
      }
    }

    return indexes[0];
}

function checkForBlockUnlock(completedFlowIndex){

    const completedBlock =
        blockForFlow(completedFlowIndex);

    if(!blockIsComplete(completedBlock)){

    const nextBlock =
        completedBlock + 1;

    if(

        nextBlock <= highestUnlockedBlock

function flowStrikeAllowance(index,category){
  const n=index+1;


  /*
    SHIFTVIX 2.10 — 300 FLOW DIFFICULTY PHILOSOPHY

    FLOWS   1–30   : teach success — no strike restrictions.
    FLOWS  31–100  : light pressure — occasional 2-strike limits.
    FLOWS 101–200  : moderate pressure — 2-strike limits plus rare 1-strike limits.
    FLOWS 201–300  : advanced pressure — more frequent limits, but NEVER perfection.

    Long-duration COLLECT and TRAVEL objectives remain more forgiving
    because the player is exposed to more VOID attacks.
  */

  if(n<=30)return null;

  const longObjective=
    category==="COLLECT" ||
    category==="TRAVEL" ||
    category==="RINGS" ||
    category==="SHIFT" ||
    category==="WARP" ||
    category==="BREAK" ||
    category==="DRIFT";

  if(n<=100){
    return ((n-31)%6===0)?2:null;
  }

  if(n<=200){
    if(!longObjective && (n-101)%10===0)return 1;
    if((n-101)%5===0)return 2;
    return null;
  }

  if(!longObjective && (n-201)%8===0)return 1;
  if((n-201)%4===0)return 2;

  return null;
}

function applyFlowStrikeAllowance(flow,index){
  const maxStrikes=flowStrikeAllowance(index,flow.category);

  if(maxStrikes===null){
    return flow;
  }

  return {
    ...flow,
    maxFlowStrikes:maxStrikes
  };
}

function createFlow(index){
  const n=index+1;
  const category=flowCategoryForIndex(index);
  const categoryStep=Math.floor(index/8); // eight permanent Flow families
  const name="CURRENT FLOW";

  /*
    SHIFTVIX 2.19 — THE SIX FLOW SYSTEM
    300 Flows = 50 of each:

    COLLECT = collection
    TRAVEL  = endurance / distance
    SCORE   = performance / value
    RINGS   = accuracy / navigation
    SHIFT   = agility / lane arrival
    WARP    = acceleration / Warp activation

    REACH / LEVEL has been removed as an objective family.
    Level still exists visually in the game world, but is no longer a Flow target.
  */

  let flow;

  if(category==="COLLECT"){
    const variant=categoryStep%4;

    if(variant===0 || variant===3){
      const target=600+categoryStep*70;

      flow={
        id:`collect_${n}`,
        name,
        category,
        label:`COLLECT ${target.toLocaleString()} ORBS`,
        target,
        metric:"orbs"
      };

      return applyFlowStrikeAllowance(flow,index);
    }

    const colors=["BLUE","GREEN","PURPLE","ORANGE","RED"];
    const color=colors[categoryStep%colors.length];

    const base={
      BLUE:500,
      GREEN:450,
      PURPLE:320,
      ORANGE:200,
      RED:120
    }[color];

    const growth={
      BLUE:32,
      GREEN:29,
      PURPLE:21,
      ORANGE:14,
      RED:10
    }[color];

    const target=base+categoryStep*growth;

    flow={
      id:`collect_${color.toLowerCase()}_${n}`,
      name,
      category,
      label:`COLLECT ${target.toLocaleString()} ${color} ORBS`,
      target,
      metric:"color",
      color
    };

    return applyFlowStrikeAllowance(flow,index);
  }

  if(category==="TRAVEL"){
    const target=1500+categoryStep*350;

    flow={
      id:`travel_${n}`,
      name,
      category,
      label:`TRAVEL ${target.toLocaleString()}m`,
      target,
      metric:"distance"
    };

    return applyFlowStrikeAllowance(flow,index);
  }

  if(category==="SCORE"){
    const target=15000+categoryStep*5200;

    flow={
      id:`score_${n}`,
      name,
      category,
      label:`SCORE ${target.toLocaleString()} POINTS`,
      target,
      metric:"score"
    };

    return applyFlowStrikeAllowance(flow,index);
  }

  if(category==="RINGS"){
    const target=Math.min(
      80,
      20+Math.floor(categoryStep*1.3)
    );

    flow={
      id:`rings_${n}`,
      name,
      category,
      label:`FLY THROUGH ${target.toLocaleString()} GOLD RINGS`,
      target,
      metric:"rings"
    };

    return applyFlowStrikeAllowance(flow,index);
  }

  if(category==="SHIFT"){
    /*
      SHIFTVIX 2.41 — SHIFT REBALANCE

      Empty space is now safe, so SHIFT needs more endurance to retain
      its identity as the agility / train-connection Flow.

      2.40: 50 + categoryStep*5, capped at 200.
      2.41: 100 + categoryStep*10, capped at 400.

      A SHIFT still counts ONLY after a real train-to-train reconnection.
    */
    const target=Math.min(
      400,
      100 + categoryStep*10
    );

    flow={
      id:`shift_${n}`,
      name,
      category,
      label:`SHIFT ${target.toLocaleString()} LANES`,
      target,
      metric:"shift"
    };

    return applyFlowStrikeAllowance(flow,index);

function challengeBaseValue(ch){
  if(!challengeStart)return 0;

  const totalOrbs=objectiveOrbsCollected;
  const colorOrbs=Math.max(
    0,
    (tierCounts[ch.color]||0)-
    (challengeStart.tierCounts[ch.color]||0)
  );

  if(ch.metric==="level")return level;
  if(ch.metric==="orbs")return totalOrbs;
  if(ch.metric==="color")return colorOrbs;
  if(ch.metric==="score")return Math.max(0,score-challengeStart.score);
  if(ch.metric==="distance")return Math.max(0,distance-challengeStart.distance);
  if(ch.metric==="rings")return Math.max(0,goldRingsPassed-(challengeStart.rings||0));
  if(ch.metric==="shift")return Math.max(0,shiftCountRun-(challengeStart.shifts||0));
  if(ch.metric==="warp")return Math.max(0,warpCollectedThisRun-(challengeStart.warps||0));
  if(ch.metric==="break")return Math.max(0,breakVoidsDestroyed-(challengeStart.breaks||0));
  if(ch.metric==="drift")return Math.max(0,driftDistance-(challengeStart.drift||0));

  return 0;
}

function flowStrikesUsed(){
  if(!challengeStart)return 0;
  return Math.max(0,strikes-challengeStart.strikes);
}

function flowConditionMet(ch){
  if(!Number.isFinite(ch?.maxFlowStrikes))return true;
  return flowStrikesUsed()<=ch.maxFlowStrikes;
}

function flowConditionText(ch){
  if(!Number.isFinite(ch?.maxFlowStrikes))return "";

  // Player starts with 3 lives.
  // maxFlowStrikes 1 = must finish with at least 2 lives.
  // maxFlowStrikes 2 = must finish with at least 1 life.
  const livesRequired=Math.max(1,3-ch.maxFlowStrikes);

  return livesRequired===1
    ? "FINISH WITH 1+ LIFE"
    : `FINISH WITH ${livesRequired}+ LIVES`;
}

function challengeValue(ch){
  // Always return the real objective progress.
  // Life restrictions are checked separately so the HUD never jumps back to 0.
  return challengeBaseValue(ch);
}

  updateFlowHeading();

    raw>=activeChallenge.target &&
    flowConditionMet(activeChallenge)

function loadSelectedFlow(
    flowIndex,
    {
        replay=false,
        announce=true
    }={}
){

    if(
        !Number.isInteger(flowIndex) ||
        flowIndex < 0 ||
        flowIndex >= FLOW_TOTAL ||
        !isFlowUnlocked(flowIndex)
    ){
        trackGame("locked_flow_selected",{
            selected_flow:
                Number.isFinite(flowIndex)
                    ? flowIndex + 1
                    : -1,
            completed_flows:
                completedFlows,
            unlocked_block:
                highestUnlockedBlock
        });

        showModeBanner("FLOW LOCKED");
        return false;
    }

    if(challengeAdvanceTimer){
        clearTimeout(
            challengeAdvanceTimer
        );
        challengeAdvanceTimer = null;
    }

    if(replay){
        // A completed Flow is practice. Return to the
        // player's real active Flow when practice ends.
        if(replayReturnFlowIndex === null){
            replayReturnFlowIndex =
                currentFlowIndex;
        }
    }else{
        // Selecting an unfinished unlocked Flow becomes
        // the player's real active progression choice.
        replayReturnFlowIndex = null;
    }

    currentFlowIndex = flowIndex;

    objectiveOrbsCollected = 0;

    activeChallenge =
        createFlow(currentFlowIndex);

    challengeStart = {
        found:foundCount,
        score,
        distance,
        strikes,
        rings:goldRingsPassed,
        shifts:shiftCountRun,
        warps:warpCollectedThisRun,
        breaks:breakVoidsDestroyed,
        drift:driftDistance,
        tierCounts:{...tierCounts}
    };

    environmentEngine.resetForFlow({
        announce:false
    });

    saveFlowProgress();
    updateChallenge();

    trackGame(
        replay
            ? "flow_replay_started"
            : "flow_selected",
        {
            selected_flow:
                currentFlowIndex + 1,
            return_flow:
                replay &&
                replayReturnFlowIndex !== null
                    ? replayReturnFlowIndex + 1
                    : null,
            environment:
                environmentEngine.current.id,
            flow_stage:
                flowStageFor(
                    currentFlowIndex
                ).name
        }
    );

    closeFlowArchive();

    if(announce){
        showModeBanner(
          `${
            createFlow(currentFlowIndex).category
          } SELECTED`
        );
    }

    return true;
}

function resumeMusicAfterPause(){

  if(audioCtx && audioCtx.state==="suspended"){

  }
  if(musicStarted && !musicTimer){
    nextNoteTime = Math.max(nextNoteTime, audioCtx.currentTime + 0.035);
    nextDrumTime = Math.max(nextDrumTime, audioCtx.currentTime + 0.05);

function makeFluxDustField(){
    const positions=new Float32Array(FLUX_DUST_COUNT*2*3);
    const colors=new Float32Array(FLUX_DUST_COUNT*2*3);
    const anchors=new Float32Array(FLUX_DUST_COUNT*2);

    const palette=[
        new THREE.Color(0xffffff),
        new THREE.Color(0xbfefff),
        new THREE.Color(0x75ddff),
        new THREE.Color(0xffd36a),
        new THREE.Color(0xc58cff)
    ];

    for(let i=0;i<FLUX_DUST_COUNT;i++){
        let x=(Math.random()*2-1)*250;
        let y=(Math.random()*2-1)*175;

        // Keep the center gameplay corridor calmer.
        const r=Math.hypot(x,y);
        if(r<62){
            const a=Math.atan2(y||1,x||1);
            const pushed=62+Math.random()*45;
            x=Math.cos(a)*pushed;
            y=Math.sin(a)*pushed;
        }

        const z=-120-Math.random()*1050;
        anchors[i*2]=x;
        anchors[i*2+1]=y;

        const p=i*6;
        positions[p]=x;positions[p+1]=y;positions[p+2]=z;
        positions[p+3]=x;positions[p+4]=y;positions[p+5]=z-4;

            .clone()
            .multiplyScalar(.58+Math.random()*.32);

function updateFluxDust(dt){
    if(!fluxDust)return;

    const reducedMotion=
        window.matchMedia &&
        window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    const targetPower=
        reducedMotion ? 0 :
        THREE.MathUtils.clamp(fluxBoostAmount,0,1);

    // Fast attack, gentle release. No blinking or pulsing.
    const response=
        1-Math.exp(-dt*(targetPower>fluxDustVisualPower?5.8:2.1));

    fluxDustVisualPower+=
        (targetPower-fluxDustVisualPower)*response;

    const visualPower=
        THREE.MathUtils.clamp(fluxDustVisualPower,0,1);

    fluxDust.material.opacity=
        THREE.MathUtils.lerp(
            0,
            FLUX_DUST_MAX_OPACITY,
            visualPower
        );

    const streakLength=
        THREE.MathUtils.lerp(
            4,
            FLUX_DUST_MAX_STREAK,
            visualPower
        );

    const speedMult=
        THREE.MathUtils.lerp(
            1.05,
            FLUX_DUST_MAX_SPEED_MULT,
            visualPower
        );

    const pos=fluxDust.geometry.attributes.position;
    const anchors=fluxDust.userData.anchors;

    // Hard cap the visual travel rate even if gameplay speed rises later.
    const cappedSpeed=Math.min(speed,330);

    for(let i=0;i<FLUX_DUST_COUNT;i++){
        const p=i*6;
        const x=anchors[i*2];
        const y=anchors[i*2+1];

        let z=pos.array[p+2];
        z+=cappedSpeed*dt*speedMult;

        if(z>82){
            z=-1050-Math.random()*280;
        }

        // Two points at different Z values form a short radial perspective streak.
        pos.array[p]=x;
        pos.array[p+1]=y;
        pos.array[p+2]=z;

        pos.array[p+3]=x;
        pos.array[p+4]=y;
        pos.array[p+5]=z-streakLength;
    }

    pos.needsUpdate=true;
}

function chooseTier(){

    /*
    Standard distribution:

    WHITE  = 26%
    BLUE   = 22%
    GREEN  = 18%
    PURPLE = 14%
    ORANGE = 11%
    RED    = 9%
    */

    const standardWeights={
        WHITE:26,
        BLUE:22,
        GREEN:18,
        PURPLE:14,
        ORANGE:11,
        RED:9
    };

    const weights={...standardWeights};

    /*
    When the current Flow requires a specific color,
    increase that color's appearance without making
    every train that color.
    */

    const requiredColor=
        activeChallenge &&
        activeChallenge.metric==="color"
            ? activeChallenge.color
            : null;

    if(requiredColor && weights[requiredColor]!==undefined){

        const boost={
            BLUE:10,
            GREEN:11,
            PURPLE:12,
            ORANGE:14,
            RED:16
        }[requiredColor] || 10;

        weights[requiredColor]+=boost;
    }

    const total=
        weights.WHITE+
        weights.BLUE+
        weights.GREEN+
        weights.PURPLE+
        weights.ORANGE+
        weights.RED;

    let roll=Math.random()*total;

    for(let i=0;i<TIERS.length;i++){

        const tier=TIERS[i];

        roll-=weights[tier.name];

        if(roll<=0){
            return tier;
        }
    }

    return TIERS[0];
}

// =========================
// SHIFTVIX WARP ORB — REACH POWER
// Tier I +500m / Tier II +1000m / Tier III +1500m.
// This is an instantaneous spatial jump, not a speed boost.
// =========================

// =========================
// SHIFTVIX 2.4 — VOID HAZARD
// A black O-ring threat that uses the same 3x3 lane language.
// Touching one costs one strike.
// =========================
let voidSpawnCooldown=1.25;
let voidCountRun=0;


function nearestRingLaneIndex(value,laneValues){
  let best=0;
  let bestDistance=Infinity;
  laneValues.forEach((laneValue,index)=>{
    const d=Math.abs(value-laneValue);
    if(d<bestDistance){
      bestDistance=d;
      best=index;
    }
  });
  return best;
}

function ringLaneDistance(a,b){
  if(!a||!b)return 0;
  return Math.max(Math.abs(a.x-b.x),Math.abs(a.y-b.y));
}

function chooseReachableGoldRingLane(reason="ambient"){
  const playerLane={
    x:nearestRingLaneIndex(playerX,LANE_X),
    y:nearestRingLaneIndex(playerY,LANE_Y)
  };

  // A sequence continues from the previous ring; a single starts from the
  // player's present lane. This turns rings into a readable flight path.
  const anchor=(
    reason==="ring_sequence" && goldRingSequenceAnchor
  ) ? goldRingSequenceAnchor : playerLane;

  const candidates=[];
  for(let y=0;y<3;y++){
    for(let x=0;x<3;x++){
      const laneX=LANE_X[x];
      const laneY=LANE_Y[y];

      // Never deliberately place a required ring into an active VOID corridor.
      const blocked=beacons.some(b=>
        b?.userData?.isVoid &&
        b.userData.state==="active" &&
        Math.abs(b.userData.roadX-laneX)<1 &&
        Math.abs(b.userData.roadY-laneY)<1 &&
        b.position.z<(FAR_Z+350)
      );
      if(blocked)continue;

      const lane={x,y};
      const fromAnchor=ringLaneDistance(lane,anchor);
      const fromPlayer=ringLaneDistance(lane,playerLane);

      // No dead-space / impossible objective rings: even the rare challenge
      // placement must remain within two lane steps of the player's position.
      if(fromPlayer>2)continue;

      candidates.push({x,y,fromAnchor,fromPlayer});
    }
  }

  if(!candidates.length)return null;

  const ringObjective=activeChallenge?.metric==="rings";
  const roll=Math.random();

  // 70% readable: same lane or one neighboring lane.
  // 20% steering: one lane step from the flight-path anchor.
  // 10% challenge: up to two lane steps, but still verified reachable.
  let minStep=0,maxStep=1;
  if(ringObjective){
    if(roll<.70){ minStep=0; maxStep=1; }
    else if(roll<.90){ minStep=1; maxStep=1; }
    else { minStep=1; maxStep=2; }
  }else{
    // Ambient rings stay especially friendly because they are visual bonuses.
    minStep=0; maxStep=1;
  }

  let pool=candidates.filter(c=>
    c.fromAnchor>=minStep && c.fromAnchor<=maxStep
  );

  if(!pool.length){
    pool=candidates
      .slice()
      .sort((a,b)=>a.fromAnchor-b.fromAnchor)
      .slice(0,Math.min(4,candidates.length));
  }

  // Avoid repeating the exact same lane when another equally safe choice exists.
  if(goldRingLastLane && pool.length>1){
    const varied=pool.filter(c=>
      c.x!==goldRingLastLane.x || c.y!==goldRingLastLane.y
    );
    if(varied.length)pool=varied;
  }

  return pool[Math.floor(Math.random()*pool.length)];
}

function safeRingRouteCandidates(){
  const playerLane={
    x:nearestRingLaneIndex(playerX,LANE_X),
    y:nearestRingLaneIndex(playerY,LANE_Y)
  };

  const candidates=[];

  for(let y=0;y<3;y++){
    for(let x=0;x<3;x++){
      const laneXValue=LANE_X[x];
      const laneYValue=LANE_Y[y];

      const blocked=beacons.some(b=>
        b?.userData?.isVoid &&
        b.userData.state==="active" &&
        Math.abs(b.userData.roadX-laneXValue)<1 &&
        Math.abs(b.userData.roadY-laneYValue)<1 &&
        b.position.z<(FAR_Z+350)
      );

      if(blocked)continue;

      const fromPlayer=ringLaneDistance({x,y},playerLane);

      // Keep every offered route achievable.
      if(fromPlayer>3)continue;

      candidates.push({
        x,
        y,
        fromPlayer
      });
    }
  }

  return candidates;
}

function spawnGoldRingRouteChoice(){
  if(activeChallenge?.metric!=="rings")return false;

  const activeRings=beacons.filter(
    b=>b?.userData?.isGoldRing &&
       b.userData.state==="active"
  ).length;

  if(activeRings>1)return false;

  const candidates=safeRingRouteCandidates();
  if(candidates.length<2)return false;

  const byDistance=(a,b)=>a.fromPlayer-b.fromPlayer;
  const sorted=candidates.slice().sort(byDistance);

  const picked=[];

  // EASY: nearest readable route.
  picked.push(sorted[0]);

  // MEDIUM: a different lane around the middle of the safe pool.
  const mediumPool=sorted.filter(c=>
    !picked.some(p=>p.x===c.x&&p.y===c.y) &&
    c.fromPlayer>=1
  );

  if(mediumPool.length){
    picked.push(
      mediumPool[
        Math.floor(mediumPool.length/2)
      ]
    );
  }

  // HARD: furthest still-reachable safe lane.
  const hardPool=sorted
    .slice()
    .reverse()
    .filter(c=>
      !picked.some(p=>p.x===c.x&&p.y===c.y)
    );

  if(hardPool.length){
    picked.push(hardPool[0]);
  }

  // Fall back to any remaining safe lane so a volley can still show 2–3 options.
  for(const candidate of sorted){
    if(picked.length>=3)break;
    if(!picked.some(p=>p.x===candidate.x&&p.y===candidate.y)){
      picked.push(candidate);
    }
  }

  const zOffsets=[0,-62,-124];
  let spawned=0;

  picked.slice(0,3).forEach((lane,i)=>{
    if(
      makeGoldRing(
        "ring_route_choice",
        {x:lane.x,y:lane.y},
        zOffsets[i]
      )
    ){
      spawned++;
    }
  });

function makeVoidHazard(reason="normal",forcedLane=null,options={}){
  const activeVoids=beacons.filter(
    b=>b?.userData?.isVoid && b.userData.state==="active"
  ).length;

  // At most six Void bodies can be active at once.
  if(activeVoids>=6)return false;

  const isBreakTarget=!!options.breakTarget;

  trainId++;

  let xIndex;
  let yIndex;

  if(forcedLane && Number.isInteger(forcedLane.x) && Number.isInteger(forcedLane.y)){
    xIndex=Math.max(0,Math.min(2,forcedLane.x));
    yIndex=Math.max(0,Math.min(2,forcedLane.y));
  }else{
    xIndex=Math.floor(Math.random()*3);
    yIndex=Math.floor(Math.random()*3);
  }

  const x=LANE_X[xIndex];
  const y=LANE_Y[yIndex];

  const group=new THREE.Group();

  /*
    SOLID BLACK CENTER = lethal Void.
    HOLLOW CYAN CENTER = BREAK target.
  */
  const core=isBreakTarget
    ? new THREE.Mesh(
        new THREE.TorusGeometry(
          5.05,
          .72,
          12,
          56
        ),
        new THREE.MeshBasicMaterial({
          color:0x8ffcff,
          transparent:true,
          opacity:.98,
          blending:THREE.AdditiveBlending,
          depthWrite:false
        })
      )
    : new THREE.Mesh(
        new THREE.SphereGeometry(7.45,28,28),
        new THREE.MeshBasicMaterial({
          color:0x000000,
          transparent:false,
          opacity:1,
          depthWrite:false
        })
      );

  // Fiery orange ring.
  const corona=new THREE.Mesh(
    new THREE.TorusGeometry(8.30,1.30,12,56),
    new THREE.MeshBasicMaterial({
      color:0xff7100,
      transparent:true,
      opacity:.94,
      blending:THREE.AdditiveBlending,
      depthWrite:false
    })
  );

  // Bright gold strike edge.
  const ring=new THREE.Mesh(
    new THREE.TorusGeometry(8.45,.60,10,56),
    new THREE.MeshBasicMaterial({
      color:0xffd34f,
      transparent:true,
      opacity:.98,
      blending:THREE.AdditiveBlending,
      depthWrite:false
    })
  );

  // Red-orange heat ring.
  const heat=new THREE.Mesh(
    new THREE.TorusGeometry(9.30,1.20,10,52),
    new THREE.MeshBasicMaterial({
      color:0xff2800,
      transparent:true,
      opacity:.32,
      blending:THREE.AdditiveBlending,
      depthWrite:false
    })
  );

  // Soft outer aura.
  const aura=new THREE.Mesh(
    new THREE.TorusGeometry(10.55,1.15,8,48),
    new THREE.MeshBasicMaterial({
      color:0xff4b00,
      transparent:true,
      opacity:.13,
      blending:THREE.AdditiveBlending,
      depthWrite:false
    })
  );

  // SHIFTVIX 2.9.2 — UNIFORM ALTERNATING SPIKES
  // Big spike, little spike, big spike, little spike...
  // Every wide base is anchored to the outside of the fiery ring,
  // and every sharp tip points AWAY from the meteor center.
  const spikes=new THREE.Group();

  const bigSpikeCount=8;
  const totalSpikeCount=bigSpikeCount*2;

  // Ring edge is ~9.3 units from center.
  // ConeGeometry is centered on its local Y axis, so the spike center must
  // sit half its length beyond the attachment point for the base to touch
  // the ring cleanly.
  const attachRadius=9.15;

  for(let i=0;i<totalSpikeCount;i++){
    const a=(i/totalSpikeCount)*Math.PI*2;
    const isBig=(i%2===0);

    const spikeLength=isBig?5.6:3.5;
    const spikeBaseRadius=isBig?1.22:.78;

    const spike=new THREE.Mesh(
      new THREE.ConeGeometry(
        spikeBaseRadius,
        spikeLength,
        12,
        1,
        false
      ),
      new THREE.MeshBasicMaterial({
        color:isBig?0xff1e20:0xff3a28,
        transparent:true,
        opacity:.98,
        blending:THREE.AdditiveBlending,
        depthWrite:false
      })
    );

    /*
      ConeGeometry points along local +Y.
      Rotate +Y so the cone tip points radially OUTWARD.
      Because the geometry is centered, place the cone center at:
      ring attachment radius + half spike length.
      That puts the thick base directly against the ring.
    */
    spike.rotation.z = a - Math.PI/2;

    const centerRadius=attachRadius + spikeLength*.5;

    spike.position.set(
      Math.cos(a)*centerRadius,
      Math.sin(a)*centerRadius,
      0
    );

    spikes.add(spike);
  }

const breakHalo=isBreakTarget
  ? new THREE.Mesh(
      new THREE.TorusGeometry(
        5.10,
        1.45,
        12,
        56
      ),
      new THREE.MeshBasicMaterial({
        color:0x35f2ff,
        transparent:true,
        opacity:.26,
        blending:THREE.AdditiveBlending,
        depthWrite:false
      })
    )
  : null;

group.add(aura);
  group.add(heat);
  group.add(spikes);
  group.add(corona);
  group.add(ring);
  if(breakHalo)group.add(breakHalo);
  group.add(core);

  group.position.set(x,y,FAR_Z+135);
  group.scale.setScalar(introScale);

  group.userData={
    core,
    corona,
    heat,
    ring,
    aura,
    glow:aura,
    spikes,
    breakHalo,
    isVoid:true,
    isBreakTarget,
    state:"active",
    fade:1,
    train:trainId,
    speedMult:1.78,
    roadX:x,
    roadY:y,
    voidReason:reason,
    voidBornAt:performance.now(),
    meteorPhase:Math.random()*Math.PI*2,
    meteorLaneX:xIndex,
    meteorLaneY:yIndex
  };

  scene.add(group);
  beacons.push(group);
  voidCountRun++;

  trackGame("void_spawned",{
    trigger_reason:reason,
    distance:Math.floor(distance),
    level,
    flow_number:currentFlowIndex+1,
    lane_x:xIndex,
    lane_y:yIndex,
    void_count_run:voidCountRun
  });

  return true;
}

function spawnVoidVolley(reason="normal"){
  const allLanes=[];

  for(let y=0;y<3;y++){
    for(let x=0;x<3;x++){
      allLanes.push({x,y});
    }
  }

  // Unique lanes inside each volley.
  for(let i=allLanes.length-1;i>0;i--){
    const j=Math.floor(
      Math.random()*(i+1)
    );

    [
      allLanes[i],
      allLanes[j]
    ]=[
      allLanes[j],
      allLanes[i]
    ];
  }

  let count=1;

  if(reason!=="tutorial"){
    /*
      VOID PRESSURE 2.0

      Minimum: 2 hazards.
      Maximum: 6 hazards.

      Because SHIFTVIX has nine lanes, six is the hard cap:
      every single volley always leaves at least three immediate
      escape lanes.

      Early flight mostly produces 2–3.
      As distance/level rise, 4–6 become more common without
      suddenly turning the opening game into a wall.
    */
    const pressure=
      THREE.MathUtils.clamp(
        (
          Math.max(0,distance-55) /
          5000
        ) +
        (
          Math.max(0,level-1) *
          .018
        ),
        0,
        1
      );

    const r=Math.random();

    const sixThreshold=
      .985-pressure*.105;

    const fiveThreshold=
      .94-pressure*.145;

    const fourThreshold=
      .78-pressure*.17;

    const threeThreshold=
      .38-pressure*.08;

    if(r>=sixThreshold){
      count=6;
    }else if(r>=fiveThreshold){
      count=5;
    }else if(r>=fourThreshold){
      count=4;
    }else if(r>=threeThreshold){
      count=3;
    }else{
      count=2;
    }
  }

  // Absolute readability/safety cap.
  count=Math.max(
    1,
    Math.min(
      reason==="tutorial"?1:6,
      count
    )
  );

  let spawned=0;

  const breakFlow=
    activeChallenge?.metric==="break";

  const breakTargetCount=
    breakFlow
      ? (
          count>=4 && Math.random()<.58
            ? 2
            : 1
        )
      : 0;

  for(let i=0;i<count;i++){
    if(
      makeVoidHazard(
        i===0
          ? reason
          : `meteor_group_${count}`,
        allLanes[i],
        {
          breakTarget:
            breakFlow &&
            i<breakTargetCount
        }
      )
    ){
      spawned++;
    }
  }

  return spawned;
}

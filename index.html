<title>AKI 8.0 — Shared Screen</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#020304}
body{overflow:hidden;font-family:system-ui,-apple-system,sans-serif}
.presence{position:relative;width:100%;height:100dvh;overflow:hidden;isolation:isolate;background:radial-gradient(circle at 50% 47%,#0e1420 0,#070a10 42%,#030507 76%,#020304 100%);cursor:default;-webkit-tap-highlight-color:transparent}
.ambient{position:absolute;inset:-18%;background:radial-gradient(circle at 50% 48%,rgba(20,82,145,.10) 0 18%,rgba(72,30,112,.07) 34%,rgba(8,10,16,.03) 54%,transparent 72%);filter:blur(48px);animation:ambient 14s ease-in-out infinite}
.orb{position:absolute;left:50%;top:48%;width:min(88vw,700px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:#010207;box-shadow:0 0 24px rgba(93,218,255,.14),0 0 70px rgba(65,126,255,.15),0 0 124px rgba(150,53,255,.10);animation:orbBreath 8.4s ease-in-out infinite;transition:filter .9s ease,transform .9s ease}
.halo,.rim,.oil,.oil2,.core{position:absolute;border-radius:50%;pointer-events:none}
.halo{inset:-7%;background:conic-gradient(from 205deg,rgba(16,199,255,0),rgba(26,195,255,.34),rgba(83,77,255,.34),rgba(216,65,255,.28),rgba(255,104,178,.22),rgba(255,159,93,.18),rgba(34,210,255,.22),rgba(16,199,255,0));filter:blur(30px);opacity:.68;animation:oilTurn 34s linear infinite}
.rim{inset:-1.2%;background:conic-gradient(from 220deg,rgba(255,127,194,.92),rgba(161,70,255,.94),rgba(75,116,255,.97),rgba(79,231,255,.98),rgba(225,247,255,.93),rgba(75,207,255,.94),rgba(110,73,255,.92),rgba(231,70,255,.92),rgba(255,149,103,.88),rgba(255,127,194,.92));filter:blur(3.8px) saturate(1.28);opacity:.91;animation:oilTurn 31s linear infinite}
.rim:after{content:"";position:absolute;inset:1.9%;border-radius:50%;background:rgba(1,2,7,.93);filter:blur(3px)}
.oil{inset:1.2%;background:conic-gradient(from 18deg,transparent 0 4%,rgba(35,212,255,.88) 10%,rgba(56,113,255,.74) 19%,rgba(172,60,255,.84) 30%,rgba(255,65,189,.72) 39%,rgba(255,156,92,.66) 47%,transparent 55% 65%,rgba(22,207,255,.84) 74%,rgba(100,73,255,.78) 84%,rgba(228,75,255,.67) 91%,transparent 98%);filter:blur(12px) saturate(1.45);opacity:.92;animation:oilTurn 28s linear infinite}
.oil:after{content:"";position:absolute;inset:8.5%;border-radius:50%;background:rgba(1,2,7,.91);filter:blur(11px)}
.oil2{inset:4%;background:conic-gradient(from 160deg,transparent 0 10%,rgba(255,83,190,.52) 19%,rgba(115,65,255,.66) 31%,rgba(30,204,255,.70) 43%,transparent 55% 70%,rgba(255,135,82,.43) 80%,rgba(130,64,255,.54) 91%,transparent);filter:blur(20px) saturate(1.38);opacity:.68;animation:oilTurn2 38s linear infinite}
.oil2:after{content:"";position:absolute;inset:13.5%;border-radius:50%;background:rgba(1,2,7,.88);filter:blur(14px)}
/* 4.5: center is no longer a crisp black disk. Its edge feathers into the torus. */
.core{inset:11.5%;background:radial-gradient(circle at 44% 38%,rgba(9,24,44,.28) 0%,rgba(1,2,7,.985) 55%,rgba(1,2,7,.96) 78%,rgba(1,2,7,.82) 87%,rgba(1,2,7,.48) 94%,rgba(1,2,7,.12) 98%,transparent 100%);box-shadow:inset 0 0 88px rgba(46,112,190,.08);filter:blur(2.4px)}
.mark{position:absolute;z-index:8;left:50%;top:48%;transform:translate(-50%,-50%);width:min(48vw,360px);height:auto;opacity:.23;filter:blur(.32px) drop-shadow(0 0 4px rgba(154,216,255,.05));transition:opacity .55s ease,filter .55s ease;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.mark path{fill:none;stroke:rgba(222,231,241,.76);stroke-width:1.02;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.mark.on{opacity:.72;filter:blur(.28px) drop-shadow(0 0 7px rgba(154,216,255,.16))}
.mark.starting{opacity:.47}
.mark.error{opacity:.16}
/* AKI 4.7: constant presence. Conversation state never changes the torus. */
@keyframes ambient{0%,100%{transform:scale(.98);opacity:.58}50%{transform:scale(1.025);opacity:.78}}
@keyframes orbBreath{0%,100%{transform:translate(-50%,-50%) scale(.982)}50%{transform:translate(-50%,-50%) scale(1.012)}}
@keyframes oilTurn{to{transform:rotate(360deg)}}@keyframes oilTurn2{to{transform:rotate(-360deg)}}
@media(max-width:600px){.orb{width:88vw}.mark{width:47vw}}
@media(prefers-reduced-motion:reduce){.ambient,.orb,.halo,.rim,.oil,.oil2{animation:none!important}}

#borrowedView{
 position:fixed;inset:0;width:100%;height:100%;object-fit:cover;
 background:#000;z-index:0;display:none;pointer-events:none;
}
#borrowedView.active{display:block}
#borrowedShade{
 position:fixed;inset:0;z-index:1;pointer-events:none;display:none;
 background:radial-gradient(circle at center,rgba(0,0,0,.02),rgba(0,0,0,.16));
}
#borrowedShade.active{display:block}

body.borrowed-eyes-live #borrowedView{display:block}
body.borrowed-eyes-live #borrowedShade{display:block}
body.borrowed-eyes-live .aki,
body.borrowed-eyes-live #aki,
body.borrowed-eyes-live .orb,
body.borrowed-eyes-live #orb{
 position:relative;z-index:5;opacity:.76;
}
body.borrowed-eyes-live{cursor:pointer}
</style>

<style id="aki-icon-match">
/* 4.7 icon-match visual refinement */
.mark{
  border:0!important; outline:0!important; background:transparent!important;
  box-shadow:none!important; border-radius:50%!important;
  -webkit-tap-highlight-color:transparent!important;
}
.mark:focus,.mark:focus-visible,.mark:active{
  border:0!important; outline:0!important; background:transparent!important;
  box-shadow:none!important;
}
.mark.on{
  opacity:1!important;
  filter:drop-shadow(0 0 1px rgba(255,255,255,1))
         drop-shadow(0 0 4px rgba(190,235,255,.98))
         drop-shadow(0 0 10px rgba(55,190,255,.78))!important;
}
.mark.on path{
  stroke:#f8fdff!important; stroke-opacity:1!important;
  stroke-width:2.35!important; stroke-linecap:round!important; stroke-linejoin:round!important;
}
.rim,.oil,.oil2{
  filter:saturate(1.42) contrast(1.08) brightness(1.10)!important;
}
</style>

<body>
<video id="akiSharedScreen" playsinline muted style="position:fixed;inset:0;width:1px;height:1px;opacity:.001;pointer-events:none"></video>

<video id="borrowedView" playsinline muted></video><div id="borrowedShade"></div>

<main id="app" class="presence" aria-label="AKI">
  <div class="ambient"></div>
  <div class="orb"><div class="halo"></div><div class="rim"></div><div class="oil"></div><div class="oil2"></div><div class="core"></div></div>
  <svg id="akiButton" class="mark" viewBox="0 0 210 90" role="button" tabindex="0" aria-label="Turn AKI on" aria-pressed="false"><path d="M15 72 L45 18 L75 72 M95 18 L95 72 M96 48 L142 18 M96 48 L144 72 M172 18 L172 72"/></svg>
</main>
<script>
const akiSharedScreen=document.getElementById('akiSharedScreen');
let sharedVision={stream:null,active:false,busy:false,captureSeq:0};

function sendSharedVisionTruth(text){
 sendLiveUserText('SHARED VISION HARDWARE TRUTH — '+text);
}

async function startSharedVision(){
 if(sharedVision.active)return true;
 if(!navigator.mediaDevices?.getDisplayMedia){
  sendSharedVisionTruth('Screen sharing is not available in this browser. Do not claim you can see the screen.');
  return false;
 }
 try{
  // Must be initiated from a real user gesture; browser/OS chooses what may be shared.
  const stream=await navigator.mediaDevices.getDisplayMedia({video:true,audio:false});
  const track=stream.getVideoTracks()[0];
  if(!track)throw new Error('No shared video track');
  sharedVision.stream=stream;
  akiSharedScreen.srcObject=stream;
  await akiSharedScreen.play();
  await new Promise((resolve,reject)=>{
   if(akiSharedScreen.videoWidth>1)return resolve();
   const to=setTimeout(()=>reject(new Error('Shared stream did not become ready')),5000);
   akiSharedScreen.addEventListener('loadedmetadata',()=>{clearTimeout(to);resolve()},{once:true});
  });
  sharedVision.active=true;
  track.addEventListener('ended',()=>{
   sharedVision.active=false;sharedVision.stream=null;akiSharedScreen.srcObject=null;
   sendSharedVisionTruth('Screen sharing has ended. You cannot currently see the screen.');
  },{once:true});
  console.log('[AKI 8.0 SHARED VISION ACTIVE]',track.getSettings?.()||{});
  sendSharedVisionTruth('A user-authorized screen share is active. Do not describe it continuously. Wait for the exact capture command "capture this".');
  return true;
 }catch(e){
  console.error('[AKI 8.0 SHARE FAILED]',e?.name,e?.message);
  sendSharedVisionTruth('Screen sharing did not start. You cannot see the screen.');
  return false;
 }
}

async function captureSharedVision(){
 if(sharedVision.busy)return;
 sharedVision.busy=true;
 const captureId=++sharedVision.captureSeq;
 try{
  const track=sharedVision.stream?.getVideoTracks?.()[0];
  if(!sharedVision.active||!track||track.readyState!=='live')throw new Error('No active shared screen');
  const w=akiSharedScreen.videoWidth,h=akiSharedScreen.videoHeight;
  if(w<2||h<2)throw new Error('Shared screen has no current frame');
  const scale=Math.min(1,1400/Math.max(w,h));
  const c=document.createElement('canvas');
  c.width=Math.max(2,Math.round(w*scale));c.height=Math.max(2,Math.round(h*scale));
  c.getContext('2d').drawImage(akiSharedScreen,0,0,c.width,c.height);
  const image=c.toDataURL('image/jpeg',.82);
  if(image.length<5000)throw new Error('Shared frame serialization failed');

  // Beep is the receipt: it only happens after a real current frame exists.
  await captureBoop();
  console.log('[AKI 8.0 CAPTURE RECEIPT]',{captureId,w,h,bytes:image.length});

  const r=await fetch('/api/aki',{method:'POST',headers:{'Content-Type':'application/json'},
   body:JSON.stringify({action:'borrowed_eyes',facing:'shared_screen',image,glanceId:captureId})});
  const p=await r.json().catch(()=>({}));
  if(!r.ok||!p?.observation)throw new Error(p?.error||'Shared vision analysis failed');
  sendSharedVisionTruth('CURRENT CAPTURE '+captureId+' VERIFIED OBSERVATION: '+p.observation+
   ' Respond naturally about only this captured screen frame. Do not claim continuous sight.');
 }catch(e){
  console.error('[AKI 8.0 CAPTURE FAILED]',captureId,e?.name,e?.message);
  sendSharedVisionTruth('The current capture failed. No new visual observation exists. Do not guess or reuse an older image.');
 }finally{sharedVision.busy=false}
}

// Exact spoken command. Similar phrases intentionally do NOT capture.
function handleSharedVisionTranscript(text){
 const t=String(text||'').toLowerCase().replace(/[.,!?]/g,' ').replace(/\s+/g,' ').trim();
 if(t==='capture this'){
  if(sharedVision.active)captureSharedVision();
  else sendSharedVisionTruth('The user said the exact capture command, but no screen share is active. Do not claim a capture occurred.');
  return true;
 }
 return false;
}

function setSightHW(next,detail={}){
 borrowedEyeState.hw=next;
 console.log('[AKI 8.0 HW]',next,detail);
}
function hardwareTruth(text){
 // This is the only channel by which conversational AKI learns sight status.
 sendLiveUserText('HARDWARE TRUTH — '+text);
}
function newGlance(facing){
 const id=++borrowedEyeState.glanceSeq;
 borrowedEyeState.activeGlance=id;
 borrowedEyeState.capturedGlance=0;
 borrowedEyeState.pending=facing;
 return id;
}

const borrowedView=document.getElementById('borrowedView');
const borrowedShade=document.getElementById('borrowedShade');

const akiButton=document.querySelector('#akiButton');
let pc=null,dc=null,micStream=null,audioEl=null,audioCtx=null;
let starting=false,stopping=false,powered=false,restarting=false;
let transcript='',turnEndAt=0,responseStartAt=0,firstAudioAt=0,lastChime=0;
let latencyTimer=null,hardWatchdog=null,preferenceTimer=null;
let akiVoice=localStorage.getItem('akiVoice')||'marin';
let akiLanguage=localStorage.getItem('akiLanguage')||'auto';

let borrowedEyeState={
 pending:null,busy:false,lastFacing:null,readyNotBefore:0,cameraPermission:'unknown',
 frontDeviceId:null,rearDeviceId:null,viewfinder:false,
 hw:'VOICE_ONLY',glanceSeq:0,activeGlance:0,capturedGlance:0,touchCaptureArmed:false
};
let cameraStream=null;

function visionIntent(text){
 const t=normalizedSpeech(text);
 if(/(look at me|see me|can you see me|take a look at me|look at my face|what do you notice about me)/.test(t))return 'user';
 if(/(look at this|see this|see what i see|see what i'm seeing|see what i am seeing|i want (you )?to see this|i want to show you something|take a look at this|look at what i'm looking at|look at what i am looking at)/.test(t))return 'environment';
 return null;
}
function isReadyIntent(text){
 const t=normalizedSpeech(text);
 return /^(okay|ok|ready|i'?m ready|i am ready|go ahead|now|yep|yes|yeah|do it)\b/.test(t);
}
function isRetakeIntent(text){
 const t=normalizedSpeech(text);
 return /(do that again|look again|see again|retake|try again|one more time|capture again)/.test(t);
}
function sendLiveUserText(text){
 if(!dc||dc.readyState!=='open')return false;
 try{
  dc.send(JSON.stringify({type:'response.item.create',item:{type:'message',role:'user',content:[{type:'input_text',text}]}}));
  dc.send(JSON.stringify({type:'response.create'}));return true;
 }catch(e){console.error('[AKI 8.0 text]',e?.name,e?.message,e);return false}
}
async function captureBoop(){
 try{
  audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended')await audioCtx.resume();
  const t=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type='sine';o.frequency.setValueAtTime(720,t);o.frequency.exponentialRampToValueAtTime(1120,t+.13);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.55,t+.018);g.gain.exponentialRampToValueAtTime(.0001,t+.23);
  o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+.24);
 }catch(e){console.warn('[AKI 8.0 capture-tone]',e?.name,e?.message)}
}
async function stopBorrowedEyesCamera(){
 try{
  if(borrowedView){borrowedView.pause();borrowedView.srcObject=null;borrowedView.classList.remove('active')}
  if(borrowedShade)borrowedShade.classList.remove('active');
  borrowedEyeState.viewfinder=false;
  borrowedEyeState.touchCaptureArmed=false;
  document.body.classList.remove('borrowed-eyes-live');
  if(borrowedEyeState.hw==='VIEWFINDER_LIVE'||borrowedEyeState.hw==='OPENING_CAMERA')setSightHW('VOICE_ONLY');
  if(cameraStream){cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null}
 }catch(e){console.warn('[AKI 8.0 camera-stop]',e?.name,e?.message)}
}
async function prepareOptionalSight(){
 const md=navigator.mediaDevices;if(!md?.getUserMedia){borrowedEyeState.cameraPermission='unavailable';return}
 let stream=null;
 try{
  stream=await md.getUserMedia({video:true,audio:false});
  borrowedEyeState.cameraPermission='granted';
  stream.getTracks().forEach(t=>t.stop());stream=null;
  const devices=(await md.enumerateDevices()).filter(d=>d.kind==='videoinput');
  const front=devices.find(d=>/(front|facetime|user|selfie)/i.test(d.label||''));
  const rear=devices.find(d=>/(back|rear|environment|world)/i.test(d.label||'')&&!/(ultra|tele)/i.test(d.label||''))||
             devices.find(d=>/(back|rear|environment|world|wide|ultra)/i.test(d.label||''));
  borrowedEyeState.frontDeviceId=front?.deviceId||null;borrowedEyeState.rearDeviceId=rear?.deviceId||null;
  console.log('[AKI 8.0 sight-ready]',{cameras:devices.map(d=>d.label),front:front?.label,rear:rear?.label});
 }catch(e){
  borrowedEyeState.cameraPermission=e?.name==='NotAllowedError'?'denied':'unavailable';
  console.log('[AKI 8.0 sight-optional]',e?.name,e?.message);
 }finally{if(stream)stream.getTracks().forEach(t=>t.stop())}
}
async function openBorrowedCamera(facing){
 await stopBorrowedEyesCamera();
 const md=navigator.mediaDevices;if(!md?.getUserMedia)throw new Error('Camera API unavailable');
 const mobile=/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
 const knownId=facing==='environment'?borrowedEyeState.rearDeviceId:borrowedEyeState.frontDeviceId;
 if(knownId){
  try{
   cameraStream=await md.getUserMedia({video:{deviceId:{exact:knownId},width:{ideal:1280},height:{ideal:720}},audio:false});
   const settings=cameraStream.getVideoTracks()[0]?.getSettings?.()||{};
   if(settings.facingMode&&settings.facingMode!==facing){await stopBorrowedEyesCamera();throw new Error('Known camera mismatch')}
   return cameraStream;
  }catch(e){await stopBorrowedEyesCamera();console.warn('[AKI 8.0 known-camera-failed]',facing,e?.name,e?.message)}
 }
 if(!mobile){
  cameraStream=await md.getUserMedia({video:{width:{ideal:1280},height:{ideal:720}},audio:false});
  return cameraStream;
 }
 try{
  cameraStream=await md.getUserMedia({video:{facingMode:{exact:facing},width:{ideal:1280},height:{ideal:720}},audio:false});
  const settings=cameraStream.getVideoTracks()[0]?.getSettings?.()||{};
  console.log('[AKI 8.0 facing-request]',{requested:facing,actual:settings.facingMode,label:cameraStream.getVideoTracks()[0]?.label});
  if(settings.facingMode&&settings.facingMode!==facing){await stopBorrowedEyesCamera();throw new Error('Wrong camera returned')}
  return cameraStream;
 }catch(err){await stopBorrowedEyesCamera();console.warn('[AKI 8.0 facing-failed]',facing,err?.name,err?.message)}
 let devices=[];try{devices=(await md.enumerateDevices()).filter(d=>d.kind==='videoinput')}catch{}
 const wanted=facing==='environment'?/(back|rear|environment|world|wide|ultra)/i:/(front|facetime|user|selfie)/i;
 const matches=devices.filter(d=>wanted.test(d.label||''));
 if(matches.length){
  const chosen=(facing==='environment'?matches.find(d=>/(back|rear|environment)/i.test(d.label)&&!/(ultra|tele)/i.test(d.label)):matches[0])||matches[0];
  cameraStream=await md.getUserMedia({video:{deviceId:{exact:chosen.deviceId},width:{ideal:1280},height:{ideal:720}},audio:false});
  const settings=cameraStream.getVideoTracks()[0]?.getSettings?.()||{};
  if(settings.facingMode&&settings.facingMode!==facing){await stopBorrowedEyesCamera();throw new Error('Selected camera did not verify')}
  return cameraStream;
 }
 if(facing==='environment')throw new Error('Rear camera could not be positively acquired. No image was taken.');
 throw new Error('Front camera could not be acquired.');
}
async function openBorrowedViewfinder(facing){
 if(borrowedEyeState.busy)return false;
 borrowedEyeState.busy=true;
 const glanceId=newGlance(facing);
 setSightHW('OPENING_CAMERA',{glanceId,facing});
 try{
  await openBorrowedCamera(facing);
  if(glanceId!==borrowedEyeState.activeGlance)throw new Error('Superseded glance');
  const track=cameraStream?.getVideoTracks?.()[0];
  if(!track||track.readyState!=='live')throw new Error('Camera track is not live');

  borrowedView.srcObject=cameraStream;
  borrowedView.classList.add('active');
  borrowedShade.classList.add('active');
  await borrowedView.play();
  await waitForVideo(borrowedView);

  // Require real video dimensions and a live track before conversational confirmation.
  if(borrowedView.videoWidth<2||borrowedView.videoHeight<2||track.readyState!=='live')
    throw new Error('Viewfinder never became physically live');

  borrowedEyeState.viewfinder=true;
  borrowedEyeState.touchCaptureArmed=true;
  document.body.classList.add('borrowed-eyes-live');
  setSightHW('VIEWFINDER_LIVE',{glanceId,facing,w:borrowedView.videoWidth,h:borrowedView.videoHeight,
    settings:track.getSettings?.()||{}});
  hardwareTruth('A live camera viewfinder is physically open now for glance '+glanceId+
    '. It has NOT captured anything. Tell the user briefly: "Tap me when you want me to look." Do not claim a capture until hardware confirms one.');
  return true;
 }catch(e){
  console.error('[AKI 8.0 viewfinder-failed]',{glanceId,facing,name:e?.name,message:e?.message});
  await stopBorrowedEyesCamera();
  if(glanceId===borrowedEyeState.activeGlance){
   setSightHW('FAILED',{glanceId,stage:'open'});
   borrowedEyeState.pending=null;
   hardwareTruth('Glance '+glanceId+' failed before a live camera view existed. No image exists. Say only: "I couldn’t open that view."');
  }
  return false;
 }finally{borrowedEyeState.busy=false}
}
async function waitForVideo(video){
 if(!(video.readyState>=2&&video.videoWidth&&video.videoHeight)){
  await new Promise((resolve,reject)=>{
   let done=false;const finish=()=>{if(done)return;done=true;clearTimeout(timer);resolve()};
   const timer=setTimeout(()=>{if(done)return;done=true;reject(new Error('Camera frame timed out'))},4500);
   video.addEventListener('loadedmetadata',finish,{once:true});video.addEventListener('canplay',finish,{once:true});
  });
 }
 await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
 await new Promise(r=>setTimeout(r,300));
}
async function borrowedEyesBlink(facing){
 if(borrowedEyeState.busy)return;
 borrowedEyeState.touchCaptureArmed=false;
 document.body.classList.remove('borrowed-eyes-live');
 const glanceId=borrowedEyeState.activeGlance;
 borrowedEyeState.busy=true;
 let frame=null;
 try{
  if(!glanceId||borrowedEyeState.hw!=='VIEWFINDER_LIVE'||!borrowedEyeState.viewfinder)
   throw new Error('No physically verified live viewfinder');
  if(!cameraStream||borrowedView.srcObject!==cameraStream)throw new Error('Viewfinder stream missing');
  const track=cameraStream.getVideoTracks()[0];
  if(!track||track.readyState!=='live')throw new Error('Camera track ended before capture');

  setSightHW('CAPTURING',{glanceId,facing});
  const w=borrowedView.videoWidth,h=borrowedView.videoHeight;
  if(w<2||h<2)throw new Error('No current video frame dimensions');

  const scale=Math.min(1,1024/Math.max(w,h)),c=document.createElement('canvas');
  c.width=Math.max(2,Math.round(w*scale));c.height=Math.max(2,Math.round(h*scale));
  const ctx=c.getContext('2d',{willReadFrequently:true});
  ctx.drawImage(borrowedView,0,0,c.width,c.height);

  const sw=Math.min(64,c.width),sh=Math.min(64,c.height);
  const sample=document.createElement('canvas');sample.width=sw;sample.height=sh;
  const sx=sample.getContext('2d',{willReadFrequently:true});sx.drawImage(c,0,0,sw,sh);
  const px=sx.getImageData(0,0,sw,sh).data;
  let sum=0,sum2=0,dark=0,bright=0;
  for(let i=0;i<px.length;i+=4){
   const y=.2126*px[i]+.7152*px[i+1]+.0722*px[i+2];
   sum+=y;sum2+=y*y;if(y<8)dark++;if(y>247)bright++;
  }
  const n=px.length/4,mean=sum/n,variance=sum2/n-mean*mean;
  if(dark/n>.97||bright/n>.97||variance<2)throw new Error('Captured frame failed image-quality verification');

  frame=c.toDataURL('image/jpeg',.78);
  if(!frame.startsWith('data:image/jpeg;base64,')||frame.length<5000)throw new Error('JPEG frame serialization failed');

  // This is the hard receipt: only a verified current frame can reach the beep.
  borrowedEyeState.capturedGlance=glanceId;
  setSightHW('FRAME_VERIFIED',{glanceId,w,h,bytes:frame.length,mean,variance});
  await captureBoop();
  console.log('[AKI 8.0 BEEP RECEIPT]',{glanceId});
  await stopBorrowedEyesCamera();
  setSightHW('ANALYZING',{glanceId});

  const vr=await fetch('/api/aki',{
   method:'POST',headers:{'Content-Type':'application/json'},
   body:JSON.stringify({action:'borrowed_eyes',facing,image:frame,glanceId})
  });
  const payload=await vr.json().catch(()=>({}));
  if(glanceId!==borrowedEyeState.activeGlance)throw new Error('Stale vision result ignored');
  if(!vr.ok||!payload?.observation)throw new Error(payload?.error||`Vision backend failed (${vr.status})`);
  if(payload.glanceId!=null && Number(payload.glanceId)!==Number(glanceId))throw new Error('Backend returned stale glance ID');

  setSightHW('OBSERVATION_VERIFIED',{glanceId});
  hardwareTruth('Verified observation for CURRENT glance '+glanceId+': '+payload.observation+
   ' The camera is OFF. Speak naturally in past tense about only this observation. Never claim continuous sight.');
 }catch(e){
  console.error('[AKI 8.0 capture-failed]',{glanceId,name:e?.name,message:e?.message,facing});
  await stopBorrowedEyesCamera();
  if(glanceId===borrowedEyeState.activeGlance){
   setSightHW('FAILED',{glanceId,stage:'capture'});
   hardwareTruth('Glance '+glanceId+' failed. There is NO usable current visual observation. Do not say captured, do not guess, do not reuse any previous image. Say only: "That glance didn’t come through."');
  }
 }finally{
  frame=null;borrowedEyeState.pending=null;borrowedEyeState.readyNotBefore=0;borrowedEyeState.busy=false;
  if(glanceId===borrowedEyeState.activeGlance && borrowedEyeState.hw!=='OBSERVATION_VERIFIED') setSightHW('VOICE_ONLY',{glanceId});
 }
}
async function legacyBorrowedEyesIntentDisabled(text){
 const t=normalizedSpeech(text);

 if(borrowedEyeState.pending&&isReadyIntent(t)){
  if(Date.now()<borrowedEyeState.readyNotBefore){
   console.log('[AKI 8.0 ready-gate] ignored premature ready fragment');
   return true;
  }
  const facing=borrowedEyeState.pending;borrowedEyeState.pending=null;borrowedEyeState.readyNotBefore=0;
  await borrowedEyesBlink(facing);return true;
 }
 if(isRetakeIntent(t)&&borrowedEyeState.lastFacing){
  borrowedEyeState.pending=borrowedEyeState.lastFacing;borrowedEyeState.readyNotBefore=Date.now()+1800;
  const front=borrowedEyeState.lastFacing==='user';
  const opened=await openBorrowedViewfinder(borrowedEyeState.lastFacing);
  if(!opened)return true;
  sendLiveUserText(front
   ?'BORROWED EYES CONTROL: The human asked to repeat the last front-camera blink. Say briefly: "Absolutely. Get how you want to be and tell me when you’re ready."'
   :'BORROWED EYES CONTROL: The human asked to repeat the last rear-camera blink. Say briefly: "Absolutely. Point me at it again and tell me when you’re ready."');
  return true;
 }

 const intent=visionIntent(t);
 if(intent){
  borrowedEyeState.pending=intent;borrowedEyeState.lastFacing=intent;borrowedEyeState.readyNotBefore=Date.now()+1800;
  const opened=await openBorrowedViewfinder(intent);
  if(!opened)return true;
  sendLiveUserText(intent==='user'
   ?'BORROWED EYES CONTROL: The human explicitly invited one front-camera look. Do not capture or claim you saw anything yet. Say briefly: "Okay. Get how you want to be and tell me when you’re ready."'
   :'BORROWED EYES CONTROL: The human explicitly invited one rear-camera look. Do not capture or claim you saw anything yet. Say briefly: "Okay. Point your phone at it and tell me when you’re ready."');
  return true;
 }
 return false;
}

function powerLook(mode){
  akiButton.classList.remove('on','starting','error');
  if(mode==='on'){akiButton.classList.add('on');akiButton.setAttribute('aria-pressed','true');akiButton.setAttribute('aria-label','Turn AKI off')}
  else if(mode==='starting'){akiButton.classList.add('starting');akiButton.setAttribute('aria-pressed','false');akiButton.setAttribute('aria-label','AKI is starting')}
  else if(mode==='error'){akiButton.classList.add('error');akiButton.setAttribute('aria-pressed','false');akiButton.setAttribute('aria-label','AKI connection failed. Tap to retry')}
  else{akiButton.setAttribute('aria-pressed','false');akiButton.setAttribute('aria-label','Turn AKI on')}
}
function chime(){
  const now=Date.now();if(now-lastChime<1800)return;lastChime=now;
  try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();const t=audioCtx.currentTime;
    [523.25,783.99].forEach((f,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=f;
      g.gain.setValueAtTime(0,t+i*.055);g.gain.linearRampToValueAtTime(.022,t+.025+i*.055);g.gain.exponentialRampToValueAtTime(.0001,t+.32+i*.055);
      o.connect(g);g.connect(audioCtx.destination);o.start(t+i*.055);o.stop(t+.36+i*.055)})}catch{}
}
function latency(label,extra={}){console.log('[AKI 8.0 latency]',label,{at:new Date().toISOString(),...extra})}
function turnEnded(){
  turnEndAt=performance.now();responseStartAt=firstAudioAt=0;
  latency('user-turn-ended');chime();
  clearTimeout(latencyTimer);clearTimeout(hardWatchdog);
  latencyTimer=setTimeout(()=>{
    if(powered&&!firstAudioAt)latency('slow-response-warning',{waiting_ms:Math.round(performance.now()-turnEndAt)})
  },3000);
  // 4.7 hard escape: never leave a dead Live session hanging indefinitely.
  // This does not fake an answer. It cleanly reconnects AKI if no output audio
  // has begun 15 seconds after a recognized end-of-turn.
  hardWatchdog=setTimeout(async()=>{
    if(powered&&!firstAudioAt&&!restarting){
      latency('15-second-recovery',{waiting_ms:Math.round(performance.now()-turnEndAt)});
      restarting=true;chime();
      await stopAki(true);
      await new Promise(r=>setTimeout(r,220));
      restarting=false;
      await startAki();
    }
  },15000);
}
function responseStarted(){if(responseStartAt)return;responseStartAt=performance.now();latency('response-started',{from_turn_end_ms:turnEndAt?Math.round(responseStartAt-turnEndAt):null})}
function firstAudio(){if(firstAudioAt)return;firstAudioAt=performance.now();clearTimeout(latencyTimer);clearTimeout(hardWatchdog);latency('first-audio',{from_turn_end_ms:turnEndAt?Math.round(firstAudioAt-turnEndAt):null,from_response_start_ms:responseStartAt?Math.round(firstAudioAt-responseStartAt):null})}

function normalizedSpeech(text){
 return (text||'').toLowerCase().replace(/[’]/g,"'").replace(/\s+/g,' ').trim();
}
function voiceIntent(text){
 const t=normalizedSpeech(text);
 // Voice identity is locked by default. Merely SAYING words like man, woman,
 // male, female or voice can never switch AKI.
 const lock=/(keep|save|lock|remember|stay with|stick with).{0,28}(this|current|your).{0,18}voice|i (really )?like (this|your) voice|make this my voice|use this voice (from now on|until i (say|tell) otherwise)/.test(t);
 if(lock)return {kind:'lock'};

 // A voice change requires an explicit first-person command/request directed at AKI.
 const explicit=/(aki[, ]+)?(please )?(change|switch|use|give me|let me hear|i want|i'd like|i would like|i prefer|can you change|could you change|can i have|go back to)/.test(t);
 if(!explicit)return null;
 if(/(male voice|man's voice|voice of a man|masculine voice|voz masculina|voz de hombre)/.test(t))return {kind:'change',voice:'ash'};
 if(/(female voice|woman's voice|voice of a woman|feminine voice|voz femenina|voz de mujer)/.test(t))return {kind:'change',voice:'marin'};
 if(/(different voice|another voice|other voice|change your voice|switch your voice|new voice)/.test(t)){
   const cycle=['marin','cedar','ash'];
   return {kind:'change',voice:cycle[(cycle.indexOf(akiVoice)+1+cycle.length)%cycle.length]};
 }
 return null;
}
async function handleVoiceIntent(text){
 const intent=voiceIntent(text);if(!intent)return;
 if(intent.kind==='lock'){
   localStorage.setItem('akiVoice',akiVoice);
   localStorage.setItem('akiVoiceLocked','true');
   latency('voice-locked',{voice:akiVoice});
   return;
 }
 const v=intent.voice;if(!v||v===akiVoice||restarting)return;
 akiVoice=v;
 // Every deliberately selected voice becomes the persistent voice immediately.
 localStorage.setItem('akiVoice',v);
 localStorage.setItem('akiVoiceLocked','true');
 latency('voice-change-explicit',{voice:v});
 restarting=true;chime();
 await stopAki(true);await new Promise(r=>setTimeout(r,220));restarting=false;await startAki();
}
function absorbTranscript(m){
 // CRITICAL 7.1 FIX: only the USER'S input transcript may control voice identity.
 // AKI's own output transcript is ignored, preventing it from switching itself.
 const type=String(m.type||'').toLowerCase();
 const nested=String(m.event?.type||'').toLowerCase();
 const isInput=/input.*transcript|transcript.*input/.test(type)||/input.*transcript|transcript.*input/.test(nested);
 if(!isInput)return;
 const d=(typeof m.delta==='string'?m.delta:'')||(typeof m.transcript==='string'?m.transcript:'')||(typeof m.event?.delta==='string'?m.event.delta:'')||(typeof m.event?.transcript==='string'?m.event.transcript:'');
 if(d){transcript+=d;clearTimeout(preferenceTimer);preferenceTimer=setTimeout(()=>{const h=transcript;transcript='';handleVoiceIntent(h);handleBorrowedEyesIntent(h)},500)}
}

async function stopAki(keepLook=false){
 if(stopping)return;stopping=true;powered=false;clearTimeout(latencyTimer);clearTimeout(hardWatchdog);clearTimeout(preferenceTimer);
 try{dc?.close()}catch{} try{pc?.getSenders?.().forEach(x=>x.track?.stop())}catch{} try{pc?.close()}catch{}
 try{micStream?.getTracks().forEach(t=>{t.enabled=false;t.stop()})}catch{}
  await stopBorrowedEyesCamera();borrowedEyeState.pending=null;borrowedEyeState.busy=false;
 if(audioEl){try{audioEl.pause()}catch{}audioEl.srcObject=null;audioEl.remove();audioEl=null}
 pc=dc=micStream=null;transcript='';if(!keepLook)powerLook('off');stopping=false;
}
async function startAki(){
 if(powered||starting||stopping)return;starting=true;powerLook('starting');
 try{
  audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended')await audioCtx.resume();
  // Prime the audio route while this function still originates from the user's AKI tap.
  try{
   const o=audioCtx.createOscillator(),g=audioCtx.createGain(),t=audioCtx.currentTime;
   g.gain.setValueAtTime(.00001,t);o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+.02);
  }catch{}
  micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
  pc=new RTCPeerConnection();audioEl=document.createElement('audio');audioEl.autoplay=true;audioEl.playsInline=true;document.body.appendChild(audioEl);
  pc.ontrack=e=>{audioEl.srcObject=e.streams[0];audioEl.play().catch(()=>{})};micStream.getTracks().forEach(t=>pc.addTrack(t,micStream));
  dc=pc.createDataChannel('oai-events');dc.addEventListener('open',()=>{
    latency('data-channel-open',{voice:akiVoice});
    // AKI 7.4 — BORROWED EYES TOUCH + HARDWARE TRUTH. One presence, one conversation, no feature UI.
    // AKI supports the human's agency rather than replacing it.
    try{dc.send(JSON.stringify({type:'session.instructions.append',content:`AKI's core philosophy is "More of you." You are a calm, warm, intelligent thinking companion. The human remains the creator, observer, experiencer and actor. Your job is to help them think, imagine, articulate, explore, practice, decide and get unstuck — not to take over the experience. Listen carefully. Reflect the strongest thread. Ask one useful question at a time when a question helps. When the user's thoughts become complicated, become simpler. Prefer one useful next step over lists, information dumps, menus, workflows or many options. Encourage the user to describe what they see, imagine, feel, want to make, or want to try. Explore hypothetical and creative spaces conversationally. BORROWED EYES — AKI is voice-first and has temporary sight only when the human explicitly invites you to look. Never watch continuously and never claim to still be seeing after the captured moment. There is no camera interface, preview, shutter button, photo library, upload flow, or saved visual memory. "Look at me", "can you see me", and similar requests mean one FRONT-camera blink. "Look at this", "see what I'm seeing", "I want to show you something", and similar requests mean one REAR-camera blink. BOTH front and rear requests require a tiny readiness exchange before capture: ask the human to get positioned or point the phone and say "ready". Only after "ready", "okay", "go ahead", "now", or an equivalent confirmation may the application capture. At the exact captured moment the browser itself plays a subtle nonverbal electronic capture tone. Never say or imitate the word "boop", "beep", a shutter, or any capture sound. If the human dislikes the captured instant, natural requests such as "do that again", "look again", "retake that", or "try again" should repeat the last front/rear blink, again waiting for readiness. Do not claim, infer, or guess that you saw anything until a message beginning "BORROWED EYES OBSERVATION" arrives. A request to look is NOT visual evidence. After a successful blink, speak truthfully in the past tense ("I saw...") and make clear you are no longer looking. If capture fails, say so briefly and invite a spoken description. Do not advertise image upload, photo sharing, file upload/creation, screen sharing, image generation, device control, reminders, messaging, purchasing, booking, or other external actions. The experience should feel like one presence: no visible interface beyond AKI itself.`}))}catch(e){console.warn('AKI philosophy instruction:',e)}
  });
  dc.addEventListener('message',e=>{try{const m=JSON.parse(e.data),type=m.type||'',nested=m.event?.type||'',all=(type+' '+nested).toLowerCase();
    if(type==='session.started'){powered=true;
  // Ask once for optional sight permission. Declining never disables voice.
  if(borrowedEyeState.cameraPermission==='unknown')setTimeout(()=>prepareOptionalSight(),250);
powerLook('on');latency('session-started',{voice:m.session?.audio?.output?.voice||m.session?.voice||akiVoice})}
    absorbTranscript(m);
    if(all.includes('speech_stopped')||all.includes('input_audio_buffer.committed')||all.includes('turn.ended'))turnEnded();
    if(all.includes('response.created')||all.includes('response.in_progress')||all.includes('delegation.created'))responseStarted();
    if(all.includes('output_audio.delta')||all.includes('audio.delta'))firstAudio();
    if(type==='error')console.error('[AKI 8.0 Live error]',{type:m.type,code:m.error?.code||m.code,message:m.error?.message||m.message,param:m.error?.param||m.param,event:m})
  }catch{}});
  pc.addEventListener('connectionstatechange',()=>{const cs=pc?.connectionState;latency('connection-state',{state:cs});if(['failed','closed'].includes(cs)&&powered&&!restarting)stopAki()});
  const offer=await pc.createOffer();await pc.setLocalDescription(offer);const localSdp=pc.localDescription?.sdp||offer.sdp;
  if(!localSdp||!localSdp.trim().startsWith('v=0'))throw new Error('Browser did not create a valid SDP offer');
  const r=await fetch('/api/aki',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sdp:localSdp,voice:akiVoice,language:akiLanguage})});
  const answer=await r.text();if(!r.ok)throw new Error(answer);await pc.setRemoteDescription({type:'answer',sdp:answer});
  powered=true;powerLook('on');
 }catch(err){console.error('AKI 7.2.3 start error:',err);await stopAki();powerLook('error')}finally{starting=false}
}
async function toggle(){if(starting||stopping)return;if(powered||pc||micStream)await stopAki();else await startAki()}
akiButton.addEventListener('click',e=>{e.stopPropagation();toggle()});
akiButton.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle()}});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&pc&&['failed','closed'].includes(pc.connectionState))stopAki()});
window.addEventListener('pagehide',()=>stopAki());
powerLook('off');

// AKI 7.4: physical touch/click is the shutter only while a verified viewfinder is live.
// Capture-phase interception prevents the same gesture from toggling AKI off.
document.addEventListener('pointerup',async(ev)=>{
 if(!borrowedEyeState.touchCaptureArmed||borrowedEyeState.hw!=='VIEWFINDER_LIVE')return;
 ev.preventDefault();ev.stopPropagation();ev.stopImmediatePropagation();
 const facing=borrowedEyeState.pending||borrowedEyeState.lastFacing;
 if(!facing)return;
 console.log('[AKI 8.0 PHYSICAL SHUTTER]',{facing,glanceId:borrowedEyeState.activeGlance});
 await borrowedEyesBlink(facing);
},{capture:true});

// Fallback for browsers that do not emit Pointer Events reliably.
document.addEventListener('click',async(ev)=>{
 if(!borrowedEyeState.touchCaptureArmed||borrowedEyeState.hw!=='VIEWFINDER_LIVE')return;
 ev.preventDefault();ev.stopPropagation();ev.stopImmediatePropagation();
 const facing=borrowedEyeState.pending||borrowedEyeState.lastFacing;
 if(!facing)return;
 console.log('[AKI 8.0 PHYSICAL SHUTTER FALLBACK]',{facing,glanceId:borrowedEyeState.activeGlance});
 await borrowedEyesBlink(facing);
},{capture:true});


// Shared Screen is intentionally decoupled from AKI's torus/ring.
// A native/user-authorized UI entry point may call this function where the platform permits.
window.AKIStartSharedScreen = startSharedVision;

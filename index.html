<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e8e9e7">
<title>AKI 2.0</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#e8e9e7;color:#515452}body{overflow:hidden}
.presence{position:relative;width:100%;height:100dvh;overflow:hidden;isolation:isolate;background:linear-gradient(145deg,#f1f1ee 0%,#dfe3e3 43%,#e9e5e4 72%,#e5e6e3 100%);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background 1.2s ease}
.atmosphere{position:absolute;inset:-20%;filter:blur(38px);opacity:.96;animation:air 9s ease-in-out infinite;transition:filter .8s ease,opacity .8s ease}
.atmosphere:before,.atmosphere:after{content:"";position:absolute;border-radius:50%;transition:background 1.1s ease,transform 1.1s ease}
.atmosphere:before{width:74%;height:69%;left:-1%;top:1%;background:radial-gradient(circle at 55% 45%,rgba(125,190,226,.62),rgba(174,144,220,.34) 45%,rgba(255,255,255,.05) 67%,transparent 76%);animation:d1 15s ease-in-out infinite alternate}
.atmosphere:after{width:73%;height:69%;right:-2%;bottom:-2%;background:radial-gradient(circle at 43% 46%,rgba(236,156,188,.50),rgba(126,190,221,.34) 46%,rgba(246,212,160,.16) 61%,transparent 76%);animation:d2 18s ease-in-out infinite alternate}
.life{position:absolute;left:50%;top:48%;width:min(88vw,690px);aspect-ratio:1;transform:translate(-50%,-50%) scale(.9);border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.88) 0%,rgba(226,238,244,.54) 27%,rgba(162,204,229,.28) 47%,rgba(195,160,225,.20) 61%,rgba(236,170,198,.13) 70%,transparent 79%);filter:blur(8px) saturate(1.08);animation:breath 7.4s ease-in-out infinite;transition:filter .7s ease}
.life:after{content:"";position:absolute;inset:14%;border-radius:46% 54% 58% 42%/53% 44% 56% 47%;background:radial-gradient(circle at 38% 34%,rgba(255,255,255,.93),rgba(145,203,235,.34) 38%,rgba(195,151,225,.25) 60%,rgba(241,165,195,.15) 72%,transparent 82%);filter:blur(12px);animation:morph 11s ease-in-out infinite alternate;transition:background .9s ease}
.mark{position:absolute;z-index:3;inset:0;display:grid;place-items:center;font-family:Georgia,'Times New Roman',serif;font-size:clamp(76px,20vw,138px);font-weight:600;letter-spacing:.15em;padding-left:.15em;color:rgba(184,187,183,.66);text-shadow:0 3px 7px rgba(255,255,255,.78),0 -3px 8px rgba(91,96,94,.24),3px 0 8px rgba(255,255,255,.45),-3px 0 8px rgba(91,96,94,.13);filter:blur(.15px);transition:transform .65s ease,opacity .65s ease,text-shadow .65s ease,color .65s ease}
/* Listening: open, cool, receptive. */
.listening .life{animation-duration:5.8s;filter:blur(8px) saturate(1.18)}
.listening .atmosphere:before{background:radial-gradient(circle at 55% 45%,rgba(106,197,232,.72),rgba(156,163,229,.40) 45%,transparent 76%)}
/* Thinking: color gathers inward and shifts blue-violet. */
.thinking .life{animation-duration:3.4s;filter:blur(7px) saturate(1.38)}
.thinking .life:after{background:radial-gradient(circle at 48% 44%,rgba(247,250,255,.92),rgba(108,178,236,.48) 35%,rgba(151,109,220,.39) 58%,rgba(219,142,220,.18) 73%,transparent 83%)}
.thinking .atmosphere{animation-duration:4.8s;filter:blur(34px) saturate(1.22)}
.thinking .mark{color:rgba(170,176,180,.70);text-shadow:0 4px 9px rgba(255,255,255,.72),0 -4px 10px rgba(81,88,95,.22)}
/* Speaking: warmer, brighter, gently more alive. */
.speaking .life{animation-duration:2.8s;filter:blur(7px) saturate(1.25) brightness(1.04)}
.speaking .atmosphere:after{background:radial-gradient(circle at 43% 46%,rgba(243,158,185,.62),rgba(223,183,235,.40) 43%,rgba(247,211,155,.23) 61%,transparent 77%)}
.speaking .mark{transform:scale(1.025)}
.error .mark{opacity:.48}
@keyframes air{0%,100%{transform:scale(.95);opacity:.72}50%{transform:scale(1.08);opacity:1}}
@keyframes d1{from{transform:translate(-7%,-5%) scale(.92)}to{transform:translate(17%,11%) scale(1.18)}}
@keyframes d2{from{transform:translate(9%,10%) scale(1.13)}to{transform:translate(-16%,-11%) scale(.90)}}
@keyframes breath{0%,100%{transform:translate(-50%,-50%) scale(.84);opacity:.60}50%{transform:translate(-50%,-50%) scale(1.09);opacity:1}}
@keyframes morph{0%{border-radius:46% 54% 58% 42%/53% 44% 56% 47%;transform:rotate(-3deg) scale(.93)}50%{border-radius:57% 43% 44% 56%/43% 58% 42% 57%;transform:rotate(3deg) scale(1.09)}100%{border-radius:43% 57% 52% 48%/58% 45% 55% 42%;transform:rotate(-2deg) scale(.98)}}
@media(prefers-reduced-motion:reduce){.atmosphere,.atmosphere:before,.atmosphere:after,.life,.life:after{animation:none!important}}
</style>
</head>
<body>
<main id="app" class="presence" aria-label="AKI. Tap once to allow microphone access, then say Aki.">
  <div class="atmosphere" aria-hidden="true"></div><div class="life" aria-hidden="true"></div><div class="mark">AKI</div>
</main>
<script>
const app=document.querySelector('#app');
let pc=null,dc=null,micStream=null,audioEl=null,starting=false,transcript='',thinkTimer=null;
let voice=localStorage.getItem('akiVoice')||'marin';
function state(name){app.classList.remove('listening','thinking','speaking');if(name)app.classList.add(name)}
async function stopAki(){clearTimeout(thinkTimer);try{dc?.close()}catch{}try{pc?.close()}catch{}try{micStream?.getTracks().forEach(t=>t.stop())}catch{}pc=dc=micStream=null;if(audioEl){audioEl.srcObject=null;audioEl.remove();audioEl=null}app.classList.remove('listening','thinking','speaking','error')}
async function switchVoice(next){if(next===voice)return;voice=next;localStorage.setItem('akiVoice',voice);await stopAki();setTimeout(startAki,180)}
function inspectVoiceCommand(text){const t=text.toLowerCase();if(/(masculine|male|man'?s) voice/.test(t))switchVoice('cedar');else if(/(feminine|female|woman'?s) voice/.test(t))switchVoice('marin')}
async function startAki(){if(pc||starting)return;starting=true;app.classList.remove('error');try{
 micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});pc=new RTCPeerConnection();audioEl=document.createElement('audio');audioEl.autoplay=true;audioEl.playsInline=true;document.body.appendChild(audioEl);pc.ontrack=e=>{audioEl.srcObject=e.streams[0];audioEl.play().catch(()=>{})};micStream.getTracks().forEach(t=>pc.addTrack(t,micStream));dc=pc.createDataChannel('oai-events');
 dc.addEventListener('open',()=>console.log('AKI 2.0 connected'));
 dc.addEventListener('message',e=>{try{const m=JSON.parse(e.data),type=m.type||'',nested=m.event?.type||'';
   if(type==='session.started'){state('listening');console.log('AKI 2.0 session started with voice',voice)}
   if(type==='input_transcript.delta'){transcript+=(m.delta||'');state('listening');clearTimeout(thinkTimer);thinkTimer=setTimeout(()=>{state('thinking');inspectVoiceCommand(transcript);transcript=''},420)}
   if(type.includes('delegation.created')||nested.includes('response.created')||nested.includes('response.in_progress'))state('thinking');
   if(type==='output_audio.delta'||type==='output_transcript.delta'||nested.includes('output_audio.delta')||nested.includes('output_text.delta'))state('speaking');
   if(type==='session.closed'||type==='output_audio.done'||nested.includes('response.completed')||nested.includes('response.done'))state('listening');
   if(type==='error')console.error('AKI Live event error:',m);
 }catch{}});
 pc.addEventListener('connectionstatechange',()=>{if(['failed','closed','disconnected'].includes(pc?.connectionState))app.classList.remove('listening','thinking','speaking')});
 const offer=await pc.createOffer();await pc.setLocalDescription(offer);const localSdp=pc.localDescription?.sdp||offer.sdp;if(!localSdp||!localSdp.trim().startsWith('v=0'))throw new Error('Browser did not create a valid SDP offer');
 const r=await fetch('/api/aki',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sdp:localSdp,voice})});const answer=await r.text();if(!r.ok)throw new Error(answer);await pc.setRemoteDescription({type:'answer',sdp:answer});
 }catch(err){console.error('AKI 2.0 start error:',err);await stopAki();app.classList.add('error')}finally{starting=false}}
app.addEventListener('click',()=>{if(!pc)startAki()});window.addEventListener('beforeunload',stopAki);
</script>
</body>
</html>

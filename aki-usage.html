<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>AHKI Usage</title>

  <style>
    body {
      margin: 0;
      background: #05070d;
      color: #f5f7ff;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    .w {
      max-width: 820px;
      margin: auto;
      padding: 42px 20px;
    }

    h1 {
      font-weight: 500;
      letter-spacing: .08em;
    }

    .login,
    .card {
      background: #0b0f19;
      border: 1px solid #26344d;
      border-radius: 18px;
      padding: 20px;
      margin: 14px 0;
    }

    input,
    button {
      font: inherit;
      border-radius: 12px;
      padding: 12px 14px;
      border: 1px solid #405477;
      background: #080c14;
      color: white;
    }

    button {
      cursor: pointer;
    }

    .grid {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
    }

    .n {
      font-size: 28px;
      margin-top: 8px;
    }

    .muted {
      color: #8d9ab1;
      font-size: 13px;
    }

    .table-wrap {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    td,
    th {
      text-align: left;
      padding: 10px;
      border-bottom: 1px solid #1c2638;
      white-space: nowrap;
    }

    #dash {
      display: none;
    }
  </style>
</head>

<body>

  <div class="w">

    <h1>AHKI USAGE</h1>

    <div class="login" id="login">

      <div class="muted">
        Private analytics
      </div>

      <p>
        <input
          id="pin"
          type="password"
          placeholder="Analytics PIN"
        >

        <button onclick="load()">
          Open
        </button>
      </p>

      <div
        id="err"
        class="muted"
      ></div>

    </div>


    <div id="dash">

      <!-- EXISTING SUMMARY CARDS -->

      <div
        class="grid"
        id="cards"
      ></div>


      <!-- NEW DAILY USAGE -->

      <div class="card">

        <h3>Daily usage</h3>

        <div class="muted">
          Last 14 active days
        </div>

        <div class="table-wrap">

          <table>

            <thead>
              <tr>
                <th>Date</th>
                <th>Active devices</th>
                <th>Sessions</th>
                <th>Time</th>
                <th>Avg / device</th>
              </tr>
            </thead>

            <tbody id="daily"></tbody>

          </table>

        </div>

      </div>


      <!-- EXISTING DEVICE TOTALS -->

      <div class="card">

        <h3>Anonymous devices</h3>

        <div class="table-wrap">

          <table>

            <thead>
              <tr>
                <th>Device</th>
                <th>Sessions</th>
                <th>Time</th>
              </tr>
            </thead>

            <tbody id="devices"></tbody>

          </table>

        </div>

      </div>

    </div>

  </div>


  <script>

    const fmt = (s) => {

      s = Math.round(s || 0);

      const h = Math.floor(s / 3600);

      const m = Math.floor(
        (s % 3600) / 60
      );

      return h
        ? `${h}h ${m}m`
        : `${m}m`;
    };


    async function load() {

      err.textContent = '';

      const r = await fetch(
        '/api/usage-summary',
        {
          method: 'POST',

          headers: {
            'Content-Type':
              'application/json'
          },

          body: JSON.stringify({
            pin: pin.value
          })
        }
      );


      if (!r.ok) {

        err.textContent =
          r.status === 503
            ? 'Database is not configured yet.'
            : 'Could not open analytics.';

        return;
      }


      const d = await r.json();


      login.style.display = 'none';

      dash.style.display = 'block';


      // -----------------------------------
      // SUMMARY CARDS
      // -----------------------------------

      const items = [

        [
          'Today',
          d.today_seconds
        ],

        [
          'Last 7 days',
          d.seven_day_seconds
        ],

        [
          'Last 30 days',
          d.thirty_day_seconds
        ],

        [
          'All time',
          d.total_seconds
        ],

        [
          'Sessions',
          d.sessions
        ],

        [
          'Devices',
          d.devices
        ],

        [
          'Average session',
          d.average_session_seconds
        ]

      ];


      cards.innerHTML =
        items
          .map(
            ([a, b], i) =>

              `<div class="card">

                <div class="muted">
                  ${a}
                </div>

                <div class="n">
                  ${
                    i >= 4 && i <= 5
                      ? b
                      : fmt(b)
                  }
                </div>

              </div>`
          )
          .join('');


      // -----------------------------------
      // DAILY USAGE
      // -----------------------------------

      daily.innerHTML =
        (d.daily_usage || [])

          .map((x) => {

            const dt =
              new Date(
                x.date + 'T12:00:00'
              );

            const label =
              dt.toLocaleDateString(
                undefined,
                {
                  month: 'short',
                  day: 'numeric'
                }
              );

            return `

              <tr>

                <td>
                  ${label}
                </td>

                <td>
                  ${x.active_devices}
                </td>

                <td>
                  ${x.sessions}
                </td>

                <td>
                  ${fmt(x.seconds)}
                </td>

                <td>
                  ${
                    fmt(
                      x.average_per_active_device_seconds
                    )
                  }
                </td>

              </tr>

            `;
          })

          .join('');


      // -----------------------------------
      // ANONYMOUS DEVICE TOTALS
      // -----------------------------------

      devices.innerHTML =
        d.by_device

          .map(
            (x) => `

              <tr>

                <td>
                  ${x.device_id}…
                </td>

                <td>
                  ${x.sessions}
                </td>

                <td>
                  ${fmt(x.seconds)}
                </td>

              </tr>

            `
          )

          .join('');
    }

  </script>

</body>
</html>
